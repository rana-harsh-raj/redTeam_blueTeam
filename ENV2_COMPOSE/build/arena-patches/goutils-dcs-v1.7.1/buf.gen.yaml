version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/razorpay/goutils/dcs/rpc
    except:
      - buf.build/googleapis/googleapis
      - buf.build/grpc-ecosystem/grpc-gateway
plugins:
  - name: go
    out: rpc
    opt:
      - paths=source_relative
  - name: go-grpc
    out: rpc
    opt:
      - paths=source_relative
  - name: twirp
    out: rpc
    opt:
      - paths=source_relative
  - name: grpc-gateway
    out: rpc
    opt:
      - paths=source_relative
  - name: openapiv2
    out: rpc
