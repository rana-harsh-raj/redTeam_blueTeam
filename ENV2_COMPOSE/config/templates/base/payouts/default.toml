[shadow_gateway]
    # Master kill switch — false means the framework is fully inert.
    enabled             = false
    # API monolith base URL used for proxy mode and the monolith shadow leg.
    monolith_base_url   = ""
    # Timeout on the streaming proxy leg (0 = no extra timeout).
    proxy_timeout       = "30s"
    # Timeout on buffered shadow legs (monolith forward / PS re-dispatch).
    shadow_timeout      = "10s"
    # Strict Splitz mode-resolution timeout; expiry falls back to proxy.
    splitz_timeout      = "100ms"
    # Semaphore pool bound for shadow goroutines; exhausted pool skips the
    # shadow leg (honored response is never affected).
    max_shadow_routines = 16

    # Route onboarding is config-only. Keys are lowercase "method path"
    # using the gin route pattern, e.g.:
    # [shadow_gateway.routes."get /v1/payouts/:id"]
    #     experiment_id = "<splitz-experiment-id>"
    #     ignore_fields = ["created_at"]
