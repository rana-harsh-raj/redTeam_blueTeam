approval_paths:
  single_dashboard_approve: "x SPA -> dashboard proxy -> monolith payouts/{id}/approve (OTP via Raven unless OAuth partner + enable_approval_via_oauth) -> Core::approvePayout -> is_payout_service ? PS POST /payouts/payouts_internal/{id}/approve {queue_if_low_balance} : legacy local; WFS action via monolith workflowService->createActionOnEntity when EntityMap present"
  dashboard_bulk_approve: monolith payouts/approve/bulk, OTP action approve_payout_bulk, synchronous foreach Core::approvePayout (Service.php:1507-1552)
  batch_bulk_approve: Batch payout_approval.json -> MONOLITH payouts/bulk_approve (Route.php:2319), X-Batch-Id required, <=15 rows, action A|R, NO OTP -> Core::approvePayout/rejectPayout; fetch via local payouts table (dropped in prod)
  wfs_callbacks: WFS -> PS POST /v1/payouts/payouts_internal/{id}/approve|reject (Basic payouts_live; PS success set [200,201,409]); WFS state callbacks POST /v1/workflow/state, PATCH /v1/workflow/state/{id}; monolith wf-service/state/callback is state-map bookkeeping + forward to PS /workflow/state
  twin: all MISSING except PS routes (REAL, unexercised)

