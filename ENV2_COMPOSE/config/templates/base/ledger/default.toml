[sentry]
    dsn                   = "dummy"
    enabled               = false
    logLevel              = "Error"

[events]
    enabled               = false
    debug                 = false
    [events.kafka]
        retryBackoff      = 2
        topic             = "events.ledger.v2.test" # test/live based on app mode
        maxRetry          = 10
        maxMessages       = 100
        brokers           = ["localhost:29092"]
        enableTls         = false
        userCertificate   = ""
        caCertificate     = ""
        userKey           = ""
        debugEnabled      = true

# Redis Cluster only supports database zero. In the case of a Redis Cluster,
# having multiple databases would be useless and an unnecessary source of complexity
# Refer: https://redis.io/commands/select
[cache]
    driver                = "redis"
    defaultPrefix         = "ledger"

[redis]
    host              = "localhost"
    port              = 6379
    database          = 0
    password          = ""
    dialTimeout       = 10  # time in seconds

[elasticache]
    host              = "localhost"
    port              = 6379
    password          = ""
    dialTimeout       = 10  # time in seconds
    clusterMode       = false

[mutex]
    ttl                    = 500
    [mutex.mutex]
        scope              = "ledger:mutex:"

[authz]
    consulToken         = ""
    env                 = "stage"
    mock                = false
    watchResourceGroups = [
        "ledger",
    ]

[passport]
    host = "https://edge-base.dev.razorpay.in"

[apiService]
    name = "api"
    baseUrl = "https://api.razorpay.com"
    mock = true
    [apiService.auth]
        username = "rzp_test"
        password = "ledger-api-secret"
    [apiService.connPoolConfig]
        timeout            = 1000
        keepAliveTimeout   = 30000
        maxIdleConnections = 10
    [apiService.hystrixResiliencyConfig]
        MaxConcurrentRequests     = 100
        RequestVolumeThreshold    = 10
        CircuitBreakerSleepWindow = 5000
        ErrorPercentThreshold     = 50
        CircuitBreakerTimeout     = 5000
    [apiService.retryConfig]
        InitialTimeout          = 500
        MaxTimeout              = 5000
        ExponentFactor          = 2
        MaximumJitterInterval   = 100
        RetryCount              = 3

[worker]
    queueName       = "account_create"
    maxconcurrency  = "1"
    waittime        = "10s"
    retrydelay      = "30s"

[workerRetrier]
    exponentFactor          = 2
    initialTimeout          = "2s"
    maxTimeout              = "30s"
    maximumJitterInterval   = "1s"

[queue]
    driver = "sqs"
    [queue.sqs]
        region            = "ap-south-1"
        prefix            = "https://sqs.ap-south-1.amazonaws.com/207*******67/"
        enableRetryer = true
        visibilityTimeout = 120
        waitTimeout       = 0
        [queue.sqs.httpClient]
            connectTimeoutMs        = 2000
            connKeepAliveMs         = 0
            expectContinueTimeoutMs = 0
            idleConnTimeoutMs       = 60000
            maxAllIdleConns         = 1000
            maxHostIdleConns        = 1000
            responseHeaderTimeoutMs = 25000
            tlsHandshakeTimeoutMs   = 2000
        [queue.sqs.retryer]
            numMaxRetries = 10
            minRetryDelay = 500       # time in ms
            minThrottleDelay = 1000   # time in ms
            maxRetryDelay = 25000     # time in ms
            maxThrottleDelay = 25000  # time in ms

[queueKafka]
    driver = "kafka"
    [queueKafka.kafka]
        brokers                = ["localhost:9092"]
        groupID                = "env|LEDGER_QUEUEKAFKA_KAFKA_GROUPID"
        topic                  = "env|LEDGER_QUEUEKAFKA_KAFKA_TOPIC"
        maxAttempts            = 5
        maxWait                = 10
        enableTLS              = false
        dialerTimeout          = 30
        userCertificate        = "env|LEDGER_CONSUMER_USER_CERTIFICATE"
        userKey                = "env|LEDGER_CONSUMER_USER_KEY"
        caCertificate          = "env|LEDGER_CONSUMER_CA_CERTIFICATE"
        partitionWatchInterval = 4    # time in seconds
        rebalanceTimeout       = 30   # time in seconds

[queueMakeshiftTxn]
    driver = "kafka"
    [queueMakeshiftTxn.kafka]
        brokers                = ["localhost:9092"]
        groupID                = "env|LEDGER_QUEUEMAKESHIFTTXN_KAFKA_GROUPID"
        topic                  = "env|LEDGER_QUEUEMAKESHIFTTXN_KAFKA_TOPIC"
        maxAttempts            = 5
        maxWait                = 10
        enableTLS              = false
        dialerTimeout          = 30
        userCertificate        = "env|LEDGER_MAKESHIFT_CONSUMER_USER_CERTIFICATE"
        userKey                = "env|LEDGER_MAKESHIFT_CONSUMER_USER_KEY"
        caCertificate          = "env|LEDGER_MAKESHIFT_CONSUMER_CA_CERTIFICATE"

[job]
    journal_create  = "journal_create"
    account_create  = "account_create"
    balance_update  = "balance_update"
    balance_update_pg  = "balance_update_pg"
    ledger_entry_details_create  = "ledger_entry_details_create"
    ledger_entry_details_create_pg  = "ledger_entry_details_create_pg"

[kafkaJob]
    journal_create_pg_worker_name = "env|LEDGER_KAFKAJOB_JOURNAL_CREATE_PG_WORKER_NAME"

[makeshiftTxnJob]
    pg_worker_name = "env|LEDGER_MAKESHIFTTXNJOB_PG_WORKER_NAME"

[metric]
    appName = "Ledger"
    port = ":8081"

[slack]
    channel = "C0298AJ069X"
    webhookUrl = ""
    mock = true

[pagerDuty]
    mock = true
    key = ""

[scheduler]
    command = "journal-created-sns-publish"
    ttl     = "10m"

[profiling]
    # pprof is opt-in — off everywhere by default. Enable per deployment with
    # LEDGER_PROFILING_ENABLED=true. Served on the existing metric.port (:8081).
    enabled = "env|LEDGER_PROFILING_ENABLED|false|bool"

[idempotency]
    enabled = true

[splitAccount]
    useSplitAccounts = false
    maxAccountUpdateProcessAllowed = 0
    maxLedgerEntryBalanceUpdateAllowed = 0
    ledgerEntryBalanceUpdateTimeWindow = 86400
    pgBatchSize = 1000
    mutexTTL = 10 # time in minutes
    cacheTTL = 20 # time in minutes

[outbox]
    outboxEnabled = true
    processorEnabled = true
    [outbox.crypto]
        encryptionKey = "encryptionKey"
    [outbox.outboxConfig]
        ProcessorPoolSize = 1
	    JobProcessingTimeoutMs = 2000
	    MaxAttempts = 5
        FailedJobFetchBatchSize = 1000
        PendingJobFetchBatchSize = 1000
	    WaitTimeMsAfterEmptyRead = 1000
        NoDelete = true
    [outbox.outboxConfig.expBackoffPolicy]
        InitialIntervalMs = 2000
	    Multiplier = 2
	    JitterMs = 1000

[outboxJob]
    x_journal_created_sns       = "arn:aws:sns:us-east-1:000000000000:journal-created"
    useOutboxJobsSync           = false

[snsOutboxer]
    [snsOutboxer.pubSub]
        [snsOutboxer.pubSub.journal_created]
            driver   = "sns_local"
            [snsOutboxer.pubSub.journal_created.sns]
                endpoint = "http://localhost:4100"
                topicName = "arn:aws:sns:us-east-1:000000000000:journal-created"
                region = "ap-south-1"   # arena: LocalStack queues are created in ap-south-1 (seeds/localstack/init-queues.sh); SigV4 region must match
                maxRetries = 5
                [snsOutboxer.pubSub.journal_created.sns.httpClient]
                    connectTimeoutMs        = 2000
                    connKeepAliveMs         = 0
                    expectContinueTimeoutMs = 0
                    idleConnTimeoutMs       = 60000
                    maxAllIdleConns         = 1000
                    maxHostIdleConns        = 1000
                    responseHeaderTimeoutMs = 25000
                    tlsHandshakeTimeoutMs   = 2000

[pubSub]
    [pubSub.journal_created]
        driver   = "sns_local"
        [pubSub.journal_created.sns]
            endpoint = "http://localhost:4100"
            topicArn = "arn:aws:sns:us-east-1:000000000000"
            topicName = "journal-created"
            region = "ap-south-1"   # arena: LocalStack queues are created in ap-south-1 (seeds/localstack/init-queues.sh); SigV4 region must match
            enableRetryer = true
            [pubSub.journal_created.sns.retryer]
                numMaxRetries = 10
                minRetryDelay = 500      # time in ms
                minThrottleDelay = 1000  # time in ms
                maxRetryDelay = 25000    # time in ms
                maxThrottleDelay = 25000 # time in ms

[wda]
    defaultHttpClientUrl = "https://wda-service.concierge.stage.razorpay.in"
    mock = true
    retryCount = 2

    [wda.ConnPoolConfig]
        timeout = 3000
        keepAliveTimeout = 600000
        maxIdleConnections = 10

    [wda.HystrixResiliencyConfig]
        maxConcurrentRequests = 100
        requestVolumeThreshold = 20
        circuitBreakerSleepWindow = 5000
        errorPercentThreshold = 50
        circuitBreakerTimeout = 10000

    [wda.ledger]
        namespace = "env|LEDGER_WDA_LEDGER_NAMESPACE"
        cluster = "env|LEDGER_WDA_LEDGER_CLUSTER"
        user = "env|LEDGER_WDA_LEDGER_USER"
        password = "env|LEDGER_WDA_LEDGER_PASSWORD"

    [wda.api]
        namespace = "env|LEDGER_WDA_API_NAMESPACE"
        cluster = "env|LEDGER_WDA_API_CLUSTER"
        user = "env|LEDGER_WDA_API_USER"
        password = "env|LEDGER_WDA_API_PASSWORD"

[splitz]
    endpoint          = "https://splitz.dev.razorpay.in"
    authKey           = "ledger"
    authSecret        = "env|LEDGER_SPLITZ_AUTHSECRET|splitz_secret"
    mock              = false
    retryCount        = 2
    [splitz.ConnPoolConfig]
        timeout = 500 # time in milliseconds
        keepAliveTimeout = 600000 # time in milliseconds
        maxIdleConnections = 10
    [splitz.HystrixResiliencyConfig]
        maxConcurrentRequests = 100
        requestVolumeThreshold = 20
        circuitBreakerSleepWindow = 5000 # time in milliseconds
        errorPercentThreshold = 50
        circuitBreakerTimeout = 10000 # time in milliseconds
    [splitz.ExperimentIdMap]
        experiment = "N16JHEJyTMa5YI"
        merchantBalanceAsyncUpdateExperiment = "OL3BMOeU1b2GgO"
        ledgerMakeshiftDualWriteExperiment = "OLmdiifT69WGrd"
        merchantBalanceSegregationExperiment = "S0sZfZiAxEQfIY"
