[splitz]
    host                = "https://splitz.dev.razorpay.in"
    timeout             = 200  #timeout : 200ns later converted to 200ms before sending request to Splitz
    keepAliveTimeout    = 60000  #keepAliveTimeout : 60000ns later converted to 60s before sending request to Splitz
    maxIdleConnections  = 10
    # Disabled for e2e (same as prod): default.toml's client_side_eval=true with a 5min
    # BigCache TTL means a merchant whitelisted moments before a test's payout call is
    # often invisible to this cache, causing an intermittent fallback to a separate,
    # broken API-DB read path (getFreePayoutsSlab). Evaluating live removes that race.
    client_side_eval    = false
    [splitz.auth]
        username        = "env|PAYOUTS_SPLITZ_AUTH_USERNAME"
        password        = "env|PAYOUTS_SPLITZ_AUTH_PASSWORD"
    [splitz.httpclient.resiliency]
        maxconcurrentrequests       = 100
        requestvolumethreshold      = 20
        circuitbreakersleepwindow   = 5000
        errorpercentthreshold       = 50
        circuitbreakertimeout       = 10000
    [splitz.httpclient.httpclient]
        timeout     = 200  #timeout : 200ns later converted to 200ms before sending request to Splitz

