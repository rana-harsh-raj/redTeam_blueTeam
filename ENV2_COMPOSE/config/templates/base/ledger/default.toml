[app]
    appEnv                = "default"
    appMode               = "test"
    serviceName           = "ledger"
    hostname              = "ledger.razorpay.com"
    port                  = "0.0.0.0:8080"   # arena: ledger-api must be reachable from payouts/fts/x-balances inside the arena network (upstream default is loopback)
    shutdownTimeout       = 2
    shutdownDelay         = 2
    gitCommitHash         = "nil"
    errorMappingServices  = ["platform/ledger", "pkg/spine"]
    logLevel              = "info"
    isMirror              = false
    isMakeshift           = false

[db]
    enableTrafficSplit                = false
    [db.rx]
        isEnabled                     = true
        [db.rx.writer]
            debug                     = true
            [db.rx.writer.ConnectionConfig]
                dialect               = "postgres"
                protocol              = "tcp"
                url                   = "127.0.0.1"
                port                  = "5432"
                username              = "ledger"
                password              = "ledger"
                sslMode               = "disable"
                name                  = "ledger"
            [db.rx.writer.ConnectionPoolConfig]
                maxOpenConnections    = 5
                maxIdleConnections    = 5
                connectionMaxLifetime = 0
                connectionMaxIdleTime = 0
        [db.rx.cache]
            isEnabled         = false
            isMcacheEnabled   = false
            defaultExpiration = 10
            cleanupInterval   = 5
    [db.pg]
        isEnabled                     = true
        [db.pg.writer]
            debug                     = true
            [db.pg.writer.ConnectionConfig]
                dialect               = "postgres"
                protocol              = "tcp"
                url                   = "127.0.0.1"
                port                  = "5432"
                username              = "ledger"
                password              = "ledger"
                sslMode               = "disable"
                name                  = "ledger"
            [db.pg.writer.ConnectionPoolConfig]
                maxOpenConnections    = 5
                maxIdleConnections    = 5
                connectionMaxLifetime = 0
                connectionMaxIdleTime = 0
        [db.pg.cache]
            isEnabled         = false
            isMcacheEnabled   = false
            defaultExpiration = 10
            cleanupInterval   = 5
    [db.makeshift]
        isEnabled                     = false
        [db.makeshift.writer]
            debug                     = true
            [db.makeshift.writer.ConnectionConfig]
                dialect               = "mysql"
                protocol              = "tcp"
                url                   = "127.0.0.1"
                port                  = "3306"
                username              = "root"
                password              = ""
                sslMode               = "disable"
                name                  = "" # set name of makeshift DB here
            [db.makeshift.writer.ConnectionPoolConfig]
                maxOpenConnections    = 5
                maxIdleConnections    = 5
                connectionMaxLifetime = 0
                connectionMaxIdleTime = 0
        [db.makeshift.cache]
            isEnabled                 = false
            isMcacheEnabled           = false
            defaultExpiration         = 10
            cleanupInterval           = 5


[apiDb]
    [apiDb.ConnectionConfig]
        dialect               = "mysql"
        protocol              = "tcp"
        url                   = "127.0.0.1"
        port                  = "23306"
        username              = "root"
        password              = "123"
        sslMode               = "disable"
        name                  = "api_test"
    [apiDb.ConnectionPoolConfig]
        maxOpenConnections    = 5
        maxIdleConnections    = 5
        connectionMaxLifetime = 0
        connectionMaxIdleTime = 0

[apiTiDb]
    [apiTiDb.ConnectionConfig]
        dialect               = "mysql"
        protocol              = "tcp"
        url                   = "127.0.0.1"
        port                  = "23306"
        username              = "root"
        password              = "123"
        sslMode               = "disable"
        name                  = "api_test"
    [apiTiDb.ConnectionPoolConfig]
        maxOpenConnections    = 5
        maxIdleConnections    = 5
        connectionMaxLifetime = 0
        connectionMaxIdleTime = 0

[tracing]
    serviceName             = "ledger"
    enabled                 = false
    logSpans                = true
    host                    = "localhost"
    port                    = 6831

[telemetry]
    serviceName           = "ledger"
    serviceNamespace      = "platform/ledger"
    exporterHost          = "env|LEDGER_TELEMETRY_EXPORTER_HOST|localhost"
    exporterPort          = "env|LEDGER_TELEMETRY_EXPORTER_PORT|4318"
    samplingRatio         = 1.0
    enableHTTPClientSpans = true
    httpSkipPaths         = ["/health", "/healthz", "/ready", "/readiness", "/live", "/liveness", "/metrics", "/twirp/rzp.common.health.v1.HealthCheckAPI/Check", "/commit.txt"]
    enableCanonicalLogs   = false
    enableTraceCorrelation = false

    [telemetry.spanLimits]
        attributeValueLengthLimit = 4096
        attributeCountLimit       = 1000

