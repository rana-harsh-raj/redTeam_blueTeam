queued_scheduled_on_hold:
  low_balance_dequeue:
    trigger_cron: POST /v1/cron/process_queued_low_balance_payouts (FastCron, cadence UNKNOWN)
    trigger_event: POST /v1/payouts_internal/balance_update_event {balance_id, balance} from monolith QueuedInitiate (only live && Splitz PAYOUTS_SERVICE_CRON_TRIGGER_FOR_QUEUED_PAYOUTS disabled; being retired)
    algorithm: API-DB balance.updated_at >= now-6h (payouts/internal/app/balance/repo.go:26-51) -> GET monolith /internal_balances_queued {balance_ids} -> greedy first-fit amount+fee -> queued_payout job
    source: payouts/internal/routing/router/cron_routes.go:60-69; helperQueuedPayouts.go:18-47,91-102; api/app/Models/Payout/Core.php:4083-4104, Service.php:2892-2916
    twin: INCORRECT (balance.updated_at stale; no balance_update_event caller)
  partner_bank_hold:
    trigger_cron: POST /v1/cron/process_queued_payouts (partner-bank-down recovery, not low balance)
    health_source: FTS POST PS /v1/notify/health/update -> Redis hash partner_bank_health (payouts internal_routes.go:11-22; fundAccountPayoutDirect.go:577-604); FTS side downtime/notification.go:440-519 (feature PSDowntimeNotificationOnHold)
  beneficiary_bank_on_hold:
    trigger_cron: POST /v1/cron/process_beneficiary_bank_on_hold_payouts
    gate: feature payouts_on_hold, IMPS only, Redis IFSC-prefix down map (writer UNKNOWN); SLA GET monolith /merchant/on_hold_slas_internal; breach -> failed
    source: payouts/internal/app/payouts/onHoldHelper.go:16-153,309-341
    twin: cron-driver path wrong (/process_on_hold_payouts) -> never fires
  scheduled:
    slots: "[9,13,17,21] IST, <= 3 months (schedule.go:23,55)"
    trigger_cron: POST /v1/cron/process_scheduled_payouts (scheduled_at < now AND status in (pending, scheduled)); pending at slot -> rejected
    twin: REAL (V24b passes with time travel)
  batch_submitted:
    trigger_cron: POST /v1/cron/process_batch_submitted_payouts
    twin: not driven by cron-driver (MISSING)
  reservation_reconcile:
    trigger_cron: POST /v1/cron/process_inflight_reservation_reconciliation (every 5 min assumed; heartbeat TTL 12.5 min)
    twin: cron-driver path wrong (/reservation_reconcile) -> never fires

