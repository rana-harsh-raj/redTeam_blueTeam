[mutex]
    # PRODUCTION PARITY (M1 / DEV-002): ledger/config/prod-live.toml:326 sets
    # `ttl = 60000` (milliseconds). The twin previously carried 500 -- the value
    # inherited from the upstream default.toml:292 -- a 120x shorter lease on
    # Ledger's journal/idempotency mutex, so a concurrency probe would see locks
    # expiring mid-operation and duplicate journals production would suppress.
    # Stacked on the ledger-gate header drop (DEV-001) it left ledger with no
    # effective duplicate-suppression on the payouts leg at all.
    ttl                    = 60000  # in millisecond; = ledger/config/prod-live.toml:326
    [mutex.mutex]
        scope              = "ledger:mutex:"

[authz]
    consulToken         = ""
    env                 = "test"
    mock                = true   # was false; consul-backed authz.NewEnforcer would try to reach a real consul cluster. Mocked -> EnforcerMock, no dial.
    watchResourceGroups = [
        "ledger",
    ]

[passport]
    host = "http://127.0.0.1:1"  # unused while authz.mock=true (boot.go: InitPassportHandler(Config.Passport, Config.AuthZ.Mock) shares the flag) — placeholder so no real host is configured either way

[apiService]
    name = "api"
    baseUrl = "http://127.0.0.1:1"  # mock=true already; placeholder so no real host is configured either way
    mock = true
    [apiService.auth]
        username = "rzp_test"
        password = "ledger-api-secret"
    [apiService.connPoolConfig]
        timeout            = 1000
        keepAliveTimeout   = 30000
        maxIdleConnections = 10
    [apiService.hystrixResiliencyConfig]
        MaxConcurrentRequests     = 100
        RequestVolumeThreshold    = 10
        CircuitBreakerSleepWindow = 5000
        ErrorPercentThreshold     = 50
        CircuitBreakerTimeout     = 5000
    [apiService.retryConfig]
        InitialTimeout          = 500
        MaxTimeout              = 5000
        ExponentFactor          = 2
        MaximumJitterInterval   = 100
        RetryCount              = 3

[worker]
    queueName       = "account_create"
    maxconcurrency  = "1"
    waittime        = "10s"
    retrydelay      = "30s"

[workerRetrier]
    exponentFactor          = 2
    initialTimeout          = "2s"
    maxTimeout              = "30s"
    maximumJitterInterval   = "1s"

[queue]
    # driver="sqs" (the un-suffixed dialect) ignores the Endpoint field entirely and always
    # builds a client against real AWS SQS regardless of Prefix/Region here (confirmed by
    # reading goutils/worker/v3/queue/broker/sqs: sqs.New() never calls WithEndpoint). The
    # ledger api binary only constructs the queue client (InitWorkerPkg) and never starts
    # polling it (Worker.Start is only called by registerWorkerHandler, which InitApi never
    # calls) so this is inert for the api boot/health check. For the worker binary — which DOES
    # call Worker.Start()/Dequeue at boot — we use the "sqs_local" dialect below instead, which
    # does call WithEndpoint(conf.Endpoint) and stays fully local.
    driver = "sqs_local"
    [queue.sqs]
        region                  = "ap-south-1"   # arena: LocalStack queues are created in ap-south-1 (seeds/localstack/init-queues.sh); SigV4 region must match
        prefix                  = "{{SVC.localstack.url}}/000000000000/"
        endpoint                = "{{SVC.localstack.url}}"
        useAnonymousCredentials = false                  # arena: sign with the synthetic env creds so LocalStack resolves region ap-south-1 (anonymous -> us-east-1 -> NonExistentQueue)
        enableRetryer = true
        visibilityTimeout = 120
        waitTimeout       = 0
        [queue.sqs.httpClient]
            connectTimeoutMs        = 2000
            connKeepAliveMs         = 0
            expectContinueTimeoutMs = 0
            idleConnTimeoutMs       = 60000
            maxAllIdleConns         = 1000
            maxHostIdleConns        = 1000
            responseHeaderTimeoutMs = 25000
            tlsHandshakeTimeoutMs   = 2000
        [queue.sqs.retryer]
            numMaxRetries = 10
            minRetryDelay = 500       # time in ms
            minThrottleDelay = 1000   # time in ms
            maxRetryDelay = 25000     # time in ms
            maxThrottleDelay = 25000  # time in ms

[queueKafka]
    # Only used by cmd/worker_kafka (not booted in this spike). Left pointing at localhost.
    driver = "kafka"
    [queueKafka.kafka]
        brokers                = ["{{SVC.kafka.host}}:{{SVC.kafka.port}}"]
        groupID                = "env|LEDGER_QUEUEKAFKA_KAFKA_GROUPID"
        topic                  = "env|LEDGER_QUEUEKAFKA_KAFKA_TOPIC"
        maxAttempts            = 5
        maxWait                = 10
        enableTLS              = false
        dialerTimeout          = 30
        userCertificate        = "env|LEDGER_CONSUMER_USER_CERTIFICATE"
        userKey                = "env|LEDGER_CONSUMER_USER_KEY"
        caCertificate          = "env|LEDGER_CONSUMER_CA_CERTIFICATE"
        partitionWatchInterval = 4    # time in seconds
        rebalanceTimeout       = 30   # time in seconds

[queueMakeshiftTxn]
    # Only used by cmd/worker_makeshift_txn (not booted in this spike). Left pointing at localhost.
    driver = "kafka"
    [queueMakeshiftTxn.kafka]
        brokers                = ["{{SVC.kafka.host}}:{{SVC.kafka.port}}"]
        groupID                = "env|LEDGER_QUEUEMAKESHIFTTXN_KAFKA_GROUPID"
        topic                  = "env|LEDGER_QUEUEMAKESHIFTTXN_KAFKA_TOPIC"
        maxAttempts            = 5
        maxWait                = 10
        enableTLS              = false
        dialerTimeout          = 30
        userCertificate        = "env|LEDGER_MAKESHIFT_CONSUMER_USER_CERTIFICATE"
        userKey                = "env|LEDGER_MAKESHIFT_CONSUMER_USER_KEY"
        caCertificate          = "env|LEDGER_MAKESHIFT_CONSUMER_CA_CERTIFICATE"

