# TWIN_SPEC/route-matrix.yaml
# Which path a payout takes, per origin and merchant class, and the exact selectors.
# Each row: path -> selector (config key / flag / experiment) -> production default (if derivable) -> twin state.
version: 2
generated: 2026-09-05
updated: 2026-09-07   # M4 T12: corrections C-003/C-006/C-007/C-010/C-011/C-013, T02 #4/#7/#11, T04 C2, T05 #2/#4; new sections direct_source_selection, direct_status_transports, direct_reconciliation_routes
legend:
  prod_default: value that source/config shows for production, or UNKNOWN (Splitz/DCS runtime values are never in a repo)
  twin: what ENV2_COMPOSE does today (REAL / SUBSTITUTE / MISSING / INCORRECT)
  fidelity (M4 sections): real | substitute | expected-failure | missing   # per m4-decisions.md D-006

# ----------------------------------------------------------------------------
ingress_paths:

  public_api_create:
    description: Merchant API key -> Edge/Kong -> API monolith POST /v1/payouts -> PS
    hops:
      - {hop: Kong, plugins: [basic-auth-x (merchant key), consumer-authentication, impersonation-grant, upstream-jwt (passport X-Passport-JWT-V1, RS256, 300s), authz-enforcer (shadow_mode=true, route whitelisted)], source: terraform-kong/prod/api/api.tf, edge/kong-plugins/kong-plugin-upstream-jwt/kong/plugins/upstream-jwt/access.lua:86-205}
      - {hop: monolith, route: payout_create ($private only; NOT $admin), source: api/app/Http/Route.php:2311,5780}
      - {hop: monolith middleware order, value: [Authenticate, BusinessAuth, SDKMetric, AdminAccess, UserAccess, SubscriptionProxy, ExcelStoreProxy, FailureEventsInterceptor, Workflow, MerchantIpFilter, EventTracker, P2p, HttpEncryptionMiddleware, MerchantIdempotencyHandler, RequestContextHandler], source: api/app/Http/Kernel.php:55-93}
    branch_selector:
      - name: direct_diversion
        selector: DirectToPayoutsServiceGate::shouldDivert() -> live mode && !app-auth && body.merchant_id == caller && Splitz(app.payout_create_direct_ps_splitz_experiment_id).variant == 'enable'
        source: api/app/Models/Payout/DirectToPayoutsServiceGate.php:59-136; PayoutController.php:163-209
        effect: "monolith runs NO business logic; forwards to PS POST /v1/payouts with passport, X-Payouts-Service-Proxy: 0, NO actor headers; relays PS status/body verbatim"
        prod_default: UNKNOWN (Splitz runtime); code fails safe to classic on any Splitz error
      - name: classic_v2_passthrough
        selector: isMonolithProxyForPayoutServiceMerchant(balance) (live + merchant migrated flag, excludes partner OAuth)
        source: api/app/Models/Payout/Service.php:631,8169-8196; Services/PayoutService/Create.php:133-186
        effect: validations 1-5 run (strict private auth, account number translation, BEFORE_CREATE rules, card mode); skips checkIfPayoutIsAllowed; forwards to PS with passport + actor headers; NO X-Payouts-Service-Proxy header
      - name: legacy_v1_enrichment
        selector: not diverted and not V2 -> Processor\Base::createPayout -> createPayoutViaMicroservice when isPayoutServiceIfApplicable
        source: api/app/Models/Payout/Processor/Base.php:286-315,5147-5245
        effect: "preValidations (hold funds, BLOCK_VA_PAYOUTS), pricing/fund-account/credits fetched on monolith, X-Payouts-Service-Proxy: 1, actor headers"
      - name: fully_local
        selector: merchant not migrated to PS
        effect: monolith-local payout (Shield evaluated in Processor/Base.php:5451); out of twin scope (PS is source of truth in prod)
    ps_entry:
      route: POST /v1/payouts (root), /payouts/payouts_internal (app auth), /payouts/internal_contact_payout, /payouts/rzp_fees_payout
      source: api/app/Services/PayoutService/Create.php:30-36; payouts/internal/routing/router/payout_routes.go
      auth: Basic [auth.api] + X-Passport-JWT-V1 (kid apiv1|edgev1|edgev2)
      idempotency: header X-Payout-Idempotency passed through unchanged (Create.php:188-206); PS Redis mutex 20 min + SHA-256 body hash (idempotency_key.go)
    twin: SUBSTITUTE(kong-lite mints passport, calls PS directly) — monolith ingress MISSING; only the direct_diversion-shaped request is exercised

  dashboard_create:
    description: RazorpayX dashboard (x SPA) -> dashboard PHP proxy -> monolith POST /v1/payouts_with_otp -> PS
    hops:
      - {hop: x SPA, call: fetch.post('/payouts_with_otp'), source: x/src/js/api/outflow.js:88}
      - "{hop: dashboard PHP proxy, route: /merchant/api/{mode}/{path}, identity: Basic rzp_<mode>_<merchantId>:api.auth_pass + X-Dashboard-User-Role/Id/Email/2FA-Verified, source: dashboard/app/Http/routes.php:186,422; dashboard/app/Admin/ApiRequestAny.php:141-503}"
      - {hop: monolith, route: payout_create_with_otp ($private,$userWhitelist,$proxy; feature PAYOUT), source: api/app/Http/Route.php:5595,7350,8002,20313-20315}
      - {hop: role check, mechanism: UserAccess::getRoutePermission -> Route::$bankingRoutePermissions (CREATE_PAYOUT); CAC merchants -> AccessAuthorizationService::hasAccessAllowedV2 -> AuthzEnforcer (mock by default AUTHZ_XPLATFORM_ENFORCER_MOCK=true), source: api/app/Http/Middleware/UserAccess.php:257-307,518-527; api/app/Http/AccessAuthorizationService.php:56-102}
      - {hop: OTP, mechanism: User\Core::verifyOtp via Raven, action create_payout, source: api/app/Models/User/Core.php:6344-6473; Service.php:1834-1840}
      - {hop: newer surfaces, note: xperience Go BFF verifies passport (apiv1/edgev1) for /xperience*; apps/shell verifies X-Passport-JWT-V1 via JWKS}
    twin: MISSING (no dashboard, no OTP, no role enforcement)

  internal_app_create:
    description: internal apps (payout_links, vendor_payments, xpayroll, settlements, capital, scrooge, cross-border) -> monolith payouts_internal / internalContactPayout / composite_payout_internal
    source: api/app/Http/Route.php:6593-6594 ($internal); vendor-payments/internal/payout/core.go:84; xperience/internal/app/client/apiservice/create_petty_cash_payout.go:15
    ps_entry: /payouts/payouts_internal with X-Payout-Actor-Type application; PS identifies app via passport consumer.Meta.name allowlist (payouts/internal/auth/headers.go:11-25)
    twin: MISSING

  bulk_create:
    description: dashboard upload -> Batch (payout.json) -> https://api.razorpay.com/v1/payouts/bulk -> PS POST /v1/payouts/bulk
    batch_contract: "{chunk: 5 rows, threads: 10, idempotency_key: \"batch_\"+BatchEntry.id (14-char CustomIdGenerator), headers: [X-Batch-Id, X-Creator-Id, X-Creator-Type, X-Entity-Id], auth: Basic rzp_<mode>_<entityId>:BATCH_API_SECRET, retry: 5x5s fixed on non-2xx or item http_status_code 500}"
    source: batch/src/main/resources/payout.json:49-68; BulkApiCallDataProcessorImpl.java:106,163,211-281; RestCallUtils.java:55-69
    ps_contract: {route: POST /v1/payouts/bulk, auth: BasicAuth(API,Workflow)+Passport, max_rows: 15 (MaxBulkPayoutsLimit), concurrency: Splitz BulkPayoutConcurrencyExperiment -> CreateBulkPayoutsConcurrent else sequential, idempotency: bulk_idempotency_keys UNIQUE(idempotency_key,merchant_id)}
    source: payouts/internal/routing/router/payout_internal_routes_with_passport.go:21-27; bulkPayoutsProcessor/{service.go:59-86,152-162,constants.go:6,repo.go:28-35}
    twin: PS route REAL; Batch caller MISSING

