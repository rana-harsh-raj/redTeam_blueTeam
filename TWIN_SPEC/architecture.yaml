system_of_record:
  payout: Payouts Service MySQL (`payouts` DB). Monolith reads PS rows over a second connection (Connection::PAYOUT_SERVICE_DATABASE, api/database/Connection.php:37) and mirrors into its own tables via queue-backed dual-write; the monolith's physical `payouts` table is reported dropped in prod (Slack 2026-09-03) while code still targets it. CONFIRMED (code) / UNKNOWN (physical table state).
  money: "Ledger tenant X (Postgres). `payout_initiated` journal is the balance authorization for Shared/pool accounts (atomic conditional UPDATE accounts.balance). Direct/current accounts: the balance authority is x-balances balance.balance (or the PS banking_account_statement_details.gateway_balance mirror), NOT Ledger; direct_account_x journals (keyed by banking_account_stmt_detail_id) are a mirror with min_balance NULL, and at this HEAD are posted only by the monolith's own statement-fetch linking (api BankingAccountStatement/Core.php:5175-5228, feature da_ledger_journal_writes) — PS posts none (payouts core.go:7284,7356 commented). CONFIRMED (M4 C-004/C-010; T03 Finding 6; T04 §2)."
  transfer: FTS MySQL (`transfers`, `attempts`, `transfer_meta`). CONFIRMED.
  merchant_config: monolith `merchants`+`features` (legacy path) or ASV(gRPC)+API-DB features+DCS (experiment path, DCS wins on collision). Splitz MerchantConfigViaAsvAndDcs selects. CONFIRMED (mechanism) / UNKNOWN (which merchants).
  beneficiaries: CFA MongoDB (DocumentDB in prod); PS hot create path fetches `fund_accounts_internal` from the monolith (INFERRED).
  bank_gateway: Mozart (routing map namespace/gateway/version/action; response has no meta; FTS classifies). CONFIRMED.

families:

  public_api_payouts:
    path: merchant API key -> Edge/Kong (basic-auth-x, impersonation-grant, upstream-jwt passport RS256 300s, authz-enforcer shadow) -> monolith POST /v1/payouts ($private) -> [direct diversion | V2 pass-through | legacy V1 enrichment] -> PS POST /v1/payouts -> ledger payout_initiated -> created -> fts_async_processing -> monolith create_fta -> FTS /v1/transfer -> Mozart -> FTS status webhook -> monolith /update_fts_fund_transfer -> PS details+status -> processed -> Stork payout.processed (+ async ledger payout_processed for Shared)
    key_facts:
      - No rate limiting on payout routes; ip-restriction-x rollout 0; authz shadow mode + whitelisted route (terraform-kong/prod/api/api.tf:6204-6218; variables.tf:1920-1927). CONFIRMED
      - Idempotency: X-Payout-Idempotency, monolith idempotency_keys UNIQUE(idempotency_key, merchant_id), mutex 1200 s, SHA-256 body hash, cached replay, fail-closed; PS Redis mutex 20 min + hash; header passed through unchanged. CONFIRMED
      - PS moves payout to initiated BEFORE calling create_fta; create_fta FTS leg has a 1 s sync timeout and swallows failures into an async requeue (api Processor/Base.php:235,1024-1132). CONFIRMED
      - Monolith identifies the payout's merchant deterministically from the PS DB row. CONFIRMED
      - Cutover (payouts-proxy-cutover) is devstack-only; prod traffic goes through the monolith. CONFIRMED
    confidence: CONFIRMED

  dashboard_originated_payouts:
    path: x SPA -> dashboard PHP proxy (/merchant/api/{mode}/{path}; Basic rzp_<mode>_<merchantId>:shared secret; X-Dashboard-User-Role/Id/Email/2FA-Verified) -> monolith payouts_with_otp (role via bankingRoutePermissions; CAC merchants via AuthzEnforcer, mock by default; OTP via Raven) -> same PS path as public API (actor headers, X-Payouts-Service-Proxy) ; newer /xperience* surface uses real passport (apiv1/edgev1) via xperience Go BFF; apps/shell verifies X-Passport-JWT-V1 via JWKS
    key_facts:
      - No merchant_users membership check inside api; role comes from the dashboard session header. CONFIRMED
      - ICICI current-account 2FA is a separate FTS-issued OTP (create_otp), feature ICICI_2FA. CONFIRMED
      - Workflow applicability depends on auth type: Private (API key) + skip_approval_workflow_for_api skips workflow; dashboard/proxy auth reaches it. CONFIRMED
    confidence: CONFIRMED

  shared_ledger_backed_accounts:
    path: PS create -> Ledger JournalAPI/Create payout_initiated (identifiers banking_account_id) -> created -> FTS pool source_account_mappings (priority, channel health, mode caps) -> bank -> processed -> async payout_processed (identifiers fts_fund_account_id + fts_account_type lowercased from FTS webhook bank_account_type NODAL/CURRENT/CORP_CARD) ; FTS FAILED -> payout reversed (map) -> reversal row -> payout_reversed journal
    key_facts:
      - Ledger accounts per merchant: MerchantBalance, VendorPayable, CommissionIncome, OutputGST (banking_account_id); FtsReceivable/FtsPayable nodal and current pairs (fts_fund_account_id); parents seeded by ledger (shared_account_x.go:199-231); merchant-side onboarding caller not found in readable repos (likely monolith). CONFIRMED/UNKNOWN
      - Journal dedupe is app-level only (no unique index) — must be preserved. CONFIRMED
    confidence: CONFIRMED

  direct_current_account_rails:
    path: "PS create (Direct; precondition BASD/x-balances status active|under_maintenance, core.go:693-710) -> queueing gate (reservationGate if DCS direct_accounts/Configs.in_flight_reservation_enabled else balanceBufferGate; balance from x-balances GET /v1/balances/{id} when Splitz fetch_balance_entity_from_x_balance, else PS banking_account_statement_details.gateway_balance — no monolith balance call on the PS Direct path) -> no ledger call -> [monolith create_fta | PS-direct POST /v1/transfer] with preferred_source_account_id = banking_accounts.fts_fund_account_id -> FTS matches source_accounts.fund_account_id; direct_account_routing_rules consulted only when >1 SA (merchant rule -> default rule -> oldest) -> bank -> processed; FTS FAILED -> payout failed (PS map: rbl/icici/axis/yesbank/idfc/slice; monolith map: no SLICE) with no reversal row; PS posts NO Direct journal at any point (BAS-linking ledger call deprecated/commented); Direct DA accounting (direct_account_x keyed by banking_account_stmt_detail_id) is posted only by the monolith statement-fetch linking on a matched statement, and not at all for PS-recon merchants (EF-004)"
    key_facts:
      - Reservations are Redis-only (no DB table), 6 h TTL, Lua reserve, reconciler cron every ~5 min with fail-closed heartbeat. CONFIRMED
      - Partner-bank downtime reaches PS via FTS POST /v1/notify/health/update -> Redis partner_bank_health. CONFIRMED
      - "M4 corrections (T02 #1/#2/#10, C-003, C-004/C-010): PS has no routing-rule concept; a routing rule is not required with one source account; PS never posts a Direct journal before or after BAS linking; balance authority is x-balances/BASD, not the monolith or Ledger. CONFIRMED"
      - "payouts.transaction_id for Direct is NULL until BAS recon sets it to the bas id (core.go:7275); FTS failed is refused once it is set (V19). CONFIRMED"
    confidence: CONFIRMED

  approval_and_workflow:
    path: PS IsWorkflowApplicable -> WorkflowAPI/Create (no config_id; WFS resolves by owner tuple) -> pending -> approver via dashboard (OTP) or Batch (monolith bulk_approve, no OTP) -> monolith Core::approvePayout -> WFS ActionAPI (string-match role rules) -> Cadence -> callbacks POST /v1/payouts/payouts_internal/{id}/approve|reject (Basic payouts_live; success [200,201,409]) -> PS resumes/rejects
    key_facts:
      - WFS never fires an expiry callback; 3-month auto-cancel is a monolith cron (PENDING->rejected, QUEUED->failed). CONFIRMED
      - No self-approval prevention in WFS/PS/monolith code. CONFIRMED
      - enable_approval_via_oauth is an OTP bypass for OAuth partner approvals. CONFIRMED
      - PS approve/reject routes are Basic-auth only, no passport, no role check. CONFIRMED
    confidence: CONFIRMED

  queued_low_balance:
    path: create with queue_if_low_balance -> ledger insufficient -> queued (Stork payout.queued) -> cron process_queued_low_balance_payouts (balance.updated_at within 6 h on API-DB + GET monolith internal_balances_queued) or monolith balance_update_event -> queued_payout job -> created -> normal path
    key_facts:
      - No ORDER BY on dequeue candidates (first-fit by list order). CONFIRMED
      - balance_update_event is migration-transitional (retired when Splitz PAYOUTS_SERVICE_CRON_TRIGGER_FOR_QUEUED_PAYOUTS on). CONFIRMED
    confidence: CONFIRMED (cadence UNKNOWN)

  scheduled_and_on_hold:
    scheduled: slots 9/13/17/21 IST within 3 months; cron process_scheduled_payouts; pending at slot -> rejected. CONFIRMED
    on_hold_beneficiary_bank: feature payouts_on_hold, IMPS, Redis IFSC map (writer UNKNOWN), SLA from monolith on_hold_slas_internal, breach -> failed; cron process_beneficiary_bank_on_hold_payouts. CONFIRMED/UNKNOWN
    on_hold_partner_bank: cron process_queued_payouts; health from FTS notify. CONFIRMED

  success_failure_return_reversal:
    success: Mozart SUCCESS -> FTS PROCESSED -> webhook -> processed (+utr) -> payout.processed, transaction.created after ledger. CONFIRMED
    failure: "bank failure codes -> FTS FAILED -> Shared: payout reversed + reversal row + payout_reversed journal; Direct (listed channels): payout failed, no reversal row, no ledger. CONFIRMED"
    return: Mozart RETURNED / return_utr -> FTS REVERSED (from PROCESSED) -> webhook reversed -> payout reversed; statement-based return detection via XAS/BAS is the alternative for Direct (see lane 11). CONFIRMED (FTS) / see lane 11
    ambiguous: DUPLICATE_TXN pending; CBS:188 / ns:E404 cutoffs; unmapped codes pending; MaxReInitiateAttemptCount 2. CONFIRMED
    stuck_initiated: no PS reconciliation job; no admin action from initiated to failed/reversed; alerting aggregate only. CONFIRMED

  payouts_to_monolith_to_fts:
    see route-matrix.yaml ps_to_fts_paths.ps_monolith_create_fta_fts. CONFIRMED (default path)
  direct_payouts_fts:
    PS pkg/fts direct create when IsFTSRequestFromPayoutsService (Splitz ExperimentForFtsRequestFromPayoutsService + DCS payouts_to_fts_async_processing). CONFIRMED (code) / UNKNOWN (rollout)
  fts_to_monolith_to_payouts:
    FTS legacy webhook [webhook.payout.transfer_status] -> monolith /update_fts_fund_transfer (fts credential) -> details then status to PS; 3x200 s retry; no DLQ. CONFIRMED
  direct_fts_to_payouts:
    FTS -> PS POST /v1/payouts_internal/transfer_status_webhook when Splitz CreateTransferMetaRollout on AND transfer_meta.origin_service == payouts AND [payouts_service.update_fts_fund_transfer] configured; monolith-created transfers have origin API. CONFIRMED (code) / UNKNOWN (rollout)
  kafka_status_propagation:
    FTS Splitz FireStatusUpdateKafka -> Kafka rx-fts-status-update-events (JSON transfer map, key source_id, 2 partitions/3 replicas) exclusive of HTTP; PS consumers fts_status_updates (drops reversed/failed) + retry topic rx-fts-status-update-retry-events (PS republishes, no cap); api has its own consumer. CONFIRMED / UNKNOWN (rollout)
  merchant_webhooks:
    PS -> Stork ProcessEvent (protobuf Twirp, Basic payout, service rx-live) -> Stork delivers raw payload with X-Razorpay-Event-Id + HMAC-SHA256 X-Razorpay-Signature; exponential backoff 15 attempts/24 h; no dedupe; no ordering; daily disable crons. Subscriptions created via monolith WebhookV2Controller. CONFIRMED
  account_statements_and_reconciliation:
    "M4 (T03): three ingestion implementations (PS worker rbl_banking_account_statement, monolith RblBankingAccountStatement job, XAS multi-bank fetch) and three matchers (XAS, monolith, PS-on-ART-instruction) exist; which cron is live is UNKNOWN. BASD rows are created by the monolith directly in the PS DB. Only PS produces x_account_statement_source_event. XAS repair outbound = POST monolith /v1/banking_account_statement/payout_update -> PS UpdatePayoutAfterBASRecon (transaction_id = bas id; credit on failed -> reversed). Full map: reports/implementation/m4-source-map.md §1.5 and route-matrix.yaml direct_reconciliation_routes. Lane-11 report (reports/fidelity/raw/11_statements_recon_repair.md) mis-scoped matching to XAS alone (C-T03-1). CONFIRMED"
  migration_proxy_cutover:
    Kong cutover devstack-only; monolith three proxy mechanisms (direct 0 / legacy 1 / V2 none); PS shadow gateway [shadow_gateway] disabled (loop guard X-PS-Proxied); monolith Repository PS-first no-DB-fallback by default; PS ApiDB leg hardcoded off; dual-write flags env-injected (default reverse=true forward=false). CONFIRMED (code) / UNKNOWN (runtime values)
  bulk_payouts:
    Batch payout.json -> public API /v1/payouts/bulk (chunks of 5, idempotency batch_<id>) -> PS bulk (max 15, Splitz concurrency); approve via monolith payouts/bulk_approve. CONFIRMED
  admin_and_repair:
    PS ManualAction 3 cases; monolith admin routes (cancel, manual_action, manual status, retry, workflow_retry); FTS ART attempts routes; no stuck-initiated repair path in PS. CONFIRMED

