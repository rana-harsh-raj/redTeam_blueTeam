  env2_public_api_payout_idempotency_webhooks:
    f3: [payouts, ledger, fts, cfa, x-balances]
    f2: [kong (basic-auth-x + passport private, confirmed rate-limit-free, confirmed no loop-guard), api monolith proxy (endpoint list finalised), dcs (real service, F3-capable), splitz (real service, F3-capable-but-empty — needs synthesized seed data), shield (contract confirmed: allow/block/review, review==allow in practice), pricing (Governor+Charge-Collections OR MockPayoutCalculator), stork capture (real proto/backoff/no-dedupe confirmed), mozart (real binary, -mock mode — replaces the earlier "mozart simulator" placeholder), asv]
    f0: [x SPA, xperience, batch, validx, admin, recon, variants]

  env4_failure_retry_reversal_async_status:
    f3: [payouts, ledger, fts, xas, x-balances, cfa]
    f2: [mozart (real binary, -mock mode, scripted delayed/ambiguous/duplicate/reversed responses via app/testdata/fts/** fixtures — replaces the earlier generic "mozart simulator with scripted responses" placeholder), api monolith relay + admin routes (endpoint list finalised: update_fts_fund_transfer with confirmed no-retry semantics, manual_action, admin/payouts/cancel, payouts/(id)/manual/status(/batch), payouts_service/dual_write with confirmed PS-to-monolith direction), admin-dashboard contract, stork capture, splitz (CreateTransferMetaRollout on/off, FireStatusUpdateKafka on/off — config-field names; real Splitz IDs only known for FTS prod, ROyjRWsBowWdWY / PYGTRQEzO39PfB), kafka topic rx-fts-status-update-events, recon (NEW — ART repair path: FinOps-gated RX-Workflow re-upload -> Kafka -> PATCH/POST FTS v1/attempts/:action + PUT v1/attempts/reconcile, ARTAuth; harness can seed workflow_configs row + Kafka message directly, full Spark/EMR matcher not needed)]
