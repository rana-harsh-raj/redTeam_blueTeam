         [integration.file.axis.v1.beneficiary.s3]
            [integration.file.axis.v1.beneficiary.s3.push]
                bucket_name = "rzp-1415-prod-sftp"
                bucket_region = "ap-south-1"
                file_path = "axis/Beneficiary/outgoing"
                key = "env|AXIS_ENCRYPTION_KEY"
                content_type = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            [integration.file.axis.v1.beneficiary.s3.pull]
                bucket_name = "rzp-1415-prod-sftp"
                bucket_region = "ap-south-1"
                file_path = "axis/FundTransferAxis/incoming"
                content_type = "application/octet-stream"
        [integration.file.axis.v1.beneficiary.beam]
            push_job_name = "fts_axis_beneficiary"
            pull_job_name = ""
    [integration.file.axis.v1.transfer]
         batch_size = 5000
         CREDITED_REMARKS_REGEX = '(Credited to beneficiary on [0-9\-\: ]*)'
         CREDIT_CONFIRMATION_ENABLED = true
         PROCESSED_SYSTEM_THRESHOLD  = 5400
        [integration.file.axis.v1.transfer.s3]
            [integration.file.axis.v1.transfer.s3.push]
                bucket_name = "rzp-1415-prod-sftp"
                bucket_region = "ap-south-1"
                file_path = "axis/FundTransferAxis/outgoing"
                key = "env|AXIS_ENCRYPTION_KEY"
                content_type = "application/pgp"
                signing_key = ""
            [integration.file.axis.v1.transfer.s3.pull]
                bucket_name = "rzp-1415-prod-sftp"
                bucket_region = "ap-south-1"
                file_path = "axis/FundTransferAxis/incoming"
        [integration.file.axis.v1.transfer.beam]
