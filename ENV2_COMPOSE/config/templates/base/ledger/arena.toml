    port = ":8081"

[slack]
    channel = "C0298AJ069X"
    webhookUrl = ""
    mock = true

[pagerDuty]
    mock = true
    key = ""

[scheduler]
    command = "journal-created-sns-publish"
    ttl     = "10m"

[profiling]
    enabled = "env|LEDGER_PROFILING_ENABLED|false|bool"

[idempotency]
    enabled = true

[splitAccount]
    useSplitAccounts = false
    maxAccountUpdateProcessAllowed = 0
    maxLedgerEntryBalanceUpdateAllowed = 0
    ledgerEntryBalanceUpdateTimeWindow = 86400
    pgBatchSize = 1000
    mutexTTL = 10 # time in minutes
    cacheTTL = 20 # time in minutes

[outbox]
    # outboxEnabled/processorEnabled are unused knobs here: InitOutboxer is only called by
    # boot.go when app.appMode=="default", and we run appMode="test", so this never dials.
    outboxEnabled = true
    processorEnabled = true
    [outbox.crypto]
        encryptionKey = "encryptionKey"
    [outbox.outboxConfig]
        ProcessorPoolSize = 1
	    JobProcessingTimeoutMs = 2000
	    MaxAttempts = 5
        FailedJobFetchBatchSize = 1000
        PendingJobFetchBatchSize = 1000
	    WaitTimeMsAfterEmptyRead = 1000
        NoDelete = true
    [outbox.outboxConfig.expBackoffPolicy]
        InitialIntervalMs = 2000
	    Multiplier = 2
	    JitterMs = 1000

[outboxJob]
    # Local/test placeholder ARN (account 000000000000) — an identifier string, not a network
    # target; only read if outbox write path runs, which is gated off by appMode!="default" above.
    x_journal_created_sns       = "arn:aws:sns:ap-south-1:000000000000:journal-created"
    useOutboxJobsSync           = false

[snsOutboxer]
    [snsOutboxer.pubSub]
        [snsOutboxer.pubSub.journal_created]
            driver   = "sns_local"
            [snsOutboxer.pubSub.journal_created.sns]
                endpoint = "http://localstack:4566"
                topicArn = "arn:aws:sns:ap-south-1:000000000000"   # ledger composes TopicArn:TopicName
                topicName = "journal-created"
                region = "ap-south-1"   # arena: LocalStack queues are created in ap-south-1 (seeds/localstack/init-queues.sh); SigV4 region must match
                maxRetries = 5
                [snsOutboxer.pubSub.journal_created.sns.httpClient]
                    connectTimeoutMs        = 2000
                    connKeepAliveMs         = 0
                    expectContinueTimeoutMs = 0
                    idleConnTimeoutMs       = 60000
                    maxAllIdleConns         = 1000
                    maxHostIdleConns        = 1000
                    responseHeaderTimeoutMs = 25000
                    tlsHandshakeTimeoutMs   = 2000

[pubSub]
    [pubSub.journal_created]
        driver   = "sns_local"
        [pubSub.journal_created.sns]
            endpoint = "http://localstack:4566"  # pubsub.New() only builds lazily-instantiated per-topic publishers; nothing dials at boot
            topicArn = "arn:aws:sns:ap-south-1:000000000000"   # ledger composes TopicArn:TopicName (pkg/pubsub/broker/sns/publish.go:69)
            topicName = "journal-created"
            region = "ap-south-1"   # arena: LocalStack queues are created in ap-south-1 (seeds/localstack/init-queues.sh); SigV4 region must match
            enableRetryer = true
            [pubSub.journal_created.sns.retryer]
                numMaxRetries = 10
                minRetryDelay = 500      # time in ms
                minThrottleDelay = 1000  # time in ms
                maxRetryDelay = 25000    # time in ms
                maxThrottleDelay = 25000 # time in ms

[wda]
