#Any change in this Cutoff values will require approval check from the codeOwner mentioned for this file
#
#    This file holds the cutoff time for REQUEST_NOT_FOUND scenerios.
#    We have made a safe check in the code for REQUEST_NOT_FOUND cases which ensure that if due to manual error
#    someone adds the UPDATE_STATUS_AFTER value below the particular mentioned modeLevel threshold then
#    transfer will be marked fail only if
#    (currentTimeStamp - attempt.acknowledged_at) > max(UPDATE_STATUS_AFTER,ModeLevelThreshold)
#
#    for eg:
#    config present in the toml is:=
#    [integration.api.icici.v1.imps.errors.REQUEST_NOT_FOUND]
#    STATUS = "failed"
#    UPDATE_STATUS_AFTER = 600
#
#    IMPS cut off threshold is :=
#    common.ModeIMPS: 2400
#
#    So transfer will be marked failed only after max(2400,600) i.e. after 40 mins

[mode_wise_request_not_found_threshold]
    imps = 2400
    neft = 7200
    rtgs = 2100
    ift  = 2100
    upi  = 2100

[downtime]
