[app]
    appEnv                = "e2e"
    serviceName           = "payouts"
    hostname              = "payouts.int.dev.razorpay.in"
    port                  = ":8000"
    shutdownTimeout       = 60
    shutdownDelay         = 10
    gitCommitHash         = "nil"

[db]
    [db.master]
        dialect               = "mysql"
        protocol              = "tcp"
        url                   = "env|PAYOUTS_DB_MASTER_URL"
        port                  = "3306"
        name                  = "env|PAYOUTS_DB_MASTER_NAME"
        username              = "env|PAYOUTS_DB_MASTER_USERNAME"
        password              = "env|PAYOUTS_DB_MASTER_PASSWORD"
        sslMode               = "require"
        maxOpenConnections    = 5
        maxIdleConnections    = 2
        connectionMaxLifetime = 60
        debug                 = true
    [db.replica]
        dialect               = "mysql"
        protocol              = "tcp"
        url                   = "env|PAYOUTS_DB_REPLICA_URL"
        port                  = "3306"
        name                  = "env|PAYOUTS_DB_REPLICA_NAME"
        username              = "env|PAYOUTS_DB_REPLICA_USERNAME"
        password              = "env|PAYOUTS_DB_REPLICA_PASSWORD"
        sslMode               = "require"
        maxOpenConnections    = 5
        maxIdleConnections    = 2
        connectionMaxLifetime = 60
        debug                 = true
    [db.api]
        dialect               = "mysql"
        protocol              = "tcp"
        url                   = "env|PAYOUTS_DB_API_URL"
        port                  = "3306"
        name                  = "env|PAYOUTS_DB_API_NAME"
        username              = "env|PAYOUTS_DB_API_USERNAME"
        password              = "env|PAYOUTS_DB_API_PASSWORD"
        sslMode               = "require"
        maxOpenConnections    = 5
        maxIdleConnections    = 2
        connectionMaxLifetime = 60
        debug                 = true

[workerpool]
    init                  = true
    maxWorkers            = 5
    workerTimeout         = 3

[cache]
    driver                = "redis"
    [cache.redis]
        scope             = "payouts-live:cache:"
        host              = "np-valkey-8-cluster-enabled.np.razorpay.vpc"
        port              = 6379
        database          = 0
        password          = ""
        mode              = "cluster"
        # Connection pool settings
        PoolSize      = "env|PAYOUTS_CACHE_REDIS_POOLSIZE"
        MinIdleConns  = "env|PAYOUTS_CACHE_REDIS_MINIDLECONNS"
        MaxConnAge    = "env|PAYOUTS_CACHE_REDIS_MAXCONNAGE"
        IdleTimeout   = "env|PAYOUTS_CACHE_REDIS_IDLETIMEOUT"

[redis]
