# build/fts-nginx.conf — arena-adjusted copy of the shape described in the
# real fts/build/nginx.conf (not the file itself -- repo clones are never
# modified or vendored by this scaffold): public :80 proxies everything to
# the Go binary on 127.0.0.1:8080; a second :8081 listener proxies ONLY
# /metrics to the same upstream and 404s everything else, matching the real
# split between public traffic and a metrics-only port.
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 80;
        location = /favicon.ico {
            return 404;
        }
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 8081;
        location /metrics {
            proxy_pass http://127.0.0.1:8080/metrics;
        }
        location / {
            return 404;
        }
    }
}
