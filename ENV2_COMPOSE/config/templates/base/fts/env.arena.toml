# fts build-spike arena config (env2-spike) — web + worker
# Base pattern copied from config/env.dev_local.toml (repo template for a local
# native run), then every external host rewritten to the arena docker
# datastores / localhost stubs. Loaded AFTER env.default.toml + holiday.toml,
# so only keys present here override the default file; everything else
# (mozart URL parts, gateway config, etc.) is inherited unchanged from
# env.default.toml because it never resolves to a real external host.

TITLE = "FTS Arena Spike Configuration"

[application]
    APP_NAME = "fts"
    BUILD_MODE = "release"
    LISTEN_PORT = 8080
    LISTEN_IP = "0.0.0.0"   # arena: fts-web must be reachable from payouts-api and the verifier inside the arena network
    LOG_PATH = "storage/logs"

[database]
    [database.master]
        DIALECT = "mysql"
        HOST = "{{SVC.mysql_fts.host}}"
        PORT = {{SVC.mysql_fts.port}}
        PROTOCOL = "tcp"
        NAME = "{{SVC.mysql_fts.dbname}}"
        USERNAME = "env|DATABASE_USERNAME"
        PASSWORD = "env|DATABASE_PASSWORD"
        [database.master.default_connections_config]
            MAX_OPEN_CONNECTIONS = 2
            MAX_IDLE_CONNECTIONS = 1
    [database.replica]
        DIALECT = "mysql"
        HOST = "{{SVC.mysql_fts.host}}"
        PORT = {{SVC.mysql_fts.port}}
        PROTOCOL = "tcp"
        NAME = "{{SVC.mysql_fts.dbname}}"
        USERNAME = "env|DATABASE_USERNAME"
        PASSWORD = "env|DATABASE_PASSWORD"
        [database.replica.default_connections_config]
            MAX_OPEN_CONNECTIONS = 2
            MAX_IDLE_CONNECTIONS = 1

[mutex]
    DIALECT = "redis"
    SCOPE = "fts-mutex"
    HOST = "{{SVC.redis.host}}"
    PORT = "{{SVC.redis.port}}"
    DATABASE = 0
    MAX_RETRIES = 5
    PASSWORD = ""

[cache]
    DIALECT = "redis"
    [cache.redis]
        HOST = "{{SVC.redis.host}}"
        PORT = "{{SVC.redis.port}}"
        PASSWORD = ""

[queue]
    SCOPE = "fts"
    DIALECT = "redis"
    DEFAULT_QUEUE = "default"
    RESULTS_EXPIRE_IN = 600
    CONCURRENCY = 1
    ASYNC = true
    [queue.redis]
        HOST = "{{SVC.redis.host}}"
        PORT = "{{SVC.redis.port}}"
        PASSWORD = ""
        MAX_IDLE = 2
        MAX_IDLE_TIMEOUT = 3600
        DELAYED_TASKS_POLL_PERIOD = 600
    [queue.queue_map]
        initiate_transfer = "default"
        check_transfer_status = "default"
        fire_transfer_status_webhook = "default"
        verify_beneficiary = "default"
        register_beneficiary = "default"
        process_transfer = "default"
        verify_transfer_status = "default"
        retry_transfer = "default"
        process_attempt = "default"
        register_file_beneficiary = "default"
        process_file_beneficiary = "default"
        process_file_transfer = "default"
        check_file_pending_transfers = "default"
        process_attempt_update = "default"
    [queue.task_worker_map]
        process_attempt = "default"
        register_file_beneficiary = "default"
        process_file_beneficiary = "default"
        process_file_transfer = "default"
        check_file_pending_transfers = "default"
        process_attempt_update = "default"

[feature]
    POLL_DATA_FROM_RELAY_SERVICE = false

# beam MOCK=true short-circuits the client in-process (see internal/providers/beam);
# BASE_URL kept local as belt-and-suspenders since it is never dialed while MOCK is true.
[beam]
    BASE_URL = "http://127.0.0.1:9/mock/beam"
    METHOD = "POST"
    TIMEOUT = 60
    MOCK = true
    HEADERS = { Content-Type = "application/json"}

[telemetry]
    serviceName = "fts"
    serviceNamespace = "payouts"
    environment = "development"
    exporterHost = "env|TELEMETRY_EXPORTERHOST"
    exporterPort = "4318"
    samplingRatio = 1.0

[spinnaker]
    WEBHOOK_URL = "http://127.0.0.1:9/mock/spinnaker"
    METHOD = "POST"
    TIMEOUT = 120
    HEADERS = { Content-Type = "application/json"}

[razorx]
    BASE_URL = "http://127.0.0.1:9/mock/razorx/v1/evaluate"
    METHOD = "GET"
    TIMEOUT = 60
    HEADERS = { X-Razorpay-Application = "fts", Content-Type = "application/json"}

[ledger]
    BASE_URL = "{{SVC.ledger_api.url}}"
    MOCK = false
    [ledger.create_on_event]
        URL = "/twirp/rzp.ledger.account.v1.AccountAPI/CreateOnEvent"
        METHOD = "POST"
        Timeout = 1
        HEADERS = { Ledger-Tenant = "X", Content-Type = "application/json"}

[splitz]
    [splitz.config]
        endpoint = "{{SVC.splitz_stub.url}}"
        debug = true

[xas]
    #All XAS timeouts and intervals are in milliseconds
    enabled = true
    host = "http://xas-sim:8080"   # M4 (T10): XAS substitute (xas-sim, T11) for the retry-transfer-preprocessor statement gate; was xas-sink (health-only)
    timeout = 30000
    http_client_name = "xas-client"
    http_retry_attempts = 3
    http_retry_window = 10000
    http_max_jitter_interval = 1000

# stage-kafka.razorpay.in broker disabled — no local Kafka broker stood up for
# this spike (task brief only called for MySQL + Redis). NewProducer() would
# otherwise dial the real broker synchronously at boot (see
# internal/providers/kafka/provider.go initializeProducer -> NewProducer).
[kafka_producers]
    [kafka_producers.fire_transfer_status]
        name    = "fire_transfer_status"
        enabled = false

[webhook]
    [webhook.refund.transfer_status]
        URL = "http://127.0.0.1:9/mock/webhook"
        METHOD = "POST"
        TIMEOUT = 120
        HEADERS = { Content-Type = "application/json"}
    [webhook.settlement.transfer_status]
        URL = "http://127.0.0.1:9/mock/webhook"
        METHOD = "POST"
        TIMEOUT = 120
        HEADERS = { Content-Type = "application/json"}
    [webhook.payout.transfer_status]
        URL = "http://monolith-stub:8080/update_fts_fund_transfer"   # arena: monolith-stub relays to payouts-api PATCH /v1/payouts/update_payouts_with_fts (Flow I)
        METHOD = "POST"
        TIMEOUT = 120
        HEADERS = { Content-Type = "application/json"}
    [webhook.customer_wallet.transfer_status]
        URL = "http://127.0.0.1:9/mock/webhook"
        METHOD = "POST"
        TIMEOUT = 120
        HEADERS = { Content-Type = "application/json"}
    [webhook.customer_payout.transfer_status]
        URL = "http://127.0.0.1:9/mock/webhook"
        METHOD = "POST"
        TIMEOUT = 2
        HEADERS = { Content-Type = "application/json"}
    [webhook.payout_refund.transfer_status]
        URL = "http://127.0.0.1:9/mock/webhook"
        METHOD = "POST"
        TIMEOUT = 120
        HEADERS = { Content-Type = "application/json"}
    [webhook.penny_testing.transfer_status]
        URL = "http://127.0.0.1:9/mock/webhook"
        METHOD = "POST"
        TIMEOUT = 120
        HEADERS = { Content-Type = "application/json"}
    [webhook.es_on_demand.transfer_status]
        URL = "http://127.0.0.1:9/mock/webhook"
        METHOD = "POST"
        TIMEOUT = 120
        HEADERS = { Content-Type = "application/json"}
    [webhook.ca_payout.transfer_status]
        URL = "http://127.0.0.1:9/mock/webhook"
        METHOD = "POST"
        TIMEOUT = 120
        HEADERS = { Content-Type = "application/json"}

# JPMC file-integration overrides: env.default.toml uses env|JPMC_* placeholders
# (credstash-backed in prod/stage). Local/CI envs override with literals so config
# load does not panic on missing env vars. Values copied from
# config/env.dev_local.toml (a real S3 bucket name, but the S3 client is only
# invoked on-demand for file-based transfer jobs, never at boot).
[integration.file.jpmc.v1.transfer.s3.push]
    bucket_name = "rzp-test-bucket"
    bucket_region = "ap-south-1"
    file_path = "jpmc/outgoing"
    internal_key = ""
[integration.file.jpmc.v1.transfer.s3.pull]
    bucket_name = "rzp-test-bucket"
    bucket_region = "ap-south-1"
    file_path = "jpmc/incoming"
    internal_key = ""

# --- arena: bank gateway = mozart-sim (mozart/app/testdata envelopes); path shape /{namespace}/{gateway}/{version}/{action} ---
[mozart]
    BASE_URL = "http://mozart-sim:8085/fts"

