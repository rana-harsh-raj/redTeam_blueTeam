# Effective production configuration vs the Env2 twin, key by key, for payouts/fts/ledger/cfa/x-balances
# and the stubs' env knobs. Every entry: {key, prod_value_or_class, twin_value, behaviour_controlled,
# must_match_prod, source path:line}. prod_value_or_class uses: literal (value read verbatim from a repo
# config file), env-injected (k8s secretRef-only value, real runtime value NOT derivable from any repo),
# secret-name (a named credential, value never captured), unknown (not derivable at all).
#
# REPOS root for prod paths = the REPOS set defined in reports/fidelity/raw/12_runtime_topology_effective_config.md
# (payouts/, fts/, ledger/, cfa/, x-balances/, kube-manifests/). Twin paths relative to ENV2_COMPOSE/.
# No secret VALUES recorded anywhere below (only names/classes); no real internal IPs recorded.
version: 1

payouts:
  outbound_clients:
    # Every [x].timeout / httpretryattempts / httpclient.resiliency block payouts config declares.
    - {key: "fts.timeout / httpretryattempts / resiliency", prod_value: "1000ms / 3 / maxconcurrentrequests=100,circuitbreakersleepwindow=5000,errorpercentthreshold=50,circuitbreakertimeout=10000", twin_value: "1000ms / 3 / identical resiliency block", behaviour_controlled: "how long payouts waits for FTS before circuit-opening on the async-dispatch path", must_match_prod: true, source: "payouts/config/prod.toml:590-609 vs ENV2_COMPOSE/config/templates/base/payouts/arena.toml:1095-1114 (EXACT MATCH, only host differs: fts-live.razorpay.com vs fts-web:8080, expected)"}
    - {key: ledger.timeout / httpretryattempts, prod_value: "200ms / 3", twin_value: "200ms / 3, identical resiliency", behaviour_controlled: "journal-write latency budget on the synchronous payout_initiated path", must_match_prod: true, source: "payouts/config/prod.toml:390-406 vs arena.toml:318-335 (MATCH)"}
    - {key: mozart.timeout, prod_value: 1000ms, twin_value: "1000ms (httpclient.httpclient.timeout); note circuitbreakertimeout=220000ms in twin vs unconfirmed prod value", behaviour_controlled: "bank-gateway call budget", must_match_prod: true, source: "payouts/config/prod.toml:234-250 vs arena.toml:252-269"}
    - {key: cfa.timeout, prod_value: 10000ms, twin_value: 10000ms, behaviour_controlled: "fund-account/contact resolution budget (notably 10s, far higher than every other client)", must_match_prod: true, source: "payouts/config/prod.toml:691-710 vs arena.toml:758-778 (MATCH)"}
    - {key: x_balances.timeout, prod_value: 30s, twin_value: 30s, behaviour_controlled: "x-balances read budget", must_match_prod: true, source: "payouts/config/prod.toml:773-792 vs arena.toml:688-708 (MATCH)"}
    - {key: banking_account_service.timeout / retries, prod_value: "2000ms / httpretryattempts=2,httpretrywindow=60ms", twin_value: "2000ms / httpretryattempts=2,httpretrywindow=60ms", behaviour_controlled: "shield-detail lookup budget", must_match_prod: true, source: "payouts/config/prod.toml:252-271 vs arena.toml:278-297 (MATCH)"}
    - {key: workflow.timeout / retries, prod_value: "100ms / httpretryattempts=3", twin_value: "100ms / httpretryattempts=3", behaviour_controlled: "approval-workflow gate — very tight timeout, real state-transition guard", must_match_prod: true, source: "payouts/config/prod.toml:273-290 vs arena.toml:299-316 (MATCH; note: workflows service itself is MISSING from the twin — see runtime-topology.yaml — so this timeout is currently unexercised against any real receiver)"}
    - {key: shield.timeout, prod_value: 200ms, twin_value: 200, behaviour_controlled: "fraud/risk fail-open gate", must_match_prod: true, source: "arena.toml:337-354 (per EFFECTIVE_CONFIG_GAPS.md A7, fail-open on error/timeout/review, Hystrix opens at >=20 req / >=50% error rate, 5s sleep window)"}
    - {key: workers.maxconcurrency / waittime / retrydelay, prod_value: "2 / 1s / 30s (global default, applies to every payouts-worker-* process — no per-worker override found in k8s env)", twin_value: "2 / 1s / 30s", behaviour_controlled: "every worker's poll/retry cadence", must_match_prod: true, source: "payouts/config/prod.toml:159-161 vs arena.toml:1088-1092 (EXACT MATCH)"}
    - {key: consumer_task.MaxConcurrency, prod_value: 3, twin_value: 3, behaviour_controlled: "Kafka consumer concurrency", must_match_prod: true, source: "payouts/config/prod.toml:346 vs arena.toml:451-453 (MATCH)"}

  splitz:
    - {key: "[splitz] client_side_eval", prod_value_or_class: "literal FALSE (prod.toml OVERRIDES default.toml's true)", twin_value: true, behaviour_controlled: "whether payouts evaluates Splitz experiments locally via cached FetchDecisionContext (client_side_eval=true) or via the wire Evaluate/EvaluateBulk RPC (false). THIS IS THE SINGLE MOST IMPORTANT SPLITZ-TWIN FINDING (L10 §B.2): with the twin's current true value, every experiment lookup calls splitz-stub's FetchDecisionContext, which always returns {\"experiments\":[]} -> every experiment resolves to nil -> GetVariantOrDefault returns the hardcoded 'off' default -> ALL 38 payouts + 30 fts Splitz-gated behaviors (including in_flight_reservation-adjacent MerchantConfigViaAsvAndDcs, PerformanceOptimizationExperiment, ChargeCollectionsCallExperiment, BulkPayoutConcurrencyExperiment, fts_request_from_payouts_service_experiment) are unreachable, regardless of splitz-stub's per-merchant seed data. Correcting to false makes payouts call Evaluate/EvaluateBulk instead, which splitz-stub's seed-based per-merchant lookup DOES correctly implement.", must_match_prod: true, source: "payouts/config/prod.toml:437,442 (client_side_eval=false, OVERRIDING payouts/config/default.toml:510,515's true) vs ENV2_COMPOSE/config/templates/base/payouts/arena.toml:541,546 (true, i.e. arena.toml matches default.toml's value, NOT prod's override)"}
    - {key: "splitz.cache_ttl_minutes / experiment_cache_size_mb / segment_cache_size_mb", prod_value: "5 / 5 / 20", twin_value: "5 / 5 / 20", behaviour_controlled: "client-side cache sizing (irrelevant while client_side_eval mismatch above stands, but should stay matched once fixed)", must_match_prod: true, source: "payouts/config/prod.toml:442-445 vs arena.toml:547-549 (MATCH)"}
    - {key: splitz_experiment_list, prod_value_or_class: "38 named real Splitz experiment IDs (opaque, MySQL-only, not derivable from any repo)", twin_value: "38 stub-invented IDs (some real-shaped e.g. PXoynBvY8VkA5a, some literal 'dummy')", behaviour_controlled: "per-flag experiment ID mapping — the twin's IDs need only be internally consistent with splitz-stub's seed data, not literally match prod's", must_match_prod: false, source: "payouts/config/prod.toml:458-495 vs arena.toml:562-596"}

  shadow_gateway:
    - {key: "[shadow_gateway] enabled", prod_value: false, twin_value: false, behaviour_controlled: "master kill switch for the monolith-proxy/shadow framework — pre-wired but inert in both prod and twin", must_match_prod: true, source: "payouts/config/prod.toml:857-860 (\"Pre-wired but DISABLED\") vs arena.toml:1026-1028 (MATCH — CONTRACT-FAITHFUL)"}

  features:
    - {key: "[features] forward_dual_write", prod_value_or_class: "env-injected (k8s secretRef, real runtime value UNKNOWN — UNRESOLVED per EFFECTIVE_CONFIG_GAPS.md #6, still OPEN)", twin_value: false, behaviour_controlled: "whether payouts forward-dual-writes to payouts_temp/payout_meta_temporary (the bug class in razorpay/payouts#1946)", must_match_prod: "cannot verify — twin's false matches the CODE default fallback (default.toml:716) only, not a confirmed prod runtime value", source: "payouts/config/prod.toml:663-668 (env|PAYOUTS_FEATURES_FORWARD_DUAL_WRITE) vs payouts/config/default.toml:713-719 (fallback false) vs arena.toml:751-753 (hardcoded false)"}
    - {key: "[features] reverse_dual_write", prod_value_or_class: "env-injected (real value UNKNOWN)", twin_value: true, behaviour_controlled: "reverse dual-write direction", must_match_prod: "cannot verify — twin's true matches only the default.toml fallback", source: "payouts/config/prod.toml:665 vs default.toml:715 vs arena.toml:751"}
    - {key: "[features] ikey_auto_enforcement", prod_value: true, twin_value: false, behaviour_controlled: "idempotency-key auto-enforcement — a real behavior gate on the payout-create path, NOT env-injected in prod (a plain literal), so this is a genuine, fixable mismatch, not an unknown-secret case", must_match_prod: true, source: "payouts/config/prod.toml:664 (true, literal) vs default.toml:714 (false) vs arena.toml:750 (false, inherited from default.toml's fallback instead of prod's override)"}

  passport:
    - {key: "[passport.api].identifier", prod_value: apiv1, twin_value: apiv1, behaviour_controlled: "which passport claim-set the 'api' auth type validates", must_match_prod: true, source: "payouts/config/prod.toml:191-193 vs arena.toml:443-445 (MATCH; publicKey itself is the same real, already-repo-committed test/dev key in both prod.toml and default.toml/arena.toml — not prod-specific, not treated as secret)"}
    - {key: "[passport.edge].identifier", prod_value_or_class: "literal edgev2 (real prod signing key, per terraform-kong prod/edge/jwks.json)", twin_value: "arena-passport-1 (self-signed, kong-lite's own per-arena RS256 keypair)", behaviour_controlled: "which key the edge-issued passport JWT is validated against", must_match_prod: false, source: "payouts/config/prod.toml:194-199 vs arena.toml:446-448 — BY DESIGN per EFFECTIVE_CONFIG_GAPS.md B1: the arena is its own trust root and self-signs; the real prod key is deliberately never reproduced. must_match_prod=false is intentional, not a gap."}

  kafka_consumers:
    - {key: "kafka_consumers.status_update_consumer.config.{RetryBackoff,MaxRetry,ConsumerGroup,Topics,Brokers,EnableTLS}", prod_value: "RetryBackoff=1,MaxRetry=1,ConsumerGroup=rx-payouts-fts-status-update-consumer-group,Topics=[rx-fts-status-update-events],Brokers=[prod-noncde-kafka.razorpay.com:9090],EnableTLS=true", twin_value: "RetryBackoff=1,MaxRetry=1,ConsumerGroup=rx-payouts-fts-status-update-consumer-group,Topics=[rx-fts-status-update-events],Brokers=[kafka:9092],EnableTLS=false", behaviour_controlled: "primary FTS status-update consumer retry semantics", must_match_prod: true, source: "payouts/config/prod.toml:313-325 vs arena.toml:1048-1061 (MATCH except broker/TLS, both expected for a local arena)"}
    - {key: "kafka_consumers.status_update_retry_consumer.config.RetryBackoff", prod_value: 30, twin_value: 5, behaviour_controlled: "retry-topic backoff — a real, behavior-affecting deviation (6x faster retry in the twin)", must_match_prod: true, source: "payouts/config/prod.toml:326-338 (:329=30) vs arena.toml:1062-1074 (:1065=5) — CORRECTION noted in EFFECTIVE_CONFIG_GAPS.md-adjacent L12 finding, still unfixed"}
    - {key: "kafka_consumers.status_update_retry_consumer.config.MaxRetry", prod_value: 2, twin_value: 2, behaviour_controlled: "retry-topic max attempts", must_match_prod: true, source: "prod.toml:326-338 vs arena.toml:1062-1074 (MATCH)"}

  fmp:
    - {key: "fmp.initiate_disabled / gateway_balance_threshold / retrieval_threshold", prod_value: "false / 1000000 (paisa=Rs10000) / 21600 (6h)", twin_value: "false / 1000000 / 21600", behaviour_controlled: "Fund Management Payout kill switch, CA-balance floor, lookback window", must_match_prod: true, source: "payouts/config/prod.toml:841-845 vs arena.toml:1003-1009 (EXACT MATCH — but note: no fmp_check/fmp_initiate WORKER exists in the twin at all per runtime-topology.yaml, so this correct config is currently unexercised)"}

  payout_config:
    - {key: "payout_config.in_flight_reservation.{ttl,debit_visibility_lag_default,max_items_per_balance}", prod_value: "6h / 3m / 2000", twin_value: "6h / 3m / 2000", behaviour_controlled: "in-flight reservation TTL/lag/capacity", must_match_prod: true, source: "payouts/config/prod.toml:850-855 vs arena.toml:1016-1024 (EXACT MATCH)"}

  api_internal_ingress_feature:
    - {key: "[api_internal_ingress_feature].enable", prod_value: true, twin_value: false, behaviour_controlled: "gates a real internal-ingress code path (feature flag, not env-injected in prod — a plain literal override of default.toml's false)", must_match_prod: true, source: "payouts/config/prod.toml:431-432 (true) vs default.toml:438-439 (false) vs arena.toml:469-470 (false, inherited from default.toml's fallback instead of prod's override)"}

  dcs:
    - {key: "[dcs].Mock", prod_value_or_class: "n/a — field exists (config.Config.Mock) but is NEVER READ anywhere in goutils/dcs outside its own tests, in every SDK version encountered (v1.5.2/v1.7.1/v1.7.3); payouts/pkg/dcs/client.go additionally hardcodes WithMock(false) with WithMock(cnf.Mock) commented out, discarding even this dead value", twin_value: true, behaviour_controlled: "NOTHING — vestigial/dead config field, confirmed by direct code read (goutils/dcs) and by EFFECTIVE_CONFIG_GAPS.md §K's empirically-tested build spike", must_match_prod: "n/a (inert either way)", source: "L10 §A.4 (goutils/dcs Mock semantics) + EFFECTIVE_CONFIG_GAPS.md §K"}
    - {key: "[dcs].Env", prod_value: live, twin_value: dev, behaviour_controlled: "which hardcoded env->hostname table entry getLoginURI()/getURLAndMode() resolve to when ARENA_DCS_URL is not honoured (see the cross-cutting DCS gap below)", must_match_prod: false, source: "arena.toml:274 — irrelevant while the ARENA_DCS_URL context-propagation gap stands, since the per-request path never consults ServerURL/Env successfully anyway"}
    - {key: "ARENA_DCS_URL patch scope (cross-cutting, not a TOML key)", prod_value_or_class: "n/a — arena-only mechanism", twin_value: "build/apply-arena-patches.sh patches payouts/pkg/dcs/client.go, cfa/internal/dcsservice/client.go, x-balances/pkg/dcs/client.go IDENTICALLY: each gets a 4-line block reading os.Getenv(\"ARENA_DCS_URL\") and calling dcs.SetContextUrl(ctx, arenaURL) — but ONLY inside that file's one-time client-construction function (NewService/New*), i.e. only the BOOT-time context used for dcs.New()/login. The per-request ctx used by every later Get()/Patch()/EnabledFeatures() call (from payouts/internal/app/merchant/core.go and equivalents in cfa/x-balances) is a fresh request-scoped context that never carries this override.", behaviour_controlled: "whether DCS-gated merchant flags (in_flight_reservation_enabled, and every other DCS feature) are ever actually readable from dcs-stub, across ALL THREE dcs-consuming services, not just payouts", must_match_prod: "n/a — this is an arena mechanism gap, not a prod-config-parity question; must_match_prod is really 'must actually work', currently NO", source: "ENV2_COMPOSE/build/apply-arena-patches.sh:18-34 (python block, `targets` dict lists all 3 files with the same anchor pattern func New[A-Za-z]*\\(); L10 §A.4 root-cause-2 analysis (originally scoped to payouts only — this manifest extends it to cfa and x-balances since the patch code is provably identical)"}

fts:
  outbound_and_inbound:
    - {key: "[payouts_service.update_fts_fund_transfer]", prod_value: "URL=https://payouts.razorpay.com/v1/payouts/transfer_status_webhook, TIMEOUT=300, METHOD=POST", twin_value: "URL=http://payouts-api:9400/v1/payouts/transfer_status_webhook, TIMEOUT=10, METHOD=POST — but only injected by config/routes.py's apply_route_profile() AFTER template rendering (NOT present in the static config/templates/base/fts/env.arena.toml file, nor in env.default.toml, which omits this key entirely — confirmed present in the actual generated/fts/env.arena.toml output)", behaviour_controlled: "the direct FTS -> payouts-api status-update callback (the 'Flow I' / CreateTransferMetaRollout direct-PS path)", must_match_prod: "URL/mechanism yes (correct, points at payouts-api); TIMEOUT no (10ms budget vs prod's 300s is a 30x tighter timeout — likely fine locally but not literal-faithful)", source: "fts/config/env.prod-live.toml:269-273 vs ENV2_COMPOSE/config/routes.py:54-57 and generated/fts/env.arena.toml:232-236 — NOTE: fts/config/env.default.toml's [payouts_service] block (lines 833-851) has NO update_fts_fund_transfer key at all; the twin only gets one via the post-render routes.py injection, not the static template"}
    - {key: "[webhook.payout.transfer_status]", prod_value: "URL=<real monolith host>/update_fts_fund_transfer, TIMEOUT=120, METHOD=POST (the legacy/fallback path, taken when the CreateTransferMetaRollout-gated direct-PS path is off)", twin_value: "URL=http://monolith-stub:8080/update_fts_fund_transfer, TIMEOUT=120, METHOD=POST", behaviour_controlled: "legacy status-update relay through the monolith", must_match_prod: true, source: "L06 (webhook.<product>.transfer_status legacy path) vs ENV2_COMPOSE/config/templates/base/fts/env.arena.toml:171-175 (TIMEOUT MATCHES prod's 120s)"}
    - {key: "[webhook.customer_payout.transfer_status].TIMEOUT", prod_value: "2 (seconds — a deliberate outlier vs every other webhook.*.TIMEOUT=120)", twin_value: 120, behaviour_controlled: "customer-payout-specific webhook timeout", must_match_prod: true, source: "fts/config/env.prod-live.toml:164-235 (the 2s outlier, distinguished in L04/L12) vs env.arena.toml (inherits env.default.toml's generic 120 for this key — not independently overridden; MISMATCH)"}
    - {key: "[kafka_producers.fire_transfer_status]", prod_value: "enabled=true always (env.prod-live.toml:315-331), topic=rx-fts-status-update-events, retry_backoff=2, max_retry=10, brokers=[prod-noncde-kafka.razorpay.com:9090]", twin_value: "PROFILE-GATED via config/routes.py:58-63: enabled=PROFILES[ARENA_ROUTE_PROFILE]['kafka'] (only true under the 'kafka' route profile). ARENA_ROUTE_PROFILE is not set anywhere in .env.arena or scripts/, so config/generate.py:90's default 'monolith' applies, under which enabled=false (CONFIRMED in generated/fts/env.arena.toml:156-158). Topic/brokers are correct (rx-fts-status-update-events, kafka:9092) once enabled.", behaviour_controlled: "whether the async Kafka status-update leg to payouts fires at all", must_match_prod: "false under the default profile; true only if ARENA_ROUTE_PROFILE=kafka is explicitly selected", source: "fts/config/env.prod-live.toml:315-331 vs ENV2_COMPOSE/config/routes.py:41,58-63 + config/generate.py:90 + generated/fts/env.arena.toml:156-158"}
    - {key: "splitz.experiments.{create_transfer_meta_rollout,fire_status_update_kafka} real Splitz experiment IDs", prod_value_or_class: "real IDs ROyjRWsBowWdWY (CreateTransferMetaRollout) / PYGTRQEzO39PfB (FireStatusUpdateKafka), per EFFECTIVE_CONFIG_GAPS.md A3 — MySQL-only, not in any repo", twin_value: "arena_fts_meta / arena_fts_kafka (stub-invented IDs, config/routes.py:50-53), with per-merchant on/off wired by route_experiments() keyed to the same PROFILES table (arena_fts_meta 'on' iff direct_status, arena_fts_kafka 'on' iff kafka)", behaviour_controlled: "whether the direct-PS status-update path and the Kafka status-update path are reachable at all, per merchant", must_match_prod: false, source: "config/routes.py:41,50-53,68-75 — twin IDs are internally consistent with splitz-stub's seed, correctly gated by the same PROFILES table as the two keys above; real IDs are a genuine EXPORT-NEEDED gap per EFFECTIVE_CONFIG_GAPS.md A3, not fixable from any repo"}
    - {key: "[queue.worker_queue_map] (~90 bank/rail keys)", prod_value_or_class: "literal, fts/config/env.prod-live.toml inherits env.default.toml:106-166 unmodified (fts has no per-env override of this key)", twin_value: "NOT overridden in env.arena.toml either — the full ~90-entry map is inherited unmodified from env.default.toml (config/templates/base/fts/env.default.toml:106-166), which is byte-identical to the real repo file per generate.py's design (copied verbatim, sanitize-only mode). CONFIG IS CORRECT.", behaviour_controlled: "which redis-machinery queue name a given CLI arg (-command=<key>) maps to", must_match_prod: true, source: "the GAP here is topological (only 13 of ~90 keys have a running fts-worker-* container), NOT a config-key mismatch — see runtime-topology.yaml fts section. arena.toml separately adds its own unused [queue.queue_map]/[queue.task_worker_map] keys (env.arena.toml:72-90) that appear to be dead config, not an override of worker_queue_map."}
    - {key: "[queue].CONCURRENCY (global)", prod_value_or_class: "no single global value — per-key via [queue.worker_concurrency_map] (env.prod-live.toml:45-127, 1-45 per key, default 5)", twin_value: "CONCURRENCY = 1 (env.arena.toml:59, applies uniformly to all 13 running workers)", behaviour_controlled: "per-worker-process concurrency", must_match_prod: false, source: "env.prod-live.toml:45-127 vs env.arena.toml:56-63 — a flat concurrency of 1 misrepresents the real 1-45 spread (icici::initiate_transfer=45 vs axis::initiate_transfer=1); acceptable only if bank-specific throughput fidelity is not a stated test goal"}

ledger:
  auth:
    - {key: "[auth.fts] / [auth.payouts] / [auth.xbalances] (inbound Twirp-hook basic-auth)", prod_value_or_class: "secret-name only (values not captured; k8s secretRef)", twin_value: "each bound to the SAME generated secret as the calling service's outbound credential (e.g. auth.fts password = SECRET.auth_fts_ledger, matching fts's own [ledger.auth] outbound password)", behaviour_controlled: "which caller identity ledger accepts for JournalAPI/AccountAPI calls", must_match_prod: "n/a for literal values (secret, never captured); mechanism (paired caller/callee credentials) is CONTRACT-FAITHFUL", source: "ledger/config/prod-live.toml (auth.* section headers only, values env-injected) vs ENV2_COMPOSE/config/templates/base/ledger/arena.toml:145-251 — confirms EFFECTIVE_CONFIG_GAPS.md §L's 'every callee's inbound auth section had to be bound to the same secret as the caller' finding"}
  scheduler:
    - {key: "[scheduler].command", prod_value_or_class: "literal default in ledger/config/default.toml:425 is journal-created-sns-publish, but BOTH real k8s CronJobs (split-account-balance-update-live and -pg-live) OVERRIDE this via an env var LEDGER_SCHEDULER_COMMAND={{.Values.split_account_balance_update_cronjob_scheduler_cmd}} (kube-manifests/templates/ledger/templates/split-account-balance-update-cronjob-live.yaml:40-41), consumed at ledger/internal/boot/boot.go:693 (Execute(ctx, Config.Scheduler.Command, ...)). The ACTUAL prod scheduler command values are 'split-account-balance-update' / 'pg-split-account-balance-update' (ledger/internal/common/constant.go:909-910), not the TOML default.", twin_value: "journal-created-sns-publish — CONFIRMED, ledger/arena.toml:438-439 sets [scheduler].command literally to this value (same as default.toml, no override), AND the ledger-scheduler compose service sets no LEDGER_SCHEDULER_COMMAND env var at all (docker-compose.yml ledger-scheduler block, environment: only has the proxy-env anchor).", behaviour_controlled: "WHICH JOB THE TWIN'S SINGLE ledger-scheduler PROCESS ACTUALLY RUNS. This is a CRITICAL, high-confidence, previously-unflagged finding: the twin's ledger-scheduler perpetually runs the SNS journal-created outbox publisher, NEVER the split-account-balance-update reconciliation that prod's real CronJob performs every 10 minutes. Split-account balance correctness cannot be tested in the current arena.", must_match_prod: true, source: "ledger/config/default.toml:425; ledger/config/prod-live.toml (no [scheduler] section — command is entirely env-var-driven per CronJob in prod, not a TOML literal); kube-manifests/templates/ledger/templates/split-account-balance-update-cronjob-live.yaml:35-43; ledger/internal/boot/boot.go:693; ledger/internal/common/constant.go:909-910; ENV2_COMPOSE/config/templates/base/ledger/arena.toml:438-439; ENV2_COMPOSE/docker-compose.yml ledger-scheduler service block"}
  worker:
    - {key: "[worker].queueName", prod_value_or_class: "env-injected per Deployment via LEDGER_WORKER_QUEUENAME (account_create_queue_name_live / balance_update_queue_name_live / journal_create_queue_name_live / entry_details_create equivalents) — 4 separate Deployments, one queue each", twin_value: "hardcoded literal \"account_create\" in BOTH ledger/default.toml:332 and ledger/arena.toml:334, with NO LEDGER_WORKER_QUEUENAME env override on the twin's single ledger-worker compose service", behaviour_controlled: "which of the 4 real ledger SQS queues get consumed at all. CRITICAL FINDING: the twin's single ledger-worker ONLY EVER consumes account_create; messages on balance_update, journal_create, ledger_entry_details_create(+pg) — all created by seeds/localstack/init-queues.sh — sit unconsumed forever.", must_match_prod: false, source: "kube-manifests/templates/ledger/templates/balance-update-live-worker.yaml:57-65 (env-var role selection pattern) vs ENV2_COMPOSE/config/templates/base/ledger/{default,arena}.toml:331-338 vs ENV2_COMPOSE/docker-compose.yml ledger-worker block (no LEDGER_WORKER_QUEUENAME)"}
