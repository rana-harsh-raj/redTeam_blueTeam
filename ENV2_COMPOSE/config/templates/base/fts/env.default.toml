# This is default configuration file

TITLE = "FTS Default Configuration"

[application]
    APP_NAME = "fts"
    BUILD_MODE = "release" # build_mode can be `debug`, `release`, `test`
    LISTEN_PORT = 8080
    LISTEN_IP = "127.0.0.1"
    LOG_PATH = "storage/logs"
    TIME_ZONE = "Asia/Kolkata"

[database]
    [database.master]
        DIALECT = "mysql"
        HOST = "127.0.0.1"
        PORT = 3306
        PROTOCOL = "tcp"
        USERNAME = "env|DATABASE_USERNAME"
        PASSWORD = "env|DATABASE_PASSWORD"
        #DB connections default config values
        [database.master.default_connections_config]
            MAX_OPEN_CONNECTIONS = 2
            MAX_IDLE_CONNECTIONS = 1
            #DB wait_timeout is 300 seconds | setting to 4 minutes due to the nature of traffic. If patterns change, this value can be relooked at.
            CONN_MAX_LIFE_TIME = 240
    [database.replica]
        DIALECT = "mysql"
        HOST = "env|DATABASE_LIVE_REPLICA_HOST"
        PORT = 3306
        PROTOCOL = "tcp"
        USERNAME = "env|DATABASE_LIVE_REPLICA_USERNAME"
        PASSWORD = "env|DATABASE_LIVE_REPLICA_PASSWORD"
        #DB connections default config values
        [database.replica.default_connections_config]
            MAX_OPEN_CONNECTIONS = 2
            MAX_IDLE_CONNECTIONS = 1
            #DB wait_timeout is 300 seconds | setting to 4 minutes due to the nature of traffic. If patterns change, this value can be relooked at.
            CONN_MAX_LIFE_TIME = 240


[mutex]
    DIALECT = "redis"
    SCOPE = "fts-mutex"
    HOST = "env|REDIS_MUTEX_HOST"
    PORT = "env|REDIS_MUTEX_PORT"
    DATABASE = 0
    MAX_RETRIES = 5
    PASSWORD = ""

[cache]
    DIALECT = "redis"
    [cache.redis]
        HOST = "env|REDIS_CACHE_HOST"
        PORT = "env|REDIS_CACHE_PORT"
        DATABASE = 0
        PASSWORD = ""
        SCOPE    = "" # Need for Devstack. Keep empty

[queue]
    SCOPE = "fts"
    DIALECT = "redis"
    DEFAULT_QUEUE = "default"
    RESULTS_EXPIRE_IN = 600
    CONCURRENCY = 1
    ASYNC = true
    [queue.task_version]
# Add tasks with new signature here
        beneficiary_processed_event = "v2"
        check_transfer_status = "v2"
        fire_bene_status_webhook = "v2"
        fire_transfer_status_webhook = "v2"
        initiate_transfer = "v2"
        process_attempt = "v2"
        process_attempt_update = "v2"
        process_beneficiary = "v2"
        process_file_beneficiary = "v2"
        process_file_transfer = "v2"
        process_transfer = "v2"
        register_beneficiary = "v2"
        register_file_beneficiary = "v2"
        retry_transfer = "v2"
        retry_transfer_preprocessor = "v2"
        retry_preprocessor_status_update = "v2"
        retry_transfer_source_update = "v2"
        slack_notification = "v2"
        verify_beneficiary = "v2"
        verify_transfer_status = "v2"
        send_notification = "v2"
        fetch_account_balance = "v2"
        ledger_account_create = "v2"
        check_file_pending_transfers = "v2"
        process_rbl_multicurrency_file = "v2"
        one_off_db_processing = "v2"
        fetch_healthy_balance = "v2"

    [queue.redis]
        HOST = "env|REDIS_QUEUE_HOST"
        PORT = "env|REDIS_QUEUE_PORT"
#        WAIT = true
        PASSWORD = ""
        MAX_IDLE = 2
#        MAX_ACTIVE = 2
        MAX_IDLE_TIMEOUT = 3600
        DELAYED_TASKS_POLL_PERIOD = 600
    [queue.worker_queue_map]
#    This mapping represents the mapping b/w the "command" argument received by the FTS instance during bootstrap
#    and the redis machinery queue the FTS worker instance needs to listen on. Each FTS worker listens on only one
#    redis machinery queue.
#
#    The LHS (worker_name) is the argument supplied by k8s through entrypoint.sh to the FTS instance,
#    and the RHS (queue_name) is the name of the redis machinery queue. If the mapping for the supplied worker name does
#    not exist, then the worker will listen on the "DEFAULT_QUEUE" as defined above.
#
#    Fts is launched as
#        ./bin/fts -command=<worker_name>
#        If the argument is not supplied, then a default value as defined in the code will be used.
#
#    Treat the individual entries in this map as immutable. When a need is there to change this mapping, create
#    a new worker_name, and delete the old worker name after the queue has been emptied.

#       Example entry

#       worker_name                                     = queue_name
        initiate_transfer                               = "initiate_transfer"
        check_transfer_status                           = "check_transfer_status"
