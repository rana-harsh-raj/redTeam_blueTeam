[consumer_task]
    name = "fts"
    MaxConcurrency = 3

# ARENA FIX (milestone 1, TWIN_V1_AUDIT_AND_NEXT_STEP.md §3.7/§5.2/§8 B/item 2): upstream default.toml:429
# placeholder brokers ("broker:9092","broker1:9092") are non-resolvable compose services; the getter in
# pkg/kafka fails to build a producer, HandleFailedMessage's PublishWithKey call on the nil producer then
# panics the consumer process (reproduced/retained at
# reports/implementation/runs/claude-audit-kafka-repro-20260905T152544Z/). Point at the arena's real broker,
# matching [kafka_consumers.*.config].Brokers below, which already resolve "kafka:9092" successfully.
[kafka_producer]
    RetryBackoff          = 1
    MaxRetry              = 3
    Partitioner           = "random"
    MaxMessages           = 100
    Brokers               = ["kafka:9092"]
    EnableTLS             = false
    WaitForAck            = true
    CompressionType       = "snappy"
    CompressionEnabled    = true
    UserCertificate       = "some_secret"
    UserKey               = "some_secret"
    CACertificate         = "some_secret"

[api_internal_ingress_feature]
