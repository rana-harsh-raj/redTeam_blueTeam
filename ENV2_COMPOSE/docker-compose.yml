# Env 2 (public API payout, idempotency + webhooks) — runnable compose scaffold.
#
# SAFETY GATE (see README.md and preflight/preflight.py for the enforced version):
#   - rzp-arena is `internal: true` -- no container on it can reach the real
#     internet or real razorpay.{com,in,vpc} hosts, by construction.
#   - rzp-ingress is the ONLY network with a path to the HOST; kong-lite is
#     the sole entrypoint a developer's shell/test runner on the host can
#     reach. (verifier also joins both networks, but it is itself a
#     container-internal test harness, not the host -- it needs rzp-arena
#     directly for its datastore-assertion helpers, same as any other
#     in-arena service; it never gives the host a second path in.)
#   - Runtime images (build/*.Dockerfile) contain no credentials. Credentials
#     live only in ./secrets/*.txt (generated per-arena by secrets/gen-secrets.sh,
#     destroyed by secrets/destroy.sh) and in ./generated/<svc>/*.toml (rendered
#     per-arena by config/generate.py from arena.yaml + secrets/*.txt), both
#     bind-mounted read-only. Neither directory is baked into any image.
#   - No service mounts the host home directory, the Docker socket, or any
#     host credential path.
#
# Invocation: always `docker compose --env-file .env.arena -f docker-compose.yml <cmd>`
# (scripts/*.sh do this for you) -- .env.arena supplies the ${VAR} interpolation
# below (ports, image tag, subnet); it holds NO credentials.

x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 10s

x-twirp-health: &twirp-health
  # Confirmed pattern for payouts (:9400) and ledger (:8080) from each repo's
  # build/docker/*/probe.sh. Used for the two services where it's actually
  # confirmed; fts/cfa/x-balances use a plain TCP check instead (see below)
  # because the exact health path was NOT confirmed against their router code
  # in the time available for this scaffold -- flagged in findings/29.
  test: ["CMD", "wget", "-q", "-O", "/dev/null", "--post-data={\"service\":\"\"}",
         "--header=Content-Type: application/json",
         "http://127.0.0.1:__PORT__/twirp/rzp.common.health.v1.HealthCheckAPI/Check"]
  <<: *healthcheck-defaults

x-runtime-security: &runtime-security
  # No service in this file mounts the host home directory, the docker
  # socket, or a host credential path -- enforced by review, not by a
  # mechanism docker-compose itself provides. read_only root FS + explicit
  # tmpfs for the one writable path Go binaries typically need (none of
  # these write local files besides logs to stdout, so tmpfs is just /tmp).
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true

# Belt-and-suspenders egress block for the 5 real services, on top of
# rzp-arena's `internal: true` network-level block (see top-of-file
# comment): a Go process that ignores that and tries an HTTP(S) call
# honours HTTP_PROXY/HTTPS_PROXY by default (net/http's
# ProxyFromEnvironment) -- pointing both at a closed local port
# (127.0.0.1:9, the "discard" port, nothing ever listens there) makes any
# such call fail fast instead of hanging or, on a misconfigured network,
# escaping. NO_PROXY lists every arena-internal hostname (every service in
# this file, on rzp-arena or rzp-ingress, by its compose service name) so
# in-arena traffic between substitutes/datastores/core services is
# completely unaffected -- only a call to an unlisted (i.e. real-world)
# host would ever hit the blackhole proxy.
#
# M6 (I3) FIX: workflow-sim and workflow-engine were MISSING from NO_PROXY. Go's
# net/http honours HTTP_PROXY via ProxyFromEnvironment, so the moment
# ARENA_WORKFLOW_HOST pointed payouts at either of them, every WorkflowAPI/Create
# would have been routed to the blackhole proxy (127.0.0.1:9) and failed. It was
# invisible until now only because ARENA_WORKFLOW_HOST defaulted to the frozen
# dead address. Both are now listed, as is batch-sim.
x-proxy-env: &proxy-env
  # arena-only synthetic AWS credentials: LocalStack accepts any value but derives the region from the
  # SigV4 signature, and the AWS SDK refuses to sign without credentials. Never real; internal network only.
  AWS_ACCESS_KEY_ID: "ARENA_LOCALSTACK"
  AWS_SECRET_ACCESS_KEY: "arena-localstack-synthetic"
  AWS_REGION: "ap-south-1"
  AWS_DEFAULT_REGION: "ap-south-1"
  WORKDIR: /app
  APP_ENV: arena
  HTTP_PROXY: "http://127.0.0.1:9"
  HTTPS_PROXY: "http://127.0.0.1:9"
  NO_PROXY: "localhost,127.0.0.1,0.0.0.0,ledger-gate,payouts-api,payouts-worker-webhook-event,payouts-worker-queued-payout,payouts-worker-schedule-payout,payouts-worker-on-hold-payout,payouts-worker-fts-async-processing,payouts-worker-fts-async-hv-processing,payouts-worker-payout-create-failure-handling,payouts-worker-payout-update-failure-handling,payouts-worker-transaction-create,payouts-worker-generic-processing,payouts-worker-async-dual-write,payouts-worker-x-balances-balance-refresh,payouts-worker-payout-source-updater,payouts-worker-partner-bank-hold-payouts,payouts-worker-bulk-payouts,payouts-worker-batch-submitted-merchants,payouts-worker-data-consistency-checker,payouts-worker-data-consistency-event,payouts-worker-fund-management-payout-check,payouts-worker-fund-management-payout-initiate,payouts-worker-payout-usage-event-processing,payouts-worker-x-account-statement-source-event,payouts-worker-x-balance-payouts-event,payouts-worker-api-queue-for-async-dual-write-direct-push,payouts-kafka-fts-status-updates-consumer,payouts-kafka-fts-status-updates-retry-consumer,ledger-api,ledger-worker,ledger-scheduler,fts-web,fts-worker-default,fts-worker-initiate-transfer,fts-worker-check-transfer-status,fts-worker-fire-transfer-status-webhook,fts-worker-retry-transfer,fts-worker-retry-transfer-preprocessor,fts-worker-retry-transfer-source-update,fts-worker-rbl-initiate-transfer,fts-worker-rbl-check-transfer-status,fts-worker-rbl-imps-initiate-transfer,fts-worker-rbl-imps-check-transfer-status,fts-worker-rbl-direct-imps-initiate-transfer,fts-worker-rbl-direct-imps-check-transfer-status,fts-worker-hv-fire-transfer-status-webhook,fts-worker-hv-initiate-transfer,fts-worker-slow-lane-initiate-transfer,fts-worker-rbl-upi-initiate-transfer,fts-worker-rbl-upi-check-transfer-status,fts-worker-rbl-upi-hv-initiate-transfer,fts-worker-rbl-upi-hv-check-transfer-status,fts-worker-rbl-direct-initiate-transfer,fts-worker-rbl-direct-check-transfer-status,fts-worker-rbl-direct-upi-initiate-transfer,fts-worker-rbl-direct-upi-check-transfer-status,fts-worker-rbl-direct-imps-hv-initiate-transfer,fts-worker-rbl-direct-slow-lane-initiate-transfer,cfa-server,cfa-worker-contact,cfa-worker-fa,xbalances-server,xbalances-worker,api-ingress,kong-lite,monolith-stub,dcs-stub,splitz-stub,shield-stub,pricing-stub,asv-stub,bankingaccounts-stub,stork-capture,merchant-webhook-sink,xas-sim,mozart-mock,mozart-sim,workflow-sim,workflow-engine,batch-sim,mysql-payouts,mysql-fts,mysql-xbalances,mysql-apidb-stub,postgres-ledger,mongo-cfa,redis,localstack,kafka"

networks:
  rzp-arena:
    name: "rzp-arena${ARENA_SUFFIX:-}"
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: ${ARENA_SUBNET:-172.28.16.0/24}
  rzp-ingress:
    name: "rzp-ingress${ARENA_SUFFIX:-}"
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: ${INGRESS_SUBNET:-172.28.17.0/24}

volumes:
  # Generated synthetic material only; initialized with narrow consumer scope.
  config-payouts:
    name: "rzp-arena-config-payouts${ARENA_SUFFIX:-}"
  config-ledger:
    name: "rzp-arena-config-ledger${ARENA_SUFFIX:-}"
  config-fts:
    name: "rzp-arena-config-fts${ARENA_SUFFIX:-}"
  config-cfa:
    name: "rzp-arena-config-cfa${ARENA_SUFFIX:-}"
  config-xbalances:
    name: "rzp-arena-config-xbalances${ARENA_SUFFIX:-}"
  config-mozart-mock:
    name: "rzp-arena-config-mozart-mock${ARENA_SUFFIX:-}"
  secrets-kong:
    name: "rzp-arena-secrets-kong${ARENA_SUFFIX:-}"
  secrets-monolith:
    name: "rzp-arena-secrets-monolith${ARENA_SUFFIX:-}"
  # M6 (I3): narrow credential volume for the two Workflow-engine substitutes
  # (workflow-engine, workflow-sim). Both run as uid 10001, which cannot read
  # compose file-based secrets (host files stay 0600 / host-owned -- that
  # mechanism only works for the root-running cron-driver and verifier), so
  # secrets/materialize.py streams exactly two generated files into this volume
  # as uid-10001 0400: auth_workflow_payouts (payouts [auth.workflow], the
  # approve/reject callback credential) and wfe_admin_token (workflow-engine's
  # admin plane). Deliberately separate from secrets-kong so the admin token is
  # never on the ingress container's filesystem.
  secrets-workflow:
    name: "rzp-arena-secrets-workflow${ARENA_SUFFIX:-}"
  # M7: shared API-monolith ingress -- app/admin identities + stub credential (never merchant keys, which
  # stay in secrets-kong and are mounted read-only alongside), and its persistent SQLite state.
  secrets-ingress:
    name: "rzp-arena-secrets-ingress${ARENA_SUFFIX:-}"
  ingress-data:
    name: "rzp-arena-ingress-data${ARENA_SUFFIX:-}"
  mysql-payouts-data:
  mysql-fts-data:
  mysql-xbalances-data:
  mysql-apidb-data:
  postgres-ledger-data:
  mongo-cfa-data:
  redis-data:
  localstack-data:
  kafka-data:
  # M6: batch-sim's durable SQLite store (in-flight batches survive a restart
  # with their original idempotency keys). Declared per its compose-block.yml.
  batch-sim-data:
    name: "rzp-arena-batch-sim-data${ARENA_SUFFIX:-}"
  # M6 (I3): workflow-engine's durable SQLite state (orgs/actors/policies,
  # workflow instances, approvals, audit_log, callback deliveries). The engine
  # is restart-recoverable only because this survives a container restart;
  # `down -v` removes it with every other arena volume.
  wfengine-data:

secrets:
  # Datastore bootstrap credentials only (consumed via the official images'
  # *_FILE env-var convention). Application-level credentials for the 5 real
  # services are NOT passed as docker secrets -- config/generate.py inlines
  # them straight into ./generated/<svc>/*.toml at generate time (see header
  # comment above), because these are custom Go binaries reading a TOML file,
  # not images with a *_FILE convention.
  mysql_payouts_root_password:
    file: ./secrets/mysql_payouts_root_password.txt
  mysql_fts_root_password:
    file: ./secrets/mysql_fts_root_password.txt
  mysql_xbalances_root_password:
    file: ./secrets/mysql_xbalances_root_password.txt
  mysql_apidb_root_password:
    file: ./secrets/mysql_apidb_root_password.txt
  auth_fastcron_payouts:
    file: ./secrets/auth_fastcron_payouts.txt
  postgres_ledger_password:
    file: ./secrets/postgres_ledger_password.txt
  mongo_cfa_root_password:
    file: ./secrets/mongo_cfa_root_password.txt
  # "user:pass"-format bridge files for verifier/helpers/creds.py's
  # resolve_basic_auth() (SECRETS_DIR=/run/secrets, looks up files named
  # exactly by these secret names) -- see secrets/gen-secrets.sh's
  # verifier-bridge/ step for how each is derived from the auth_* pairs
  # above (best-effort mapping, documented there as unconfirmed against
  # VERIFIER_SPEC.md).
  ledger:
    file: ./secrets/verifier-bridge/ledger
  fts:
    file: ./secrets/verifier-bridge/fts
  monolith:
    file: ./secrets/verifier-bridge/monolith
  ps-fastcron:
    file: ./secrets/verifier-bridge/ps-fastcron
  ps-service:
    file: ./secrets/verifier-bridge/ps-service

services:

  # ======================================================================
  # datastores profile
  # ======================================================================

  mysql-payouts:
    image: mysql:8.0
    profiles: ["datastores"]
    networks: [rzp-arena]
    environment:
      MYSQL_DATABASE: payouts
      MYSQL_USER: payouts
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_payouts_root_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_payouts_root_password
    secrets: [mysql_payouts_root_password]
    volumes:
      - mysql-payouts-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root",
             "-p$$(cat /run/secrets/mysql_payouts_root_password)"]
      <<: *healthcheck-defaults

  mysql-fts:
    image: mysql:8.0
    profiles: ["datastores"]
    networks: [rzp-arena]
    environment:
      MYSQL_DATABASE: fts
      MYSQL_USER: fts
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_fts_root_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_fts_root_password
    secrets: [mysql_fts_root_password]
    volumes:
      - mysql-fts-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root",
             "-p$$(cat /run/secrets/mysql_fts_root_password)"]
      <<: *healthcheck-defaults

  mysql-xbalances:
    image: mysql:8.0
    profiles: ["datastores"]
    networks: [rzp-arena]
    environment:
      MYSQL_DATABASE: rx_balances_local
      MYSQL_USER: rx_balances_rw
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_xbalances_root_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_xbalances_root_password
    secrets: [mysql_xbalances_root_password]
    volumes:
      - mysql-xbalances-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root",
             "-p$$(cat /run/secrets/mysql_xbalances_root_password)"]
      <<: *healthcheck-defaults

  mysql-apidb-stub:
    # DDL-only skeleton standing in for the api-monolith's MySQL (payouts'
    # [db.api], x-balances' [APIStore.Sql]). No app logic, only the tables
    # monolith-stub/x-balances/payouts read directly. See seeds/mysql/.
    image: mysql:8.0
    profiles: ["datastores"]
    networks: [rzp-arena]
    environment:
      MYSQL_DATABASE: api_local
      MYSQL_USER: api_rx
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_apidb_root_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_apidb_root_password
    secrets: [mysql_apidb_root_password]
    volumes:
      - mysql-apidb-data:/var/lib/mysql
      - ./seeds/mysql/apidb-ddl:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root",
             "-p$$(cat /run/secrets/mysql_apidb_root_password)"]
      <<: *healthcheck-defaults

  postgres-ledger:
    image: postgres:15-alpine
    profiles: ["datastores"]
    networks: [rzp-arena]
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_ledger_password
    secrets: [postgres_ledger_password]
    volumes:
      - postgres-ledger-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      <<: *healthcheck-defaults

  mongo-cfa:
    image: mongo:6.0
    profiles: ["datastores"]
    networks: [rzp-arena]
    environment:
      MONGO_INITDB_ROOT_USERNAME: cfa_root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_cfa_root_password
      MONGO_INITDB_DATABASE: cfa
    secrets: [mongo_cfa_root_password]
    volumes:
      - mongo-cfa-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      <<: *healthcheck-defaults

  redis:
    image: redis:7-alpine
    profiles: ["datastores"]
    networks: [rzp-arena]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck-defaults

  localstack:
    image: localstack/localstack:3.8
    profiles: ["datastores"]
    networks: [rzp-arena]
    environment:
      SERVICES: sqs,sns
      DEFAULT_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1
      # LocalStack's own test credentials -- not a real AWS account, safe by
      # construction; preflight.py explicitly allow-lists this pattern.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      EAGER_SERVICE_LOADING: 1
      PERSISTENCE: 0
    volumes:
      - ./seeds/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:4566/_localstack/health"]
      <<: *healthcheck-defaults

  kafka:
    # KRaft single-node, no zookeeper (official Apache image; bitnami/kafka tags were removed from Docker Hub).
    image: apache/kafka:3.8.0
    profiles: ["datastores"]
    networks: [rzp-arena]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "RZPARENA0000000000000A"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      <<: *healthcheck-defaults

  # ======================================================================
  # migrations (one-shot; NOT started by `up` on any of the 4 required
  # profiles -- run explicitly via `docker compose --profile migrations run
  # --rm <svc>-migrate`, orchestrated by scripts/up.sh)
  # ======================================================================

  payouts-migrate:
    image: rzp-arena/payouts:${ARENA_TAG:-local}
    profiles: ["migrations"]
    networks: [rzp-arena]
    entrypoint: ["/app/payouts-migration"]
    command: ["up"]
    working_dir: /app
    user: appuser
    volumes:
      - config-payouts:/app/config:ro
      - ${PAYOUTS_REPO_MIGRATIONS_DIR}:/app/internal/database/migrations:ro
    env_file:
      - ./generated/payouts/payouts.env
    environment:
      <<: *proxy-env
    depends_on:
      mysql-payouts: {condition: service_healthy}
      mysql-apidb-stub: {condition: service_healthy}

  ledger-migrate:
    # Per findings/28_build_spike_ledger.md: goose-based, dispatches
    # RX-vs-PG Postgres dialect on the TENANT env var -- Env 2 wants plain
    # Postgres (TENANT=PG, not X/rx_migrations). `-dir` defaults to
    # internal/database/migrations, which does NOT exist in a fresh ledger
    # clone -- it's populated only by a CI-only step
    # (.github/workflows/review_ci.yml: `cp -r internal/database/pg_migrations/*
    # internal/database/migrations/`) that has no local-dev Makefile target.
    # LEDGER_REPO_MIGRATIONS_DIR (.env.arena) must point at that already-
    # materialized directory on the host (mirroring the CI step) --
    # `docker compose config -q` validates the YAML shape without that path
    # needing to exist yet, same convention as MOZART_BUILD_CONTEXT.
    image: rzp-arena/ledger:${ARENA_TAG:-local}
    profiles: ["migrations"]
    networks: [rzp-arena]
    entrypoint: ["/app/ledger-migration"]
    command: ["-dir=/app/internal/database/migrations", "up"]
    working_dir: /app
    user: appuser
    volumes:
      - config-ledger:/app/config:ro
      - ${LEDGER_REPO_MIGRATIONS_DIR:-./build/_ledger_migrations_not_configured}:/app/internal/database/migrations:ro
    env_file:
      - ./generated/ledger/ledger.env
    environment:
      <<: *proxy-env
      TENANT: "X"
      LEDGER_ARENA_PG_PASSWORD: "${LEDGER_ARENA_PG_PASSWORD:-}"
    depends_on:
      postgres-ledger: {condition: service_healthy}

  fts-migrate:
    # `fts-migrate` binary (`go build ./cmd/migration`) -- see fts-web's
    # comment on the corrected binary set. `-dir` must point at a mounted
    # copy of the fts repo's internal/migrations (FTS_REPO_MIGRATIONS_DIR,
    # .env.arena) -- exact CLI flag name not independently re-confirmed
    # against fts/cmd/migration/main.go in this pass; `-dir`/`up` mirrors
    # the goose-based convention ledger's own migration binary uses.
    image: rzp-arena/fts:${ARENA_TAG:-local}
    profiles: ["migrations"]
    networks: [rzp-arena]
    entrypoint: ["/app/fts-migrate"]
    command: ["-env=arena", "-dir=/app/internal/migrations", "up"]
    working_dir: /app
    user: appuser
    volumes:
      - config-fts:/app/config:ro
      - ${FTS_REPO_MIGRATIONS_DIR:-}:/app/internal/migrations:ro
    env_file:
      - ./generated/fts/fts.env
    environment:
      <<: *proxy-env
    depends_on:
      mysql-fts: {condition: service_healthy}

  cfa-migrate:
    image: rzp-arena/cfa:${ARENA_TAG:-local}
    profiles: ["migrations"]
    networks: [rzp-arena]
    entrypoint: ["/app/cfa-entry.sh", "/app/cfa-migration"]
    command: ["-v", "up"]
    working_dir: /app
    user: appuser
    volumes:
      - config-cfa:/app/config:ro
    env_file:
      - ./generated/cfa/cfa.env
    environment:
      <<: *proxy-env
    depends_on:
      mongo-cfa: {condition: service_healthy}

  xbalances-migrate:
    image: rzp-arena/xbalances:${ARENA_TAG:-local}
    profiles: ["migrations"]
    networks: [rzp-arena]
    entrypoint: ["/app/xbalances-migration"]
    command: ["-dir=/app/internal/database/migrations", "up"]
    working_dir: /app
    user: appuser
    volumes:
      - config-xbalances:/app/config:ro
      - ${XBALANCES_REPO_MIGRATIONS_DIR}:/app/internal/database/migrations:ro
    env_file:
      - ./generated/xbalances/xbalances.env
    environment:
      <<: *proxy-env
    depends_on:
      mysql-xbalances: {condition: service_healthy}
      mysql-apidb-stub: {condition: service_healthy}

  # ======================================================================
  # core profile — the 5 real services this arena exists to run
  # ======================================================================

  payouts-api:
    image: rzp-arena/payouts:${ARENA_TAG:-local}
    profiles: ["core"]
    networks: [rzp-arena]
    entrypoint: ["/app/payouts-api"]
    working_dir: /app
    user: appuser
    volumes:
