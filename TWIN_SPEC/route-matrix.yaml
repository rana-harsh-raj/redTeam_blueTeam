merchant_class_selectors:
  shared_vs_direct:
    monolith: "balance.account_type in {shared, direct} is the discriminator; banking_accounts.account_type is hard-coded CURRENT (api/app/Models/BankingAccount/Core.php:583; Balance/AccountType.php:19-33) and the /banking_accounts/* wire field account_type is populated from the BALANCE (BankingAccount/Service.php:1744,1819) — T02 #11"
    payouts: "bankingAccount.GetAccountType() (shared|direct|sub_balance; processorFactory.go:112,133-143). MerchantConfig features merge monolith-DB features + DCS (merchant/core.go:394-504); DCS direct_accounts/Configs holds ONLY in_flight_reservation_enabled (config-proto direct_accounts/configs.proto:3-15); other Direct-affecting flags live under FundTransfer, ApiInterface (rbl_ca_upi), direct_accounts/PayoutModeConfig (allowed_upi_channels); enable_payouts_buffer has no DCS Key() mapping at all (features.go:136-176) — T02 #4"
    fts: "selector = non-empty transfer.PreferredSourceAccountID in transfer_processor.go:964/1025 -> getDirectSourceAccount(AndMode) -> account/service.go:5314-5330 matching source_accounts.fund_account_id (NOT .id). service.go:551-556 is only a metrics label (C-006). source_accounts.account_type is lowercase direct|pool|rx_wallet (source_account.go:94-96,183; case-sensitive ==); bank_account_type NODAL|CURRENT|CORP_CARD"
    ledger: "shared_account_x (identifiers banking_account_id) vs direct_account_x (banking_account_stmt_detail_id). NOTE (C-004/C-010): PS never posts any Direct payout journal at this HEAD (payouts core.go:7284,7356 commented out, deprecation note :7208-7215); DA journals come only from the monolith statement-fetch linking path (api BankingAccountStatement/Core.php:5175-5228), modelled in the twin as a monolith-stub substitute emitter (D-006). PS still posts da_ext_debit/da_ext_credit on ART linking to external (bankingAccountStatement/core.go:735-798)"
    x-balances: "balance.account_type code constants are direct|shared|sub_balance (x-balances internal/constant/constant.go:38,61,63,65); pool|master appear only in unwired queries.sql. balance.status code values active|under_maintenance (constant.go:37,39). Twin seeds pool + status='activated' — C-007/C-008 OPEN (fetch paths miss the rows; GET /v1/balances/{id} unaffected)"

  direct_source_selection:   # M4 T12 (T02 §3/§B-D, T05 §1.2) — resolves C-003
    rule: "FetchSourceAccounts(product, preferred_source_account_id) matches source_accounts.fund_account_id; one candidate => used directly; >1 => selectDirectSourceAccountByRoutingRules: merchant rule {merchant_id, product, mode, channel} whose source_account_id == source_accounts.id -> default rule (merchant_id IS NULL) matched on mozart_identifier -> sourceAccounts[0] (oldest id) with INFO log; zero candidates => FTS_SOURCE_ACCOUNT_NOT_FOUND -> transfer FAILED -> PS failed"
    routing_rule_required: "NO with exactly one source_accounts row per (product, fund_account_id); rules are a tie-breaker only. A missing default rule only logs TraceDefaultDirectAccountRoutingNotPresent"
    source: fts/internal/account/service.go:5314-5330,5334-5349,5356-5382,5385-5410,5413-5448,5427-5434; fts/internal/transfer/transfer_processor.go:662; fts/internal/migrations/00020_direct_account_routing_rules_table_create.go; api/app/Services/FTS/Base.php:101 (monolith is only an admin proxy for rules)
    prod_default: prod RBL onboarding creates v1 AND v2 source accounts per merchant (source_account.go:135-138) so rules are exercised in prod; twin seeds one SA and a merchant rule (harmless parity)
    twin: REAL (FTS binary); merchant rules seeded (seeds/s4/fts.sql:52-53); no global rule and none needed
    fidelity: real

  create_fta_direct_marker:
    rule: shouldFetchSourceFtsFundAccountId -> DIRECT && channel in getNonTransactionChannels() [RBL,ICICI,AXIS,YESBANK,IDFC — no SLICE] -> preferred_source_account_id; SHARED && (subMerchantOnDirectMaster || subAccountPayout) -> preferred_source_account_id. PS-direct path sets it itself when Direct && channel in DirectChannelsForConnectedBanking [yesbank,axis,icici,rbl,idfc,slice] (T02 #7/#12 SLICE divergence)
    source: api/app/Services/FTS/FundTransfer.php:2053-2072,474-481; api/app/Models/Settlement/Channel.php:304-313; payouts/pkg/fts/transfer_init_create.go:277-279,297-299; payouts/internal/app/common/appConstants/accounts.go:33
    twin: monolith-stub sends preferred_source_account_id iff account_type==direct (server.py:406-409; no channel condition; misses SHARED sub-merchant case) — SUBSTITUTE, simplified; SLICE excluded from twin scope (m4-known-limits L-012)

  queueing_gate_direct:
    rule: reservationGate iff MerchantConfig.Feature[in_flight_reservation_enabled]==1 (DCS rzp/x/merchant/payouts/direct_accounts/Configs) else balanceBufferGate; threshold = queue_payout_bal_buffer when enable_payouts_buffer is on
    source: payouts/internal/app/payouts/processor/queueingstrategy/strategy.go:46-49; reservation_gate.go:90-124; pkg/dcs/features/features.go:20-24,57-60
    twin: "REAL and proven: V12/V13 are END_TO_END/CROSS_SERVICE_CONFIRMED for M2 with the gate + hook working (T04 C2 — the earlier 'PS never saw it' note was stale). dcs-stub serves the flag for M2 (seeds/dcs/merchants.json:83,90) via the ARENA_DCS_URL patch"

  workflow_gate:
    rule: see state-machines.yaml workflow_approval; DCS Workflows.enable_payout_workflow etc.; Private-auth + skip_approval_workflow_for_api => never workflow
    source: payouts/internal/app/payouts/processor/baseHelper.go:107-193; config-proto/rzp/x/merchant/payouts/workflows.proto
    twin: M3 fixture contract-faithful, but [workflow] host is http://127.0.0.1:1 so any workflow-applicable create fails (INCORRECT)

