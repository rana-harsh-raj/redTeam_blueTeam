# PAYOUTS_CLOSURE.yaml — material closure for RazorpayX BB+ Payouts, version 2026-09-04.v2 (baseline 2026-09-03.v1 + post-access delta)
# Tier semantics: F3 real service+schema; F2 protocol-faithful substitute; F1 behavioural placeholder; F0 graph-only; "F3-mock" = real binary in built-in mock mode.
closure_rule: 'Included if the component can authenticate the initiator, determine merchant/account identity, authorize or reject, alter beneficiary/amount/mode/source account, determine approval requirements, enforce a limit,
  create or mutate payout state, create or mutate Ledger state, initiate or update the fund transfer, reverse or compensate financial state, determine the merchant-visible final result, receive a status-changing callback,
  reconcile or repair status, route between legacy and new implementations, change behaviour through configuration, or perform a privileged admin mutation.

  '
must_not_be_mocked_simplistically:
- authorization
- ledger_state
- idempotency
- final_payout_state
- reversal
- tenant_isolation
- routing
- approval
- beneficiary_validation
