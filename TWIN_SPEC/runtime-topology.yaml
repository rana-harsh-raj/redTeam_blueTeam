network_boundaries:
  prod:
    - "cde <-> non-cde (prod/) crossing calls: payouts(cde), cfa(cde), mozart(cde) all call out to fts/ledger/dcs/splitz/stork/workflows/x-account-statements/x-balances/banking-account (all in the non-cde prod/ cluster). This is a real RBI/PCI network-segmentation boundary (CONFIRMED by the kube-manifests/cde/ vs kube-manifests/prod/ directory split), not a naming artifact. The actual firewall/network-policy rules enforcing this boundary are not in any readable repo — UNKNOWN mechanism, confirmed existence only."
  twin:
    - "rzp-arena (internal:true, no egress) hosts every core/substitute/datastore container on one flat network; rzp-ingress is the only network with a path to the host, and kong-lite is the sole container on both (docker-compose.yml top-of-file comment, lines 1-20)."
    - "The twin does NOT model the prod cde/non-cde segmentation boundary at all — every twin service can reach every other twin service freely. A test that depends on cde/non-cde network policy behavior (e.g. verifying payouts cannot directly reach an fts internal-only port, or that a non-cde compromise cannot reach cde services) has no twin equivalent."
