# Declared deviations registry -- Payouts Twin (Project RedGrid).
#
# Machine-readable list of every known difference between the twin and the
# deployed system that a reader could otherwise mistake for production
# behaviour. The acceptance-gate producer embeds this file verbatim, so it is
# written in the strict YAML subset that ENV2_COMPOSE/config/_miniyaml.py
# parses (block mappings, one block sequence, single-line single-quoted
# scalars, no anchors, no multi-line strings, no tabs). It also parses under
# PyYAML; keep both true.
#
# Field contract, per entry:
#   id               DEV-nnn, stable once published.
#   service          payouts | fts | ledger | ledger-gate | x-balances | cfa |
#                    monolith | arena (cross-cutting).
#   location         twin file:key or file:line the deviation lives at.
#   twin_value       what the twin does.
#   deployed_value   what production does. MUST be quoted from a file that was
#                    actually opened; otherwise the literal ASSUMED.
#   deployed_source  file:line in the pinned pristine clones or kube-manifests,
#                    or ASSUMED.
#   classification   endpoint_substitution | credential_substitution |
#                    behaviour_toggle | timing | concurrency |
#                    deployment_parity | schema | representative_substitute |
#                    safety
#   reason           why the twin is like this.
#   could_conceal    what evidence this deviation makes untrustworthy.
#   status           declared | fixed_in_m1
#   fix_ref          file changed (fixed_in_m1 only); empty string otherwise.
#
# Endpoint and credential substitutions are deliberately grouped one entry per
# service rather than enumerated per key: individually they assert nothing
# about behaviour, and the per-key detail is reproducible from the generated
# config (ENV2_COMPOSE/config/generated/, rebuilt by scripts/up.sh step 2/8).
version: 1
generated: '2026-09-05'
