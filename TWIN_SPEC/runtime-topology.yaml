# Runtime topology: production (cde/prod k8s overlays) vs the Env2 twin (ENV2_COMPOSE).
# Sources: reports/fidelity/raw/12_runtime_topology_effective_config.md (primary, "L12"),
# 04_payouts_service_core.md §6/§8 ("L04"), 06_fts_routing_status_mozart.md §2.5 ("L06"),
# 07_ledger_balances_cfa_banking.md §5-7 ("L07"), 09_stork_webhooks_kafka.md §4 ("L09"),
# 10_dcs_splitz_pricing_shield_asv.md §A-B ("L10"). Prod paths are relative to the REPOS root
# L12 defines (kube-manifests/, payouts/, fts/, ledger/, cfa/, x-balances/, spinacode/); twin
# paths are relative to ENV2_COMPOSE/. No secret values recorded; no real internal IPs recorded.
version: 1

clusters:
  # CONFIRMED structural fact (L12 top): kube-manifests has two disjoint top-level prod
  # overlays. This is a real RBI/PCI network-segmentation boundary, not a naming artifact.
  cde:
    - payouts        # kube-manifests/cde/payouts
    - cfa             # kube-manifests/cde/cfa
    - mozart          # kube-manifests/cde/mozart (+ mozart-dark, mozart-pagination, mozart-test, mozart-whitelisted variants)
    - batch-clearing  # kube-manifests/cde/batch-clearing (not independently profiled this pass)
  prod:
    - fts
    - ledger
    - dcs
    - splitz
    - stork
    - workflows
    - x-account-statements
    - x-balances
    - batch
    - banking-account
  unclustered_or_unconfirmed:
    # api (monolith) has ~45 payout-relevant SQS/Kafka Deployments (L12 §1) but its own
    # cde-vs-prod cluster placement was not independently confirmed in this lane — UNKNOWN.
    - api
    - api-cron

services:
  payouts:
    tier_in_twin: REAL
    production_deployments:
      - {name: payouts (api), args: "[api]", role_selector: "APP_MODE/APP_ENV=prod", replicas: "10 (12-25 HPA) + canary(1) + baseline(1)", source: "kube-manifests/cde/payouts/values.yaml:1,19-21; templates/payouts/templates/payouts-deployment.yaml"}
      - {name: payouts-worker-queued-processing-live, role_env: "PAYOUTS_WORKER_NAME=queued_payout", replicas: "1 (1-5 HPA)", queue: "job.queued_payout (prod-payouts-queued-live)", source: "templates/payouts/templates/payouts-worker-queued-processing-live.yaml"}
      - {name: payouts-worker-schedule-processing-live, role_env: "PAYOUTS_WORKER_NAME=schedule_payout", replicas: "1 (1-5 HPA)", queue: job.schedule_payout, source: "templates/payouts/templates/payouts-worker-schedule-processing-live.yaml"}
      - {name: payouts-worker-on-hold-processing-live, role_env: "PAYOUTS_WORKER_NAME=on_hold_payout", replicas: "1 (1-5 HPA)", queue: job.on_hold_payout, source: "templates/payouts/templates/payouts-worker-on-hold-processing-live.yaml"}
      - {name: payouts-worker-partner-bank-hold-payouts-live, role_env: "PAYOUTS_WORKER_NAME=partner_bank_hold_payouts", replicas: "1 (1-5 HPA)", queue: job.partner_bank_hold_payouts, source: "templates/payouts/templates/payouts-worker-partner-bank-hold-payouts-live.yaml"}
      - {name: payouts-worker-transaction-create-live, role_env: "PAYOUTS_WORKER_NAME=transaction_create", replicas: "10 (10-20 HPA)", queue: job.transaction_create, source: "templates/payouts/templates/payouts-worker-transaction-create-live.yaml"}
      - {name: payouts-worker-fts-async-processing-live, role_env: "PAYOUTS_WORKER_NAME=fts_async_processing", replicas: "30 (30-50 HPA)", queue: job.fts_async_processing, source: "templates/payouts/templates/payouts-worker-fts-async-processing-live.yaml"}
      - {name: payouts-worker-fts-async-hv-processing-live, role_env: "PAYOUTS_WORKER_NAME=fts_async_hv_processing", replicas: "10 (10-20 HPA)", queue: job.fts_async_hv_processing, source: "templates/payouts/templates/payouts-worker-fts-async-hv-processing-live.yaml"}
      - {name: payouts-worker-generic-processing-live, role_env: "PAYOUTS_WORKER_NAME=generic_processing", replicas: "1 (1-5 HPA)", queue: job.generic_processing, source: "templates/payouts/templates/payouts-worker-generic-processing-live.yaml"}
      - {name: payouts-worker-async-dual-write-live, role_env: "PAYOUTS_WORKER_NAME=async_dual_write", replicas: "1 (1-5 HPA)", queue: job.async_dual_write, source: "templates/payouts/templates/payouts-worker-async-dual-write-live.yaml:1-135"}
      - {name: payouts-worker-x-balances-balance-refresh-live, role_env: "PAYOUTS_WORKER_NAME=x_balances_balance_refresh", replicas: "2 (2-5 HPA)", queue: "job.x_balances_balance_refresh (prod-x-balances-balance-refresh-live)", source: "templates/payouts/templates/payouts-worker-x-balances-balance-refresh-live.yaml"}
      - {name: payouts-worker-source-updater-live, role_env: "PAYOUTS_WORKER_NAME=payout_source_updater", replicas: "0 (no HPA row found)", queue: job.source_updater, source: "cde/payouts/values.yaml:96"}
      - {name: payouts-worker-webhook-event-live, role_env: "PAYOUTS_WORKER_NAME=webhook_event", replicas: "1 (1-5 HPA)", queue: job.webhook_event, source: "templates/payouts/templates/payouts-worker-webhook-event-live.yaml"}
      - {name: payouts-worker-payout-create-failure-handlng-live (repo typo, missing "i"), role_env: "PAYOUTS_WORKER_NAME=payout_create_failure_handling", replicas: "1 (1-5 HPA)", queue: job.payout_create_failure_handling, source: "templates/payouts/templates/payouts-worker-payout-create-failure-handlng-live.yaml"}
      - {name: payouts-worker-payout-update-failure-handlng-live (same typo), role_env: "PAYOUTS_WORKER_NAME=payout_update_failure_handling", replicas: "1 (1-5 HPA)", queue: job.payout_update_failure_handling, source: "templates/payouts/templates/payouts-worker-payout-update-failure-handlng-live.yaml"}
      - {name: payouts-worker-batch-submitted-merchants-live, role_env: "PAYOUTS_WORKER_NAME=batch_submitted_merchants", replicas: "1 (1-5 HPA)", queue: job.batch_submitted_merchants, source: "templates/payouts/templates/payouts-worker-batch-submitted-merchants-live.yaml"}
      - {name: payouts-worker-bulk-payouts-live, role_env: "PAYOUTS_WORKER_NAME=bulk_payouts", replicas: "1 (1-5 HPA)", queue: job.bulk_payouts, source: "templates/payouts/templates/payouts-worker-bulk-payouts-live.yaml"}
      - {name: payouts-worker-data-consistency-checker-processing-live, role_env: "PAYOUTS_WORKER_NAME=data_consistency_checker", replicas: "5 (5-12 HPA)", queue: job.data_consistency_checker, source: "templates/payouts/templates/payouts-worker-data-consistency-checker-processing-live.yaml"}
      - {name: payouts-worker-data-consistency-event-processing-live, role_env: "PAYOUTS_WORKER_NAME=data_consistency_event", replicas: "1 (1-5 HPA)", queue: job.data_consistency_event, source: "templates/payouts/templates/payouts-worker-data-consistency-event-processing-live.yaml"}
      - {name: payouts-worker-fmp-check-live, role_env: "PAYOUTS_WORKER_NAME=fund_management_payout_check", replicas: "1 (1-3 HPA)", queue: job.fund_management_payout_check, source: "templates/payouts/templates/payouts-worker-fmp-check-live.yaml"}
      - {name: payouts-worker-fmp-initiate-live, role_env: "PAYOUTS_WORKER_NAME=fund_management_payout_initiate", replicas: "1 (1-3 HPA)", queue: job.fund_management_payout_initiate, source: "templates/payouts/templates/payouts-worker-fmp-initiate-live.yaml"}
      - {name: payouts-worker-mail-and-sms-event-live, role_env: "PAYOUTS_WORKER_NAME=mail_and_sms_event", replicas: "0 (HPA min 1)", queue: job.mail_and_sms_event, source: "cde/payouts/values.yaml", note: "deployed-in-prod, not found in payouts/internal/job source per L04 — likely dead/legacy"}
      - {name: payouts-worker-update-source-event-live, role_env: "PAYOUTS_WORKER_NAME=update_source_event", replicas: "0 (HPA 1-5)", queue: job.update_source_event, source: "cde/payouts/values.yaml", note: "deployed-in-prod, not found in payouts/internal/job source per L04 — likely dead/legacy"}
      - {name: payouts-worker-payout-usage-event-processing-live, role_env: "PAYOUTS_WORKER_NAME=payout_usage_event_processing", replicas: "2 (2-5 HPA)", queue: job.payout_usage_event_processing, source: "templates/payouts/templates/payouts-worker-payout-usage-event-processing-live.yaml"}
      - {name: payouts-worker-rbl-account-statement-live, role_env: "PAYOUTS_WORKER_NAME=rbl_banking_account_statement", replicas: "1 (1-8 HPA)", queue: "job.rbl_banking_account_statement", source: "templates/payouts/templates/payouts-worker-rbl-account-statement-live.yaml"}
      - {name: payouts-kafka-fts-status-updates-consumer, role_env: "PAYOUTS_CONSUMER_TASK_NAME", replicas: "1 (1-5 HPA)", topic: rx-fts-status-update-events, source: "templates/payouts/templates/payouts-kafka-fts-status-updates-consumer.yaml:73"}
      - {name: payouts-kafka-fts-status-updates-retry-consumer, role_env: "PAYOUTS_CONSUMER_TASK_NAME", replicas: "1 (1-5 HPA)", topic: rx-fts-status-update-retry-events, source: "templates/payouts/templates/payouts-kafka-fts-status-updates-retry-consumer.yaml"}
      - {name: "FastCron ingress (not a k8s CronJob)", role: "Traefik Middleware payouts-fastcron-ip-whitelist gates Host(payouts-ext)&&PathPrefix(/v1/cron/) to FastCron source IPs -> payouts-edge-redirect Service:8000, fronting 21 /v1/cron/* routes", source: "templates/payouts/templates/ing-v2.yaml:101-135; payouts/internal/routing/router/cron_routes.go:11-176"}
    twin_processes:
      # 1 api + 14 workers + 2 kafka consumers = 17 of 25 always-on prod processes (24 workers + 1 api).
      - payouts-api
      - payouts-worker-webhook-event
      - payouts-worker-queued-payout
      - payouts-worker-schedule-payout
      - payouts-worker-on-hold-payout
      - payouts-worker-fts-async-processing
      - payouts-worker-fts-async-hv-processing
      - payouts-worker-payout-create-failure-handling
      - payouts-worker-payout-update-failure-handling
      - payouts-worker-transaction-create
      - payouts-worker-generic-processing
      - payouts-worker-async-dual-write
      - payouts-worker-x-balances-balance-refresh
      - payouts-worker-payout-source-updater
      - payouts-worker-partner-bank-hold-payouts
      - payouts-kafka-fts-status-updates-consumer
      - payouts-kafka-fts-status-updates-retry-consumer
    gaps:
      - "10 worker roles have no twin container at all: data_consistency_checker, data_consistency_event, fmp_check (fund_management_payout_check), fmp_initiate (fund_management_payout_initiate), batch_submitted_merchants, bulk_payouts, mail_and_sms_event, payout_usage_event_processing, rbl_banking_account_statement, update_source_event. Two of these (mail_and_sms_event, update_source_event) are themselves dead code in the real payouts repo per L04 (deployed but no matching internal/job) — omitting them is contract-faithful, not a gap. The other 8 are real coverage gaps; fmp_check/initiate and data_consistency_* directly affect payout/CA-balance state (per L12 Twin comparison row 'payouts workers')."
      - "FastCron's 21 HTTP /v1/cron/* routes are only partially modeled: the twin's cron-driver (scripts/cron-driver/driver.py) hits 6 of them; process_batch_submitted_payouts (bulk NEFT/RTGS dispatch, payout-state-affecting) is entirely absent from the driver, as is payouts_sla_breach_monitor and fund_management_payouts/check — see cron section below."
      - "No canary/baseline/HPA modeled (expected for a single-node arena; no fidelity impact)."
    required_minimum_for_twin:
      create: "payouts-api + payouts-worker-transaction-create — present"
      status: "payouts-kafka-fts-status-updates-consumer(+retry) + payouts-worker-fts-async-processing(+hv) — present"
      queued_scheduled_on_hold: "payouts-worker-queued-payout, payouts-worker-schedule-payout, payouts-worker-on-hold-payout, payouts-worker-partner-bank-hold-payouts — present"
      reversal: "handled synchronously in payouts-api's ledger-reversal path (reversalViaLedgerService.go per L04/L07) + payouts-worker-payout-update-failure-handling for async retry — present"
      webhooks: "payouts-worker-webhook-event — present"
      bulk: "payouts-worker-bulk-payouts — MISSING (no container)"
      repair: "payouts-worker-payout-create-failure-handling + payouts-worker-payout-update-failure-handling present; payouts-worker-data-consistency-checker + -data-consistency-event (state-drift repair) — MISSING"

  fts:
    tier_in_twin: REPRESENTATIVE SUBSTITUTE (real binary, partial topology)
    production_deployments:
      - {name: fts-live, args: "[web]", replicas: 11, role: "web API", source: "kube-manifests/prod/fts/values.yaml:6,8; templates/fts/templates/fts-live-deployment.yaml:1-80"}
      - {name: "157+1 fts-live-worker-*-deployment.yaml files (each renders live/canary/baseline)", role_selector: "positional CLI arg args:[worker,<queue-key>], e.g. rbl::direct::imps::check_transfer_status", banks: "axis, icici, idfc, yesbank, rbl(+direct/v4/v5), slice(+v1), amazon-pay, ocbc, hdfc(bulk), batch-icici-neft", concurrency_source: "fts/config/env.prod-live.toml:45-127 [queue.worker_concurrency_map], per-key 1-45 (default 5)", source: "templates/fts/templates/fts-live-worker-*-deployment.yaml (count via ls|grep -c)"}
    twin_processes:
      - fts-web
      - fts-worker-default
      - fts-worker-initiate-transfer
      - fts-worker-check-transfer-status
      - fts-worker-fire-transfer-status-webhook
      - fts-worker-retry-transfer
      - fts-worker-retry-transfer-preprocessor
      - fts-worker-retry-transfer-source-update
      - fts-worker-rbl-initiate-transfer
      - fts-worker-rbl-check-transfer-status
      - fts-worker-rbl-imps-initiate-transfer
      - fts-worker-rbl-imps-check-transfer-status
      - fts-worker-rbl-direct-imps-initiate-transfer
      - fts-worker-rbl-direct-imps-check-transfer-status
    gaps:
      - "~145 of ~157 bank/rail-specific worker roles have no container (icici, idfc, yesbank, slice, amazon-pay, ocbc, hdfc, axis, batch-icici-neft all entirely unmodeled; only a generic set + a partial RBL fan-out exist)."
      - "CONFIRMED (config/templates/base/fts/env.default.toml:106-166 vs env.arena.toml:72-90): the twin's env.arena.toml does NOT override [queue.worker_queue_map] — that key is absent from arena.toml entirely, so the merged config inherits ALL ~90 real bank/rail worker_queue_map entries unmodified from env.default.toml (config-correct). The gap is purely topological: only 13 of those ~90 keys have a running fts-worker-* container behind them. arena.toml separately defines its OWN unrelated [queue.queue_map]/[queue.task_worker_map] keys (13-14 generic 'default' mappings) which appear to be dead/unused config additions, not an override of worker_queue_map."
      - "fts's Kafka producer leg (kafka_producers.fire_transfer_status, the async status-update path to payouts) is profile-gated: ARENA_ROUTE_PROFILE defaults to 'monolith' (config/generate.py:90, ARENA_ROUTE_PROFILE not set anywhere in .env.arena/scripts), under which config/routes.py:58-60 sets enabled=false. Prod has this producer permanently enabled=true (fts/config/env.prod-live.toml:315-331). Only the 'kafka' route profile matches prod; the default profile does not."
    required_minimum_for_twin:
      create_status: "initiate_transfer + check_transfer_status + rbl fan-out — present"
      webhooks: "fire_transfer_status_webhook — present"
      reversal: "handled in-binary via FTS FSM (no dedicated worker needed) — present"
      repair: "retry_transfer + retry_transfer_preprocessor + retry_transfer_source_update — present"
      bulk: "no FTS-side bulk-specific worker identified as required"

  ledger:
    tier_in_twin: CONTRACT-FAITHFUL topology, MECHANISM-BROKEN scheduler (see gaps — high-severity finding)
    production_deployments:
      - {name: ledger (web/api), role_selector: "APP_MODE=live,APP_ENV=prod-live", source: "kube-manifests/prod/ledger/values.yaml:3,605; templates/ledger/templates/deployment-live.yaml"}
      - {name: ledger-account-create-worker-live, role_env: "LEDGER_WORKER_QUEUENAME=account_create_queue_name_live", replicas: 3, queue: prod-ledger-account-create-live, source: "prod/ledger/values.yaml:54"}
      - {name: ledger-balance-update-worker-live, role_env: "LEDGER_WORKER_QUEUENAME=balance_update_queue_name_live", replicas: 3, queue: prod-ledger-balance-update-live, source: "prod/ledger/values.yaml:67"}
      - {name: ledger-journal-create-worker-live, role_env: "LEDGER_WORKER_QUEUENAME=journal_create_queue_name_live", replicas: 2, queue: prod-ledger-journal-create-live, source: "prod/ledger/values.yaml:41"}
      - {name: "ledger-entry-details-create-worker-live (+ -pg variant)", queue: "prod-ledger-entry-details-create-live / -pg-live", source: "templates/ledger/templates/*entry-details-create*.yaml"}
      - {name: ledger-split-account-balance-update-live (+pg-live), kind: CronJob, schedule: "*/10 * * * * (prod/ledger/values.yaml:610)", role_selector: "env LEDGER_SCHEDULER_COMMAND={{.Values.split_account_balance_update_cronjob_scheduler_cmd}} on image ledger:scheduler-<tag>", source: "kube-manifests/templates/ledger/templates/split-account-balance-update-cronjob-live.yaml:35-43,65"}
      - {name: "ledger-verify-warm-storage-live (+test)", kind: CronJob, schedule: "0 * * * * (hardcoded)", source: "templates/ledger/templates/verify-warm-storage-cronjob-live.yaml:14"}
      - {name: "15 journal-create-<product>-pg-* + 13+ makeshift-txn-worker (per non-payouts tenant)", note: "correctly out of scope for a payouts-focused twin", source: "prod/ledger/values.yaml:612-1426"}
    twin_processes:
      - ledger-api
      - ledger-worker
      - ledger-scheduler
    gaps:
      - "CRITICAL, CONFIRMED: ledger-worker is hardcoded to a single queue. config/templates/base/ledger/{default,arena}.toml:333-334 both set [worker].queueName=\"account_create\" and no LEDGER_WORKER_QUEUENAME env override is set on the ledger-worker compose service (docker-compose.yml ledger-worker block has no such env var). Prod runs 4 SEPARATE Deployments (account_create/balance_update/journal_create/entry_details_create(+pg)), each with its own LEDGER_WORKER_QUEUENAME. The twin's single worker ONLY ever consumes account_create; messages published to the balance_update, journal_create, ledger_entry_details_create(+pg) SQS queues (all created by seeds/localstack/init-queues.sh) are never consumed by anything."
      - "CRITICAL, CONFIRMED: ledger-scheduler runs the WRONG job. Prod's real CronJob passes LEDGER_SCHEDULER_COMMAND=split-account-balance-update (or pg-split-account-balance-update) as an env var (kube-manifests/templates/ledger/templates/split-account-balance-update-cronjob-live.yaml:40-41), consumed at ledger/internal/boot/boot.go:693 (Execute(ctx, Config.Scheduler.Command, ...)). The twin's ledger-scheduler compose service sets NO such env var, so it falls back to config/templates/base/ledger/arena.toml:438-439's static [scheduler].command = \"journal-created-sns-publish\" (same value already in ledger/config/default.toml:425) — i.e. the twin's ledger-scheduler perpetually runs the SNS journal-created outbox publisher, NOT the split-account-balance-update reconciliation prod's CronJob performs every 10 minutes. This directly affects split-account balance correctness testing."
      - "Mechanism mismatch even once the command is fixed: prod's scheduler is a k8s CronJob (runs-to-completion every 10 min, self-heals on next tick if a run fails); the twin's ledger-scheduler is a long-running compose service (entrypoint /app/ledger-scheduler, pgrep healthcheck, no visible internal loop/interval in the arena.toml [scheduler] block beyond `ttl=10m`) — whether /app/ledger-scheduler's own main loop reproduces a 10-minute cadence internally is UNKNOWN (not read this pass; ledger/cmd/scheduler/main.go was located but its loop body not traced)."
    required_minimum_for_twin:
      journal_write: "payout_initiated is synchronous via JournalAPI/Create (Twirp), not queue-mediated — unaffected by the worker gap above; payout_processed (shared-only) IS async via payout_meta_temporary + payout_update_failure_handling on the PAYOUTS side, which does not depend on ledger's own SQS workers"
      split_account_balance_correctness: "BROKEN until ledger-scheduler's command is corrected (see gaps)"

  cfa:
    tier_in_twin: REAL
    production_deployments:
      - {name: "cfa web(8)/-canary(1)/-baseline(1)", source: "kube-manifests/cde/cfa/values.yaml:19-42, HPA 8-10@65%CPU"}
      - {name: cfa-worker-fa, role_env: "CFA_WORKER_QUEUE_NAME=prod-api-rx-fund-account-lazy-loading-live", replicas: "1 (1-3 HPA)", source: "cde/cfa/values.yaml:44-67"}
      - {name: cfa-worker-contact, role_env: "CFA_WORKER_QUEUE_NAME=prod-api-rx-contact-lazy-loading-live", replicas: "1 (1-3 HPA)", source: "cde/cfa/values.yaml:44-67"}
      - {name: "cron", note: "crons: [] — currently disabled in prod (cde/cfa/values.yaml:69-71)"}
    twin_processes: [cfa-server, cfa-worker-contact, cfa-worker-fa]
    gaps:
      - "None structural — exact 1:1 role match. Queue names differ (twin: contact-lazy-load/fund-account-lazy-load short names vs prod's prod-api-rx-*-lazy-loading-live) — cosmetic per L12, contract-faithful since twin config+seed agree with each other."
    required_minimum_for_twin: "fully covered"

  x-balances:
    tier_in_twin: REPRESENTATIVE SUBSTITUTE (real binary, 1 of 5 bank-worker roles)
    production_deployments:
      - {name: "web(4)/-canary(1)/-baseline(1)", source: "kube-manifests/prod/x-balances/values.yaml:28-43"}
      - {name: x-balances-worker-rbl-balance-fetch, replicas: "8 (8-20 HPA)", source: "prod/x-balances/values.yaml:45-236+"}
      - {name: x-balances-worker-icici-balance-fetch, replicas: "1 (2-8 HPA)"}
      - {name: x-balances-worker-yesbank-balance-fetch, replicas: "1 (4-8 HPA)"}
      - {name: x-balances-worker-axis-balance-fetch, replicas: "1 (2-8 HPA)"}
      - {name: x-balances-worker-idfc-balance-fetch, replicas: "1"}
    twin_processes: [xbalances-server, xbalances-worker]
    gaps:
      - "4 of 5 bank-specific worker roles (icici, yesbank, axis, idfc) have no container; twin's single generic xbalances-worker cannot represent per-bank fetch cadence/failure modes."
    required_minimum_for_twin: "RBL fetch (matches the golden run's M2 Direct/RBL seed merchant) — plausibly covered if xbalances-worker's queue maps to the rbl-balance-fetch equivalent; other 4 banks not required for the current 3-merchant seed set"

  stork:
    tier_in_twin: REPRESENTATIVE SUBSTITUTE (appropriate — shared platform service, not payout-state-mutating)
    production_deployments:
      - {name: stork-api, replicas: "min 10/max 72 HPA", source: "prod/stork/values.yaml:7-8"}
      - {name: stork-sms-worker, replicas: 4, source: "prod/stork/values.yaml:23-103"}
      - {name: "stork-webhook-worker (+ -p1 variant)", replicas: "10 (+10)", source: "prod/stork/values.yaml:23-103"}
      - {name: scheduler, kind: CronJob, schedule: "*/3 * * * *", source: "prod/stork/values.yaml:422"}
      - {name: webhook_disabler, kind: CronJob, schedule: "*/30 * * * *", source: "prod/stork/values.yaml:424"}
      - {name: partitioner, kind: CronJob, schedule: "UNKNOWN — templated (templates/stork/templates/cronjobs.yaml:189) but value not located in prod/stork/values.yaml lines inspected"}
    twin_processes: [stork-capture]
    gaps:
      - "No retry/backoff modeling (real: 15 attempts over 24h+ exponential backoff), no SMS delivery, no cron-driven disable/partition logic. By design (out of the payout-state-mutation critical path)."
    required_minimum_for_twin: "ProcessEvent/webhook delivery + payout.* event capture — present"

  mozart:
