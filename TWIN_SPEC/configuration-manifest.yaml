arena_generation_rules:
  # What config/generate.py (and its helper routes.py / apply-arena-patches.sh) must do differently
  # to match production semantics, ranked by confirmed behavioral impact.
  - rule: "Set [splitz].client_side_eval = false in config/templates/base/payouts/arena.toml (currently true), matching payouts/config/prod.toml:442's override of default.toml. This alone reactivates all 38+30 Splitz-gated behaviors across payouts/fts by routing them through splitz-stub's already-correct Evaluate/EvaluateBulk seed lookup instead of the always-empty FetchDecisionContext path."
    confirmed_impact: high
  - rule: "Set LEDGER_SCHEDULER_COMMAND=split-account-balance-update as an env var on the ledger-scheduler compose service (or hardcode [scheduler].command=\"split-account-balance-update\" in ledger/arena.toml), replacing the current journal-created-sns-publish default. Optionally add a second scheduler process/profile for pg-split-account-balance-update to match prod's 2 CronJobs."
    confirmed_impact: high
  - rule: "Set LEDGER_WORKER_QUEUENAME per ledger-worker instance (or split into 4 compose services: ledger-worker-account-create, -balance-update, -journal-create, -entry-details-create), matching prod's 4-Deployment topology instead of the current single worker hardcoded to account_create only."
    confirmed_impact: high
  - rule: "No further DCS patch needed: build/arena-patches/goutils-dcs-<version>/dcs.go:180-186 already makes GetContextUrl() fall back to os.Getenv(\"ARENA_DCS_URL\"), consulted first by getLoginURI (:111) and getURLAndMode (:192), so login and per-request Get/EnabledFeatures calls from payouts, cfa and x-balances all reach dcs-stub (verified 2026-09-05; supersedes lane 10 inference). Keep the patch documented as arena-only."
    confirmed_impact: verified
  - rule: "Set ARENA_ROUTE_PROFILE=kafka (or add process_batch_submitted_payouts + a 3rd worker/queue) as the DEFAULT profile if the FTS Kafka status-update leg and payouts' async-processing path need to match prod's permanently-enabled=true producer; otherwise document explicitly that the twin's default behavior (monolith relay, Kafka producer off) is a deliberate profile choice, not an oversight."
    confirmed_impact: medium
  - rule: "Add the 8 missing payouts worker roles that ARE still live in prod's own job list (fmp_check, fmp_initiate, data_consistency_checker, data_consistency_event, batch_submitted_merchants, bulk_payouts, payout_usage_event_processing, rbl_banking_account_statement) as compose services — mechanical, since the real payouts binary + queue keys already exist in config/templates/base/payouts/arena.toml's [job] section."
    confirmed_impact: medium
  - rule: "Correct kafka_consumers.status_update_retry_consumer.config.RetryBackoff from 5 to 30 in config/templates/base/payouts/arena.toml to match prod's real retry-topic backoff, if retry-timing-sensitive tests are ever run against the twin."
    confirmed_impact: low_unless_timing_tested
  - rule: "Set [features].ikey_auto_enforcement=true and [api_internal_ingress_feature].enable=true in config/templates/base/payouts/arena.toml — both are plain literal prod overrides (not env-injected secrets), so both are directly fixable, unlike forward/reverse_dual_write which remain genuinely unknown."
    confirmed_impact: medium
  - rule: "Rewrite seeds/s4/cron_schedule.yaml's 5 payouts_service job endpoint paths to match scripts/cron-driver/driver.py's already-correct real routes, and add process_batch_submitted_payouts to both files as a 6th job."
    confirmed_impact: documentation_only_but_should_not_ship_stale
