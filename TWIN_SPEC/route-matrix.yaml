direct_status_transports:
  A_ps_fts_create_direct:      {route: "POST /v1/transfer", identity: "payouts [fts.auth] + X-Origin: payouts", src_dst: "payouts-worker-fts-async-processing -> fts-web", correlation: "source_id <-> transfers.source_id (UNIQUE)", twin: "native (profile direct/kafka)", fidelity: real}
  B_ps_monolith_fts_create:    {route: "POST /v1/payouts_service/create_fta/{id} then POST /v1/transfer", identity: "monolith users.api", src_dst: "payouts -> monolith-stub -> fts-web", correlation: same, twin: "substitute (default profile)", fidelity: substitute}
  C_fts_bank:                  {route: "POST /fts/rbl/v1/transfer_init | /transfer_status", identity: source_accounts.credentials, src_dst: "fts-worker-rbl-(direct-)imps-* -> mozart-sim", correlation: "attempts.gateway_ref_no (UNIQUE)", twin: "substitute; Direct vs Pool indistinguishable at the bank boundary", fidelity: substitute}
