      # M6 (I3) FIX: this was secrets-kong, which secrets/materialize.py never
      # populated with auth_workflow_payouts -- workflow-sim therefore started
      # with an EMPTY callback password and every approve/reject callback into
      # payouts would have been 401'd. It was never noticed because
      # ARENA_WORKFLOW_HOST defaulted to the frozen dead address, so workflow-sim
      # was never actually wired to payouts. secrets-workflow carries the file.
      - secrets-workflow:/run/secrets:ro
    environment:
      STUB_PORT: "8092"
      WORKFLOW_INBOUND_USER: "workflow"
      WORKFLOW_INBOUND_PASS: "workflow"
      PS_API_URL: "http://payouts-api:9400"
      WORKFLOW_CALLBACK_USER: "rzp_live"
      WORKFLOW_CALLBACK_PASS_FILE: /run/secrets/auth_workflow_payouts
    <<: *runtime-security
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8092/_arena/health"]
      <<: *healthcheck-defaults

  workflow-engine:
    # M6 (I3): the DEFAULT Workflow/Cadence substitute for the arena, replacing
    # workflow-sim as the target of payouts' [workflow] host (.env.arena's
    # ARENA_WORKFLOW_HOST). Same wire contract as workflow-sim -- Twirp
    # WorkflowAPI/Create parks a pending workflow and returns a non-empty
    # 14-char id, terminal callbacks reuse payouts' own callback_details
    # verbatim, /_arena/{health,pending,decide} control plane -- but backed by
    # substitutes/workflow-engine, the durable maker/checker engine reconstructed
    # in M5 (reports/implementation/m5-source-map.md). It adds real orgs, actors,
    # roles, approval policies, distinct-approver counting, maker!=checker
    # separation, optimistic-concurrency, expiry and an append-only audit log,
    # all on restart-recoverable SQLite, so an APPROVER is a first-class identity
    # in the arena rather than an out-of-band control-plane poke.
    # See substitutes/workflow-engine/ARENA.md for provisioning + operation.
    build:
      # NOT the shared substitutes/Dockerfile: that copies only ${STUB_DIR}/*.py
      # and the engine is a package (wfengine/). See this Dockerfile's header.
      context: ./substitutes/workflow-engine
      dockerfile: Dockerfile
    image: rzp-arena/workflow-engine:${ARENA_TAG:-local}
    profiles: ["substitutes"]
    networks: [rzp-arena]
    volumes:
      - secrets-workflow:/run/secrets:ro
      - wfengine-data:/data
    environment:
      WFE_HOST: "0.0.0.0"
      WFE_PORT: "8093"
      WFE_DB: /data/wfe.db
      # admin plane (org/actor/policy provisioning + evidence). Token file only:
      # never inline, never in `docker inspect`.
      WFE_ADMIN_TOKEN_FILE: /run/secrets/wfe_admin_token
      # inbound Create Basic auth == payouts' rendered [workflow.auth]
      # (config/templates/base/payouts/arena.toml:308-310 -> workflow/workflow)
      WFE_SERVICE_USER: "workflow"
      WFE_SERVICE_PASS: "workflow"
      # terminal callbacks into the REAL payouts approve/reject routes; identity
      # == cred.Workflow (payouts [auth.workflow]: rzp_live + the generated
      # auth_workflow_payouts), identical to workflow-sim.
      PS_API_URL: "http://payouts-api:9400"
      WFE_CALLBACK_USER: "rzp_live"
      WFE_CALLBACK_PASS_FILE: /run/secrets/auth_workflow_payouts
      # payouts stores workflow_id in CHAR(14) columns -> ids must be 14 chars.
      WFE_WORKFLOW_ID_LEN: "14"
      # tenant boundary = the payouts merchant (workflow.owner_id), not the
      # Razorpay org id every merchant shares.
      WFE_TENANT_KEY: "owner_id"
      # first Create for an unknown merchant binds the documented default policy
      # (1 distinct approval, any actor holding `approver` in that org,
      # maker != checker, 24h expiry). Override per org via POST /admin/policies.
      WFE_AUTOPROVISION_POLICY: "1"
      WFE_DEFAULT_REQUIRED_APPROVALS: "1"
      WFE_DEFAULT_SEPARATION: "1"
      WFE_DEFAULT_EXPIRY_SECONDS: "86400"
    # read_only root FS + tmpfs /tmp + no-new-privileges, same as every other
    # substitute. /data is a named volume, so it stays writable for SQLite
    # (db + -wal + -shm) even with a read-only root filesystem.
    <<: *runtime-security
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8093/health"]
      <<: *healthcheck-defaults

  batch-sim:
    # M6 (I3) integrated from substitutes/batch-sim/compose-block.yml (lane I2).
    # M6 additive: HIGH-FIDELITY REPLACEMENT for razorpay/batch's payout batch
    # types (payout, payout_approval, payouts_*_bene_*_process). Serves a
    # Batch-compatible API and drives the REAL payouts-api bulk create
    # (POST /v1/payouts/bulk) and per-row approve/reject
    # (POST /v1/payouts/payouts_internal/{id}/{approve,reject}).
    # The monolith hop is collapsed: batch-sim emits the request the monolith
    # would have forwarded. See substitutes/batch-sim/CONTRACT.md.
    # Inert unless something calls it — nothing in the arena depends on it.
    build:
      context: ./substitutes
      # NOT the shared substitutes/Dockerfile: batch-sim is the first stateful
      # stub and needs /data pre-created as `stub` so its named volume is
      # writable by uid 10001. See substitutes/batch-sim/Dockerfile — it is the
      # shared file plus exactly one RUN line, and its header describes the
      # one-line change to substitutes/Dockerfile that would let this go back to
      # `dockerfile: Dockerfile`.
      dockerfile: batch-sim/Dockerfile
      args:
        STUB_DIR: batch-sim
        STUB_NAME: batch-sim
        STUB_PORT: "8094"
    image: rzp-arena/batch-sim:${ARENA_TAG:-local}
    profiles: ["substitutes"]
    networks: [rzp-arena]
    volumes:
      - secrets-kong:/run/secrets:ro
      - batch-sim-data:/data
    environment:
      STUB_PORT: "8094"
      BATCH_SIM_DATA_DIR: /data
      # M7: bulk CREATE goes Batch -> shared ingress (monolith payouts/bulk, Route::$proxy, app `batch`
      # + X-Entity-Id) -> real PS /v1/payouts/bulk. ARENA_BATCH_UPSTREAM=direct restores the M6
      # collapsed hop. Per-row approve/reject keep the collapsed hop (PS_DIRECT_URL): the monolith's
      # bulk_approve route is outside the selected ingress surface (M7_INTEGRATION_TOPOLOGY.md).
      PS_API_URL: "http://api-ingress:8080"
      PS_DIRECT_URL: "http://payouts-api:9400"
      BATCH_SIM_UPSTREAM_MODE: "${ARENA_BATCH_UPSTREAM:-monolith}"
      BATCH_APP_AUTH_PASS_FILE: /run/secrets/app_batch
      # cred.API on POST /v1/payouts/bulk
      # (payout_internal_routes_with_passport.go:16)
      PS_API_AUTH_USER: "api"
      PS_API_AUTH_PASS_FILE: /run/secrets/auth_api_payouts
      # X-Passport-JWT-V1 — same signer + claim shape as kong-lite
      PASSPORT_PRIVATE_KEY_FILE: /run/secrets/passport_private_key
      PASSPORT_IDENTIFIER: "arena-passport-1"
      PASSPORT_ISS: "https://identity.arena.invalid"
      # cred.Workflow on payouts_internal/{id}/approve — same pair as workflow-sim
      WORKFLOW_CALLBACK_USER: "rzp_live"
      WORKFLOW_CALLBACK_PASS_FILE: /run/secrets/auth_workflow_payouts
      # BATCH application.properties:201-202 (max-attempts 5, back-off 5000ms)
      BATCH_SIM_MAX_ATTEMPTS: "5"
      BATCH_SIM_BACKOFF_MS: "5000"
    <<: *runtime-security
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8094/_arena/health"]
      <<: *healthcheck-defaults

  cron-driver:
    image: python:3.12-alpine
    profiles: ["substitutes"]
    networks: [rzp-arena]
    entrypoint: ["python3", "/app/driver.py"]
    volumes:
      - ./scripts/cron-driver/driver.py:/app/driver.py:ro
    environment:
      PAYOUTS_BASE_URL: "http://payouts-api:9400"
      CRON_BASIC_AUTH_USER: "fast_cron"
    secrets: [auth_fastcron_payouts]
    read_only: true
    security_opt:
      - no-new-privileges:true
    # NO depends_on here on purpose: cron-driver is in `substitutes` (started
    # BEFORE `core` per scripts/up.sh's stated order), and payouts-api is in
    # `core` -- a depends_on across those two profiles makes
    # `docker compose --profile datastores --profile substitutes config -q`
    # fail with "depends on undefined service" whenever `core` isn't also
    # enabled in that same invocation. driver.py already tolerates this: it
    # retries every 5s forever and logs (not crashes on) connection errors,
    # so it self-heals once payouts-api becomes reachable. scripts/up.sh
    # still waits for payouts-api's healthcheck before declaring the arena
    # ready, via scripts/healthcheck.sh, not via this depends_on.

  # ======================================================================
  # verify profile
  # ======================================================================

  verifier:
    # NOTE: substance of verifier/ (pytest suite: helpers/{db,http_client,
    # passport,creds,wait,payouts_flow}.py, conftest.py, requirements.txt)
    # is owned by a parallel workstream (VERIFIER_SPEC.md, not authored in
    # this pass) building a fuller verifier than a single-file placeholder --
    # this compose entry only wires it in; do not add logic to verifier/
    # from this scaffold pass, only fix wiring (image/profile/network/mounts)
    # if it drifts from what verifier/ actually contains.
    build:
      context: ./verifier
      dockerfile: Dockerfile
    image: rzp-arena/verifier:${ARENA_TAG:-local}
    profiles: ["verify"]
    # verifier's helpers/db.py talks to datastores directly (pymysql/psycopg/
    # pymongo/redis per requirements.txt), not only through kong-lite --
    # unlike the original placeholder's ingress-only design, it therefore
    # needs rzp-arena too. rzp-ingress is kept so it can also reach kong-lite
    # as a real host-equivalent client for the HTTP-facing assertions.
    networks: [rzp-arena]
    environment:
      ARENA_ENTRYPOINT: "http://kong-lite:8080"
      PASSPORT_SIGNER_URL: "http://kong-lite:8080/_arena/mint"
      # verifier/conftest.py defaults assume production ports (kong 8000, fts nginx 80); arena ports:
      KONG_LITE_URL: "http://kong-lite:8080"
      PS_PUBLIC_URL: "http://payouts-api:9400"
      # the verifier treats a healthy Mozart substitute as the live bank path (waits for real processing); mozart-sim is primary
      MOZART_MOCK_URL: "http://mozart-sim:8085"
      FTS_WEB_URL: "http://fts-web:8080"
      # merchant fixtures = the seeds/s4 id scheme (SYNTHETIC_FIXTURE_SPEC.md); M1/M3 shared, M2 direct/RBL
      ARENA_M1_MERCHANT_ID: "ARENAM00000001"
      ARENA_M1_BALANCE_ID: "ARENABAL000001"
      ARENA_M1_FUND_ACCOUNT_ID: "ARENAFAX000001"   # API/monolith fund_account id (payouts fetches it from the monolith); payouts-local row is ARENAFA0000001
      ARENA_M1_ACCOUNT_NUMBER: "2323230099999999"
      ARENA_M2_MERCHANT_ID: "ARENAM00000002"
      ARENA_M2_BALANCE_ID: "ARENABAL000002"
      ARENA_M2_FUND_ACCOUNT_ID: "ARENAFAX000002"
      ARENA_M2_ACCOUNT_NUMBER: "2323230000000002"
      ARENA_M3_MERCHANT_ID: "ARENAM00000003"
      ARENA_M3_BALANCE_ID: "ARENABAL000003"
      ARENA_M3_FUND_ACCOUNT_ID: "ARENAFAX000003"
      ARENA_M3_ACCOUNT_NUMBER: "2323230099999999"
    volumes:
      - ./verifier:/verifier:ro
      - ./seeds/generated/scenario-index.json:/fixtures/scenario-index.json:ro
      - ./seeds/generated/provenance.json:/fixtures/provenance.json:ro
    # datastore passwords are per-arena generated secrets; verifier/run.sh exports them from /run/secrets
    secrets: [ledger, fts, monolith, ps-fastcron, ps-service, mysql_payouts_root_password, mysql_fts_root_password, mysql_xbalances_root_password, postgres_ledger_password, mongo_cfa_root_password]
    # NO depends_on here on purpose (same reasoning as cron-driver above):
    # kong-lite is in `substitutes`, verifier is in `verify` -- a
    # cross-profile depends_on breaks `config -q` whenever both profiles
    # aren't active in the same invocation (e.g. `--profile core --profile
    # verify` alone). scripts/golden-run.sh waits for kong-lite's
    # healthcheck via scripts/healthcheck.sh before running
    # `docker compose --profile verify run --rm verifier`.
