admin_repair_paths:
  ps_manual_action: POST /v1/payouts_internal/manual_action actions [processed_to_processing, approve_workflow_payouts, reject_workflow_payouts] only (adminClientController.go:267-356); no stuck-initiated repair
  monolith_admin: admin/payouts/cancel (bulkRejectFundAccountPayouts), payouts/manual_action (12 actions, 3 forwarded to PS), payouts/{id}/manual/status (PROCESSED/REVERSED/FAILED implemented; shared guard needs fts_fund_account_id+fts_account_type), manual/status_update/batch, payouts/{id}/retry (local only), admin/payouts/workflow_retry (WFS)
  source: api/app/Models/Payout/Service.php:1610,4626,5023,7423,1740; Core.php:6987-7013; Validator.php:177-190,1533-1570
  fts_repair: PATCH/POST /v1/attempts/:action, PUT /v1/attempts/reconcile (API+ART), body keyed by gateway_ref_no with mozart_meta{processed|failed|reversed}
  twin: MISSING (no admin, no ART caller)
