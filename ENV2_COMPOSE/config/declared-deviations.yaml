  - id: 'DEV-001'
    service: 'ledger-gate'
    location: 'ENV2_COMPOSE/substitutes/ledger-gate/server.py:forward_headers'
    twin_value: 'was a 5-name allow-list (authorization, content-type, ledger-tenant, x-request-id, x-task-id) dropping idempotency-key, Request-ID, Trace-ID, Country-Code, Ledger-Integration-Mode and Accept; now forwards every inbound header except hop-by-hop/transport (host, content-length, connection, transfer-encoding, keep-alive, te, trailer, trailers, upgrade, accept-encoding, proxy-*)'
    deployed_value: 'no proxy exists: payouts dials ledger-live directly, so ledger-sdk emits the full header set (IdempotencyKey = idempotency-key) and Ledger applies its request-idempotency interceptor on the payouts leg'
    deployed_source: 'ledger-sdk/common/constant.go:39-54; ledger-sdk/ledger/journal/core.go:105-107,120-124,249-251,255-259; ledger/pkg/idempotency/hooks.go:17; ledger/pkg/idempotency/interceptor.go:115-118'
    classification: 'behaviour_toggle'
    reason: 'The gate exists only to inject scoped transport faults on the payouts to ledger leg; the header allow-list was an unstated side effect of that scaffolding, not a fidelity decision.'
    could_conceal: 'Ledger request-idempotency on the payouts leg only, so every duplicate-journal result (I03, V04) measured one fewer defence than production while FTS and the monolith kept it. Also lost trace correlation across the boundary and left Ledger Country-Code context empty.'
    status: 'fixed_in_m1'
    fix_ref: 'ENV2_COMPOSE/substitutes/ledger-gate/server.py; ENV2_COMPOSE/substitutes/ledger-gate/CONTRACT.md; ENV2_COMPOSE/substitutes/ledger-gate/test_contract.py'

