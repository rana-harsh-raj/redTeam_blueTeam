    trigger_cron: POST /v1/cron/process_batch_submitted_payouts
    twin: not driven by cron-driver (MISSING)
  reservation_reconcile:
    trigger_cron: POST /v1/cron/process_inflight_reservation_reconciliation (every 5 min assumed; heartbeat TTL 12.5 min)
    twin: "REAL; cron-driver job reservation_reconcile posts the correct path every 300 s (scripts/cron-driver/driver.py:42; up.sh runs it once at boot) — heartbeat present so the gate admits (T04 §9). Release of awaiting holds by this path needs x-balances balance.last_fetched_at to advance, which never happens in the twin without a test bump (EF-007)"

