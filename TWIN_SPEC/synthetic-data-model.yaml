direct_statement_and_reconciliation_records:   # M4 T12 — T03 Findings 8, §6 S-B/S-C/S-D
  mozart_account_statement_response:
    route: "POST /razorpayx/rbl/v2/account_statement (mozart-sim)"
    request: "RblRequest{attempt{id=<unix-ts>, transaction_type:'B', from_date, to_date (02-01-2006) | next_key}, source_account{account_number, credentials{auth_username, auth_password, client_id, client_secret, corp_id}}}"
    response: "{FetchAccStmtRes:{Header:{Code, Corp_ID, Status:'Success'|'Failure', Status_Desc, TranID:<attempt.id>, account_no, from_date, to_date, next_key}, AccStmtData:{File_Data:<base64 CSV>}}}; success iff Status=='Success' || (Status=='Failure' && Status_Desc=='No Records Found')"
    provenance: "payouts processor/rbl_gateway.go:168-231,413-460; rbl_statement.go:9-32; mozart app/config/razorpayx/rbl/v2/account_statement.json"
  statement_csv_contract:
    header: "TRAN_ID,PTSN_NUM,TRAN_DATE,PSTD_DATE,TRAN_TYPE,C/D,TRAN_PARTICULAR,TRAN_AMT,TRAN_BALANCE (exact; 9 columns per row)"
    example_debit_row: "S12345678,1,07-09-2026,07-09-2026 10:15:00,TCI,D,<UTR>-IMPS/PAYOUT RZP<GRN10>,50.00,99950.00"
    rules:
      - "TRAN_ID non-empty -> bank_transaction_id varchar(255); PTSN_NUM numeric -> bank_serial_number"
      - "PSTD_DATE fmt 02-01-2006 15:04:05, TRAN_DATE fmt 02-01-2006 (IST); posted_date must be < now - 60 s or the row is skipped and next_key suppressed"
      - "TRAN_AMT rupees with decimals -> paise bigint unsigned; TRAN_BALANCE -> balance"
      - "C/D -> type credit|debit; TRAN_TYPE category map TCI->customer_initiated, TBI->bank_initiated, CNP->cash_withdrawal, CNR->cash_deposit, else others"
      - "UTR regex — debit: ^(RTGS/|NEFT/)(?P<utr>.*?)(/), ^(UPI/)(?P<utr>.*?)(/), ^(?P<utr>.*?)- (IMPS: everything before the first '-'); credit: ^(?P<utr>[0-9]{12})_IMPS and the RTGS/NEFT/UPI forms"
      - "GRN regex \\sRZP([0-9A-Z]{10})$ -> gateway_ref_number varchar(48)"
      - "dedupe tuple {account_number, posted_date, type, bank_serial_number, amount, bank_transaction_id, channel}; replaying the same CSV must add no rows"
      - "paging: attempt limit 5; 'has more' if >=5000 rows or to_date < today; pagination key '<last_posted_ts>_<bank next_key>'; 'No Records' with next_key advances statement_fetched_till_date by 4 weeks"
    provenance: "payouts processor/rbl_constants.go:6-61; rbl_gateway.go:355-411,517-662,664-703; T03 Finding 8"
  resulting_bas_row: "banking_account_statement{id char(14) auto (bas_<14>), merchant_id=<BASD.merchant_id>, entity_id NULL, entity_type NULL, channel 'rbl', account_number, bank_transaction_id, type debit|credit, utr, amount paise, currency 'INR', description, category, bank_serial_number, balance, balance_currency 'INR', transaction_date <unix midnight IST>, posted_date <unix>, gateway_ref_number, created_at, updated_at}"
  success_scenario: "payout pout_P processed with utr=U, amount=A, gateway_ref_no=G; statement row utr=U, amount=A, type='debit', account_number=<own>, channel='rbl', gateway_ref_number=G; source event {entity_id:P, entity_type:'payout', utr:U, event_id:<14>, status:'processed', mode, amount:A, balance_id:<balance_id>, gateway_ref_no:G, cms_ref_no:''} -> match -> payout_update -> payouts.transaction_id = <bas14>; journals da_payout_processed + da_payout_processed_recon iff the DA emitter gate is on (T03 §6 S-B/S-D)"
  return_credit_scenario: "second statement row type='credit', utr=U (or return UTR), amount=A -> link payout_reversal -> payout_update{entity_type:'payout_reversal'} -> PS creates reversal + reversed (T03 §6 S-C)"
  art_batch_body: "[{\"data\": base64({\"banking_account_statement_id\":\"<bas14>\",\"recon_status\":\"Reconciled\",\"entity_id\":\"x,y,<pout14>\",\"entity_type\":\"payout\"}), \"idempotent_id\":\"<any>\"}] to POST /v1/banking_account_statement/process/batch (cred.API|Workflow)"
  xas_shaped_records: "accounts{id14, status:'active', merchant_id, account_number, account_type:'direct', channel (casing per xas enum — unverified, T03 Q5), balance_id, statement_metadata} UNIQUE(account_number, channel); account_statements as PS BAS + fetched_at_nano; source_events per route-matrix R5 with UNIQUE(event_id, entity_type)"

# ============================================================================
cross_service_consistency_rules:
  - rule: "fts.source_accounts.bank_account_type in {NODAL,CURRENT,CORP_CARD} propagates via the FTS webhook's bank_account_type field, which Payouts Service LOWERCASES before writing into ledger's journal identifiers.fts_account_type -> ledger.account_details.entities.fund_account_type must match that LOWERCASED value exactly (nodal|current|corp_card), never the uppercase FTS-side spelling."
    provenance: "L07 (source_account.go:99-101,182; ledger_journal_create.go:217 lowercase)"
  - rule: "fts_fund_account_id equality is the join key across FOUR services for the same underlying nodal/current pool: payouts.banking_accounts.fts_fund_account_id (string) == fts.fund_accounts.id (int, cast to string) == x-balances.balance.fts_fund_account_id (string) == ledger.account_details.entities.fts_fund_account_id (jsonb array element, string). All four must agree bit-for-bit as strings even though the underlying types differ (CHAR(14) / INT / VARCHAR(255) / jsonb) across the four services. M4 sharpening (T05 §1.2): FTS matches transfers.preferred_source_account_id against source_accounts.fund_account_id, NOT source_accounts.id — seeds that set both to the same integer hide the distinction; PS must send the fund_accounts.id."
    provenance: "L07 identity map table; payouts.mysql.sql:18-20; s4/payouts.sql header; fts internal/account/service.go:5320"
  - rule: "banking_account_stmt_detail_id (basd_<14>) is the Direct-account join key between the PS banking_account_statement_details row and the ledger account_details.entities of every DA merchant sub-account; the value used in AccountAPI/CreateOnEvent must equal BASD.GetSignedID() of the row whose balance_id is the payout's balance_id (payouts bankingAccountStatementDetails/core.go:587-593), otherwise every DA journal is dropped as ErrAccountDiscoveryFailure."
    provenance: "T03 Finding 2, Finding 6 discovery; ledger internal/account_discovery/core.go:49-110"
  - rule: "ledger parent accounts are keyed strictly per fund_account_type, one Receivable/Payable pair each: MerchantBalance/VendorPayable/CommissionIncome/OutputGST (banking_account_id-keyed, per-merchant) vs FtsReceivable/FtsPayable-nodal and FtsReceivable/FtsPayable-current (fts_fund_account_id-keyed, shared across merchants routing through the same pool/current account, NOT per-merchant). Do not create a per-merchant FtsReceivable/Payable pair — that contradicts the pooled-account design."
    provenance: "L07 (account hierarchy table); s4/ledger.sql §1,§3"
  - rule: "DCS Workflows.enable_payout_workflow gates whether IsWorkflowApplicable even reaches the auth-type check; Workflows.skip_approval_workflow_for_api additionally means a workflow-enabled merchant's workflow ONLY fires for non-Private (dashboard/xperience/vendor-payments) auth, never for direct API-key calls. A merchant seeded with enable_payout_workflow=true but skip_approval_workflow_for_api also true (M3's actual seed) will silently skip workflow for API-authenticated payouts — this is intentional per baseHelper.go's guard order, not a seeding mistake."
    provenance: "L08 baseHelper.go:107-193"
  - rule: "splitz.experiment client_side_eval must be false / server-side Evaluate must be used in any faithful twin path — the real production convention is server-side; a payouts binary relying on FetchDecisionContext (client-side) will see an empty experiment list regardless of what is seeded in splitz.experiment_assignment (see that family's invariants). Twin scenarios that need a Splitz-gated payouts behavior must route through server-side Evaluate/EvaluateBulk, or fix FetchDecisionContext first."
    provenance: "L10 (Splitz client-side eval verdict: INCORRECT SUBSTITUTE)"
  - rule: "monolith payouts_details.beneficiary_bank_code must NEVER be added (by-design absence, DualWrite unset()); payouts-service's own payout_details.beneficiary_bank_code (out-of-band column) SHOULD be present. These are the SAME logical entity across a dual-write boundary with a deliberate, permanent column-set asymmetry — a twin's monolith-stub write path must apply the same unset(), not copy 1:1."
    provenance: "L05; payouts.mysql.sql:9-19; apidb-subset.mysql.sql:35-40"
  - rule: "reversals column rename on dual-write: payouts-service's reversals.fees (plural) -> monolith's reversals.fee (singular); payouts-service's reversals.payout_id -> monolith's reversals.entity_id (+ entity_type='payout', since monolith's reversals table has no payout_id column at all)."
    provenance: "L05 Reversal.php:12-15"
  - rule: "idempotency_keys UNIQUE(idempotency_key, merchant_id) is enforced IDENTICALLY in both payouts-service's own table and the monolith's copy — a twin testing cross-service idempotency replay must seed/observe the same composite key in both, not just one."
    provenance: "L05; payouts.mysql.sql:270; apidb-subset.mysql.sql:178"
  - rule: "FTS mode/channel ENUM includes WALLET_TRANSFER (code-required for AMAZON_PAY, absent from tracked migrations) and INDUSIND (migration-present, code-dead). A twin schema should include WALLET_TRANSFER (or AMAZON_PAY payouts will be rejected) but should NOT expect any code path to ever produce/consume INDUSIND."
    provenance: "L05, fts.mysql.sql:8-18, L06"
  - rule: "AmazonPay wallet fund accounts are the ONLY wallet provider CFA's ValidateWallet() accepts at create time — paytm/phonepe/gpay are declared enum values but will be REJECTED. Any wallet_amazonpay-style archetype must use provider=amazonpay."
    provenance: "cfa.mongo.json:62-66"
  - rule: "payouts.payouts and the monolith's apidb payouts table are THE SAME PRODUCTION TABLE (accessed via a second `payout_service_database` connection), not two independently-seeded copies. A twin must seed this table exactly ONCE in the payouts-service's own database and have the monolith-stub read/write it over its own connection, never maintain a separate ps_payouts-shaped mirror."
    provenance: "L01, L05; payouts.mysql.sql:9-33 header"

# ============================================================================
value_distributions:
  amount_boundaries_paise:
    global_min: 100                     # payoutCreate.go DTO min (all payout creates)
    global_max_default: 1000000000      # 10cr default cap
    global_max_increase_payout_limit: 5000000000   # 50cr, DCS FundTransfer.increase_per_payout_amount_limit=true
    global_max_absolute: 30000000000    # 300cr, highest documented tier
    RTGS_min: 200000                    # >=2L required
    IMPS_max: 500000                    # <=5L
    UPI_max: 100000                     # <=1L
    AMAZON_PAY_max: 10000                # <=10k (wallet)
    RBL_v1_IMPS_range: [1, 200000]       # env.default.toml RBL caps, 24x7
    RBL_v1_UPI_range: [1, 200000]
    RBL_v1_RTGS_range: [200000, 100000000]   # 08:00-17:30 window
    RBL_v1_NEFT_day_range: [1, 100000000]     # 02:00-18:00 window
    RBL_v1_NEFT_slot2_cap: 1500000000         # 18:00-02:00 window
    generation_rule: "each archetype's scenario set should include at least: one amount at global_min, one just below/at each mode-specific cap, one mid-range typical value (e.g. 10000-100000), and (for M6) one value requiring IncreasePayoutLimit"
    provenance: "L04 payoutCreate.go:11-39; L06 env.default.toml RBL v1 caps"
  status_coverage:
    payout_statuses_15: [created, initiated, ledger_response_awaited, processed, failed, reversed, pending, pending_on_otp(dead), scheduled, batch_submitted, queued, cancelled, on_hold, rejected, create_request_submitted]
    fts_transfer_statuses_7: [CREATED, INITIATED, PROCESSED, FAILED, REVERSED, RETRY, USER_PENDING]
    fts_attempt_statuses_7: [CREATED, INITIATED, PROCESSED, FAILED, REVERSED, RETRY, FAILED_INTERNAL]
    generation_rule: "each scenario family must exercise at least one state_machines.yaml transition; distribution across archetypes should ensure every guard (Shared vs Direct FtsToPayoutStatusMap divergence, workflow gate, reservation gate, low-balance queue) is hit at least once"
    provenance: "L04 appConstants/states.go:4-18; L06 state_machine.go:7-114"
  mozart_bank_status_code_coverage:
    modeled_in_twin: [SUCCESS, INSUFFICIENT_FUND, "PENDING (stateful, mozart-sim only)", "CBS:188 (ambiguous, with UTR)", DUPLICATE_TXN, RETURNED]
    real_total: "~140 codes (fts error_code.go:217-952, bank-agnostic defaultErrorCodes + per-bank transferErrorCodes overrides)"
    gap: "6 of ~140 real codes modeled — documented, deliberate twin scope-narrowing, not an oversight to silently accept as complete"
    provenance: "L06; s4/mozart_scenarios.json"
  fee_and_tax:
    flat_fee_paisa: 200      # Rs 2, IMPS/NEFT
    gst_rate_pct: 18
    tax_paisa: 36
    special_zero_cases: ["purpose=rzp_fees", "purpose=refund", "fee_type=free_payout"]
    provenance: "s4/pricing_fixtures.json (task-specified deliberate deviation from ccSdk mock's own default fee=500,tax=90)"
  channel_scope:
    modeled: [RBL]
    real_channels: [AXIS, CITI, HDFC, ICICI, RBL, YESBANK, M2P, AMAZON_PAY, INDUSIND, MCS, IDFC, OCBC, SLICE, JPMC_INTL_BANK_TRANSFER]
    provenance: "fts.mysql.sql channel ENUM; s4/fts.sql (RBL-only twin scope)"

# ============================================================================
never_seed:
  runtime_only_tables:
    - "payouts.payouts, payouts.payout_details, payouts.payout_status_details, payouts.reversals, payouts.payout_sources, payouts.payout_logs, payouts.payout_attempts, payouts.idempotency_keys, payouts.bulk_idempotency_keys, payouts.idempotency_key_exclusions, payouts.counter_transaction, payouts.payout_meta_temporary, payouts.payout_meta_permanent, payouts.workflow_entity_map — all populated by golden-flow traffic, not fixture data (per s4/payouts.sql header)"
    - "fts.transfers, fts.attempts, fts.attempts_unique_keys, fts.transfer_meta — created by /v1/transfer traffic, not pre-seeded"
    - "ledger.journal, ledger.ledger_entries — payout-driven rows are runtime-only; ONLY the opening-balance rows are seeded (and even those should prefer the AccountAPI.CreateOnEvent RPC path over raw INSERT)"
    - "monolith.payouts_details, monolith.reversals, monolith.idempotency_keys, monolith.workflow_entity_map, monolith.balance — runtime-only (dual-write targets)"
    - "in-flight reservation Redis keys (<prefix>:in_flight:{mid:balID}), channel_information_status writers beyond the seeded baseline, workflow_state_map runtime states — process-managed, not fixture data"
  ci_only_tables_do_not_exist_in_prod:
    - "ps_payouts, ps_payout_details, ps_payout_status_details, ps_reversals, ps_workflow_entity_map, ps_payout_sources, ps_idempotency_keys, ps_payout_logs, ps_payout_meta_temporary, ps_payout_meta_permanent, ps_bulk_idempotency_keys, ps_banking_accounts, ps_banking_account_statement(_details) — production doc-comment: 'This table doesn't exist on prod. It only exists on CI.' (2022_07_01_095954_create_ps_payouts.php:12-14). Do not model these at all in a production-faithful twin."
  dead_or_unconfirmed_tables:
    - "payouts.source_request_id_mapping — migration exists, zero code references anywhere in the repo; omit unless a consuming service/PR is later found"
    - "payouts.merchant_configurations, payouts.settings, payouts.duplicate_prevention_config, fts.merchant_configurations — no confirmed real key/value taxonomy found by any lane; leave unseeded rather than fabricate plausible-looking config keys"
  must_not_add_constraints_prod_lacks:
    - "ledger.journal UNIQUE(transactor_id, transactor_event) — production has NO such constraint (app-level check-then-insert race window only); adding it would make the twin MORE correct than production, defeating twin fidelity"
    - "cfa.contacts / cfa.fund_accounts / cfa.hash_lookup unique indexes on id/hash — production has NONE (confirmed by the migration that exists specifically to de-duplicate found dupes); do not add"
  mechanism_gaps_not_data_gaps:
    - "Workflows Service (WFS) is currently MISSING from the twin entirely — this is a substitute/mechanism task (build a contract-faithful WFS stub), not something fixable by seeding more rows into payouts.workflow_config/workflow_state_map"
    - "Splitz client-side eval (FetchDecisionContext) always returns empty for payouts — no amount of splitz.experiment_assignment seed data changes this until the mechanism is fixed"
