[configs]
    [configs.fetch_balance_from_x_balance]
        enabled_env = "env|PAYOUTS_CONFIGS_FETCH_BALANCE_FROM_X_BALANCE_ENABLED_ENV"
        whitelist_env = "env|PAYOUTS_CONFIGS_FETCH_BALANCE_FROM_X_BALANCE_WHITELIST_ENV"
        blacklist_env = "env|PAYOUTS_CONFIGS_FETCH_BALANCE_FROM_X_BALANCE_BLACKLIST_ENV"

    [configs.fetch_from_microservices]
        enabled_env = "env|PAYOUTS_CONFIGS_FETCH_FROM_MICROSERVICES_ENABLED_ENV"
        whitelist_env = "env|PAYOUTS_CONFIGS_FETCH_FROM_MICROSERVICES_WHITELIST_ENV"
        blacklist_env = "env|PAYOUTS_CONFIGS_FETCH_FROM_MICROSERVICES_BLACKLIST_ENV"

    [configs.fts_request_from_ps]
        whitelist_env = "env|PAYOUTS_CONFIGS_FTS_REQUEST_FROM_PS_WHITELIST_ENV"
        blacklist_env = "env|PAYOUTS_CONFIGS_FTS_REQUEST_FROM_PS_BLACKLIST_ENV"

    [configs.fetch_balance_from_x_balance_async]
        enabled_env = "env|PAYOUTS_CONFIGS_FETCH_BALANCE_FROM_X_BALANCE_ASYNC_ENABLED_ENV"
        whitelist_env = "env|PAYOUTS_CONFIGS_FETCH_BALANCE_FROM_X_BALANCE_ASYNC_WHITELIST_ENV"
        blacklist_env = "env|PAYOUTS_CONFIGS_FETCH_BALANCE_FROM_X_BALANCE_ASYNC_BLACKLIST_ENV"

    [configs.free_payouts_x_balances]
        # Hardcoded on (not env-indirected) for e2e: payouts' Splitz client only refreshes its
        # experiment cache every 5-11 minutes, so a merchant whitelisted via the Splitz API moments
        # before a test's payout call is often not yet visible, causing an intermittent fallback to
        # a separate, broken API-DB read path. This config-based toggle is checked before Splitz and
        # has no such propagation delay.
        #
        # whitelist_env/blacklist_env are intentionally empty (not "env|..." indirected) here:
        # this app has no "env|" resolution fallback-to-empty, so an indirected reference to an
        # unset env var stays as the literal "env|VAR_NAME" string. MerchantListConfig.GetWhitelist
        # then treats that non-empty literal as a one-entry whitelist, so no real merchant ID ever
        # matches it and IsEnabledByMerchantList always returns false — silently defeating the
        # enabled_env="true" override above and forcing every request through the broken Splitz/
        # API-DB fallback path.
        enabled_env = "true"
        whitelist_env = ""
        blacklist_env = ""

    [configs.fund_account_optimisation]
        enabled_env = "env|PAYOUTS_CONFIGS_FUND_ACCOUNT_OPTIMISATION_ENABLED_ENV"
        whitelist_env = "env|PAYOUTS_CONFIGS_FUND_ACCOUNT_OPTIMISATION_WHITELIST_ENV"
        blacklist_env = "env|PAYOUTS_CONFIGS_FUND_ACCOUNT_OPTIMISATION_BLACKLIST_ENV"

    [configs.account_statement_source_event]
        enabled_env = "env|PAYOUTS_CONFIGS_ACCOUNT_STATEMENT_SOURCE_EVENT_ENABLED_ENV"
        whitelist_env = "env|PAYOUTS_CONFIGS_ACCOUNT_STATEMENT_SOURCE_EVENT_WHITELIST_ENV"
        blacklist_env = "env|PAYOUTS_CONFIGS_ACCOUNT_STATEMENT_SOURCE_EVENT_BLACKLIST_ENV"


    [configs.fts_async_hv_processing_merchants]
        whitelist_env = "env|PAYOUTS_CONFIGS_FTS_ASYNC_HV_PROCESSING_MERCHANTS_WHITELIST_ENV"
