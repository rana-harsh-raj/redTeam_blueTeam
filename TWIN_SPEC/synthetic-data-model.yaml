version: 2
# updated 2026-09-07 (M4 T12): M2 identity corrections (T07-C1), fts.source_accounts casing (C-005), routing-rule requirement (C-003),
# x-balances enum/status (C-007/C-008), monolith.banking_accounts.account_type (T02 #11), new section direct_merchant_record_set
# (fresh Direct merchant record set, BASD row, statement CSV contract, DA ledger accounts) from T07 §12, T02/T03/T04/T05 handoffs.
# ============================================================================
# Synthetic Data Model — RazorpayX Payouts Twin (Env 2/4 arena)
# Synthesized from reports/fidelity/raw/{00..12}_*.md (fidelity-investigation lanes, 2026-09-05),
# TWIN_SPEC/schema/*.sql|*.json (migration-derived DDL), ENV2_COMPOSE/seeds/{s4,monolith,dcs,splitz}/*
# (existing twin seed shape reference), and reports/SYNTHETIC_FIXTURE_SPEC.md (prior spec, gap-fill only).
#
# Provenance key: every leaf field carries `exactness` (EXACT: migration/proto/DTO-confirmed field
# name+type; REPRESENTATIVE: table/endpoint identity confirmed but full column list not independently
# re-verified, or value is a deliberate documented simplification; ASSUMED: no source found, reason given)
# and a `provenance` citation (repo/path:line, or the lane report that established the fact).
#
# Conflicts between lanes are called out inline as `conflict:` keys and resolved in favor of
# migration/model evidence per the task's instruction; the losing claim is kept for traceability.
# ============================================================================

merchant_archetypes:

  # --- Existing 3 (ARENAM00000001-3), already seeded in ENV2_COMPOSE/seeds/s4 — reference only ---
  shared_pool_api:
    id_pattern: "ARENAM00000001 (M1)"
    purpose: >
      Baseline Shared/Lite merchant, ledger-authoritative balance, API-key auth, no workflow,
      routed through the shared RBL nodal pool. Exercises the default create->created->initiated
      ->processed happy path and Shared FtsToPayoutStatusMap (FAILED->reversed default).
    identity_map:
      monolith_merchant: {id: ARENAM00000001, live: true, activated: true, features: [payout_service_enabled, banking]}
      payouts.banking_accounts: {id: ARENABA0000001, account_type: shared, channel: null, fts_fund_account_id: "900001", balance_id: ARENABAL000001}
      x-balances.balance: {id: ARENABAL000001, account_type: pool, channel: null}
      fts.source_accounts: {id: 900001, bank_account_type: NODAL, account_type: POOL, channel: RBL}
      ledger.accounts: {MerchantBalance: ARENAM1ACC0001 (opening 10000000 paise), VendorPayable: ARENAM1ACC0002, CommissionIncome: ARENAM1ACC0003, OutputGST: ARENAM1ACC0004}
      ledger.account_details.entities: {banking_account_id: ARENABA0000001, fund_account_type: [merchant_va|merchant_va_vendor|va_gst]}
      cfa.fund_accounts: {id: ARENAFAX000001, account_type: bank_account, contact_id: linked}
      dcs.merchant_config: {Workflows.enable_payout_workflow: false, FundTransfer.enable_payouts: true, direct_accounts/Configs.in_flight_reservation_enabled: false}
      splitz.variant: "merchant_config_via_asv_and_dcs_experiment=on; payout_workflows_dcs_name_experiment=on; others per splitz/experiments.json"
      stork.subscriptions: "all payout.* + transaction.created events subscribed"
      keys.merchant_users_roles: "single primary user, role=owner (no workflow gate)"
    unlocks: [direct create happy-path, shared FTA/webhook status remap, idempotency replay, free-payout counter]

  direct_rbl_current:
    id_pattern: "ARENAM00000002 (M2)"
    purpose: >
      Direct/current-account merchant on RBL, x-balances-authoritative (not ledger per-merchant
      accounts), in_flight_reservation_enabled ON, DIRECT FtsToPayoutStatusMap (FAILED->failed,
      not reversed). Exercises reservation Redis gate and the Direct-vs-Shared ledger skip.
    identity_map:
      monolith_merchant: {id: ARENAM00000002, features: [payout_service_enabled, banking, in_flight_reservation_enabled], note: "generator seeds/generator/generate.py:296-297 appends in_flight_reservation_enabled (T07-C1; earlier spec listed only two)"}
      payouts.banking_accounts: {id: ARENABA0000002, account_type: direct, channel: rbl, fts_fund_account_id: "900002", balance_id: ARENABAL000002}
      x-balances.balance: {id: ARENABAL000002, account_type: direct, channel: rbl, status: "activated (seed) — code expects active (C-008 OPEN)", balance: 10000000, fts_fund_account_id: "900002"}
      fts.source_accounts: {id: 900002, bank_account_type: CURRENT, account_type: "DIRECT (seed, uppercase) — code constant is lowercase 'direct' (C-005 OPEN)", channel: RBL, mozart_identifier: v1}
      fts.direct_account_routing_rules: {merchant_id: ARENAM00000002, channel: RBL, mode: [IMPS,NEFT], source_account_id: 900002, note: "never read with a single source account (C-003)"}
      payouts.banking_account_statement_details: "NONE in the M2 fixture; Direct create passes because x-balances status is read via Splitz Rjdj0sAd4paXMG=on (T04 §2). M4 fresh Direct merchants get a BASD row (see direct_merchant_record_set)"
      ledger.accounts: "NO MerchantBalance/VendorPayable/CommissionIncome/OutputGST rows for M2 (Direct skips per-merchant ledger accounts; x-balances is authoritative). Only the shared FtsReceivable/FtsPayable-current pair (ARENAM2NODAC01/02, fts_fund_account_id=900002, fund_account_type=current) exists, keyed by fts_fund_account_id not merchant_id."
      cfa.fund_accounts: {id: ARENAFAX000002, account_type: bank_account}
      dcs.merchant_config: {direct_accounts/Configs.in_flight_reservation_enabled: true, FundTransfer.enable_payouts_queue_buffer: true, queue_payout_bal_buffer: 50000, Cfa.skip_ifsc_lookup: true}
      splitz.variant: "same 8-id table as M1 unless a scenario needs divergence"
    unlocks: [reservation-gate queueing, Direct FTA status-map divergence, x-balances-as-source-of-truth balance reads, partner-bank-down on-hold]

  shared_workflow_dashboard:
    id_pattern: "ARENAM00000003 (M3)"
    purpose: >
      Shared merchant with dashboard OTP + 2-level approval workflow (finance_l1/finance_l2/owner),
      block_va_payouts=true, skip_approval_workflow_for_api=true (workflow only reachable via
      non-Private/dashboard auth). Exercises WorkflowAPI/ActionAPI create+callback and dashboard OTP.
    identity_map:
      monolith_merchant: {id: ARENAM00000003, features: [payout_service_enabled, banking, enable_approval_via_oauth (dcs off by default)]}
      payouts.banking_accounts: {id: ARENABA0000003, account_type: shared, fts_fund_account_id: "900001", balance_id: ARENABAL000003}
      x-balances.balance: {id: ARENABAL000003, account_type: pool}
      ledger.accounts: {MerchantBalance: ARENAM3ACC0001 (opening 10000000), VendorPayable: ARENAM3ACC0002, CommissionIncome: ARENAM3ACC0003, OutputGST: ARENAM3ACC0004}
      cfa.fund_accounts: {id: ARENAFAX000003, account_type: vpa}
      payouts.workflow_config: {id: ARENAWC0000001, config_type: payout_workflow, enabled: true}
      payouts.workflow_state_map: {finance_l1: ARENAWST000001, finance_l2: ARENAWST000002, owner: ARENAWST000003}
      dcs.merchant_config: {Workflows.enable_payout_workflow: true, Workflows.skip_approval_workflow_for_api: true, Workflows.skip_workflow_for_payroll: true, FundTransfer.block_va_payouts: true}
      keys.merchant_users_roles: "3 dashboard users: finance_l1, finance_l2, owner (per merchant_users role column); OTP required for create_payout/approve_payout unless OAuth-partner path"
    unlocks: [workflow create/approve/reject via WFS ActionAPI, dashboard OTP flow, bulk_approve batch path, self-approval guard test]

  # --- 6 new archetypes proposed to close scenario gaps the existing 3 don't cover ---
  partner_sub_merchant:
    id_pattern: "ARENAM00000004 (M4)"
    purpose: >
      Sub-merchant transacting on a Direct master's (M2's) nodal/current pool — exercises
      shouldFetchSourceFtsFundAccountId's SHARED && (subMerchantOnDirectMaster || subAccountPayout)
      branch (fetch source fts_fund_account_id, IS DIRECT-flavoured) and x-balances sub_balances
      decomposition (master_balance_id/sub_balance_id), which no existing archetype exercises.
    identity_map:
      monolith_merchant: "id=ARENAM00000004, features=[payout_service_enabled, banking]; parent_relationship: sub-merchant of ARENAM00000002 (INFERRED: monolith-side partner/sub-merchant linkage table not traced by any lane — see cross_service_consistency_rules)"
      payouts.banking_accounts: "id=ARENABA0000004, account_type=shared, fts_fund_account_id=900002 (shares M2's dedicated current pool, not the RBL shared pool), balance_id=ARENABAL000004"
      x-balances.balance: "id=ARENABAL000004, account_type=sub_balance"
      x-balances.sub_balances: "out-of-band, queries.sql only: id=subbal_ARENA0001, master_balance_id=ARENABAL000002, sub_balance_id=ARENABAL000004, sub_account_number=<distinct, per-sub-merchant virtual account number>"
      fts.source_accounts: "reuses M2's 900002 (CURRENT/DIRECT) — no new source_account row"
      cfa.fund_accounts: "id=ARENAFAX000005, account_type=bank_account"
    unlocks: ["sub-merchant routing (shouldFetchSourceFtsFundAccountId SHARED+subMerchant branch)", "x-balances sub_balances/sub_balance_limits decomposition path"]
    provenance: "L01 (FundTransfer.php:2053-2073 shouldFetchSourceFtsFundAccountId); L05/x-balances.mysql.sql (sub_balances out-of-band DDL); L07 (x-balances sub_balance overwritten-from-ledger enrichment only for Shared/sub_balance)"
    exactness: "ASSUMED — identity map is this synthesis's construction; no lane traced a live partner/sub-merchant example end-to-end. Cite the mechanism evidence above; the specific id layout is new."

  scheduled_queue_low_balance:
    id_pattern: "ARENAM00000005 (M5)"
    purpose: >
      Shared merchant seeded with an intentionally low MerchantBalance opening balance (100 paise)
      to trigger queued_reason=low_balance via the reservation/balance-buffer gate, and used for
      scheduled_at slot testing ({9,13,17,21} IST) plus the 3-month auto-cancel sweep
      (PENDING->rejected, QUEUED/CREATE_REQUEST_SUBMITTED->failed).
    identity_map:
      monolith_merchant: {id: ARENAM00000005, features: [payout_service_enabled, banking]}
      payouts.banking_accounts: {id: ARENABA0000005, account_type: shared, fts_fund_account_id: "900001", balance_id: ARENABAL000005}
      ledger.accounts: "MerchantBalance=ARENAM5ACC0001 (opening 100 paise, deliberately below any tested payout amount); VendorPayable/CommissionIncome/OutputGST=ARENAM5ACC0002-4"
      x-balances.balance: {id: ARENABAL000005, account_type: pool, balance: 100}
      cfa.fund_accounts: {id: ARENAFAX000006, account_type: bank_account}
      dcs.merchant_config: {FundTransfer.enable_payouts_queue_buffer: true, queue_payout_bal_buffer: 0}
    unlocks: [queueingstrategy balanceBufferGate low-balance path, cron process_queued_low_balance_payouts, schedule.go slot selection, 3-month auto-expiry]
    provenance: "L04 (queueingstrategy/strategy.go; schedule.go:23,55 slots; core.go:4482-4525 auto-expiry); L02 (Service.php:2530-2557 monolith auto-cancel)"
    exactness: REPRESENTATIVE — mechanism confirmed; opening-balance value (100 paise) is this synthesis's deliberate scenario choice, not a prod-observed value.

  high_value_neft_rtgs:
    id_pattern: "ARENAM00000006 (M6)"
    purpose: >
      Direct RBL-current merchant with increase_per_payout_amount_limit=true (DCS FundTransfer),
      used to exercise RTGS (>=200000 paise, 08:00-17:30 window) and NEFT (1..1e8 paise day slot,
      1.5e9 slot2 cap) boundary amounts and the 10cr/50cr/300cr payout-limit tiers.
    identity_map:
      monolith_merchant: {id: ARENAM00000006, features: [payout_service_enabled, banking, IncreasePayoutLimit]}
      payouts.banking_accounts: {id: ARENABA0000006, account_type: direct, channel: rbl, fts_fund_account_id: "900006", balance_id: ARENABAL000006}
      x-balances.balance: {id: ARENABAL000006, account_type: direct, channel: rbl, balance: 100000000000}
      x-balances.balance._note: "balance = Rs 10,00,00,000 — large enough to fund a 50cr-tier test payout"
      fts.source_accounts: {id: 900006, bank_account_type: CURRENT, account_type: DIRECT, channel: RBL}
      dcs.merchant_config: {FundTransfer.increase_per_payout_amount_limit: true}
    unlocks: [RTGS/NEFT amount-slab validation, IncreasePayoutLimit 50cr/300cr tier, NEFT working-window + slot2 cap]
    provenance: "L06 (env.default.toml RBL v1 caps: RTGS 200000..1e8 08:00-17:30, NEFT 1..1e8 + slot2 1.5e9); L04 (payoutCreate.go limits: min 100, max 10cr/50cr/300cr, RTGS>=2L)"
    exactness: EXACT (boundary values); ASSUMED (this archetype's specific merchant construction/balance sizing)

  vpa_upi_beneficiary:
    id_pattern: "ARENAM00000007 (M7)"
    purpose: >
      Shared merchant whose fund account is a UPI VPA, used for the UPI <=100000-paise cap and
      the allowed_upi_channels DCS field (icici/axis/yesbank gating which channel serves UPI mode).
    identity_map:
      monolith_merchant: {id: ARENAM00000007, features: [payout_service_enabled, banking]}
      payouts.banking_accounts: {id: ARENABA0000007, account_type: shared, fts_fund_account_id: "900001", balance_id: ARENABAL000007}
      cfa.fund_accounts: {id: ARENAFAX000007, account_type: vpa, vpa: {handle: "arenabank", username: "arenamerchant007"}}
      payouts.fund_accounts (thin pointer): {account_type: vpa, account_id: ARENAFAX000007}
      dcs.merchant_config: {direct_accounts/PayoutModeConfig.allowed_upi_channels: [icici, axis]}
    unlocks: [UPI mode amount cap (<=100000 paise), VPA account_type discriminated-union validation, PayoutModeConfig channel gating]
    provenance: "L04 (payoutCreate.go UPI<=1L); schema/cfa.mongo.json (fund_accounts.vpa sub-document); L04 (DCS direct_accounts/PayoutModeConfig.allowed_upi_channels)"
    exactness: EXACT (cap value, VPA field shape); ASSUMED (this merchant's specific vpa handle/username, clearly synthetic)

  wallet_amazonpay:
    id_pattern: "ARENAM00000008 (M8)"
    purpose: >
      Merchant paying out to an AmazonPay wallet fund account — the ONLY wallet provider CFA's
      ValidateWallet() actually accepts at create time (paytm/phonepe/gpay are declared but
      rejected) — exercising the AMAZON_PAY preferred_channel remap and the <=10000-paisa cap.
    identity_map:
      monolith_merchant: {id: ARENAM00000008, features: [payout_service_enabled, banking]}
      payouts.banking_accounts: {id: ARENABA0000008, account_type: shared, fts_fund_account_id: "900001", balance_id: ARENABAL000008}
      cfa.fund_accounts: {id: ARENAFAX000008, account_type: wallet_account, wallet: {provider: amazonpay, phone: "ARENAPHONE01"}}
      fts.transfers/attempts: "preferred_channel=AMAZON_PAY, mode=WALLET_TRANSFER (enum-drift value, see never_seed/cross-service notes)"
    unlocks: [wallet fund-account validation (amazonpay-only gap), AMAZON_PAY channel remap (YESBANK->ICICI substitution N/A here), AmazonPay <=10000 paisa cap]
    provenance: "L05/schema/cfa.mongo.json (wallet provider_enum_enforced: [amazonpay] only); L01 (FundTransfer.php:424-551 preferred_channel AMAZONPAY->amazon_pay_fts); L06 (env.default.toml amazon_pay wallet 1..10000)"
    exactness: EXACT (provider gap, cap, enum-drift mode value); ASSUMED (phone number, clearly synthetic placeholder)

  test_mode_merchant:
    id_pattern: "ARENAM00000009 (M9)"
    purpose: >
      Test-mode (rzp_test_*) merchant used to exercise disallow_traffic_for_test_transactions
      (DCS dual-named skip_test_txn_for_dmt/disallow_traffic_for_test_transactions) and to confirm
      test-mode static FTS/payout credentials are distinct from live-mode ones.
    identity_map:
      monolith_merchant: {id: ARENAM00000009, live: false, mode: test, features: [payout_service_enabled]}
      keys: {id: "ARENAKEY0000009", key_string: "rzp_test_ARENAM0009xx", merchant_id: ARENAM00000009}
      payouts.banking_accounts: {id: ARENABA0000009, account_type: shared, fts_fund_account_id: "900001", balance_id: ARENABAL000009}
      dcs.merchant_config: {ApiInterface.disallow_traffic_for_test_transactions: true}
    unlocks: [test-mode auth path (rzp_test_ key resolution), DMT test-transaction block, test-vs-live static-credential separation]
    provenance: "L04 (DCS dual-naming table: skip_test_txn_for_dmt/disallow_traffic_for_test_transactions); L03 (keys.merchant_id via Key/Entity.php:261-282; key format rzp_<mode>_<14 random base62>)"
    exactness: EXACT (feature name, key format); ASSUMED (this merchant's specific test-mode wiring — no lane traced a live test-mode payout end-to-end)

# ============================================================================
record_families:

  # -------------------------------------------------------------------------
  # PAYOUTS SERVICE — payouts/internal/database/migrations/*.go
  # -------------------------------------------------------------------------
  payouts.payouts:
    source_evidence: ["TWIN_SPEC/schema/payouts.mysql.sql:26-71 (20200615182810_create_payouts_table.go + 20260305000000, 20260720000001 ALTERs)", "L05 CRITICAL FACT: this IS the same logical table the API monolith's own `payouts` table represents via a second (payout_service_database) connection — NOT a separate ps_payouts shadow (that is CI-only, api/database/migrations/2022_07_01_095954_create_ps_payouts.php:12-14)"]
    fields:
      - {name: id, type: CHAR(14), nullable: false, constraints: PRIMARY KEY, generation_rule: "uniqueid.New()-style 14-char base62, ARENA-prefixed synthetic", exactness: EXACT, provenance: "payouts.mysql.sql:27"}
      - {name: merchant_id, type: CHAR(14), nullable: false, fk: merchants.id, generation_rule: "one of the 9 archetype merchant ids", exactness: EXACT, provenance: "payouts.mysql.sql:30"}
      - {name: balance_id, type: CHAR(14), nullable: true, fk: "x-balances.balance.id (via banking_accounts.balance_id)", exactness: EXACT, provenance: "payouts.mysql.sql:31"}
      - {name: method, type: VARCHAR(255), nullable: false, allowed_values: "bank_account|card (payout methods; card mode referenced L02 Service.php card mode branch)", exactness: REPRESENTATIVE, provenance: "payouts.mysql.sql:32; L02"}
      - {name: mode, type: VARCHAR(255), nullable: true, allowed_values: "IMPS|NEFT|RTGS|UPI|WALLET_TRANSFER (enum-drift, see cross_service_consistency_rules)", distribution_matters: true, generation_rule: "vary per scenario family to exercise per-mode caps/routing", exactness: EXACT, provenance: "payouts.mysql.sql:33; L06 fts.mysql.sql mode ENUM"}
      - {name: fund_account_id, type: CHAR(14), nullable: true, fk: "payouts.fund_accounts.id (thin pointer) -> cfa fund_accounts.id", exactness: EXACT, provenance: "payouts.mysql.sql:34"}
      - {name: batch_id, type: CHAR(14), nullable: true, generation_rule: "set only for batch-created payouts (payout.json bulk); CustomIdGenerator 14-char", exactness: EXACT, provenance: "payouts.mysql.sql:35; L08 (batch bulkSize 5, idempotency batch_+id)"}
      - {name: idempotency_key, type: VARCHAR(255), nullable: true, generation_rule: "caller-supplied X-Payout-Idempotency header value, mirrored here", exactness: EXACT, provenance: "payouts.mysql.sql:36"}
      - {name: user_id, type: CHAR(14), nullable: true, generation_rule: "set for dashboard/user-initiated payouts (M3); null for API-key-only merchants", exactness: EXACT, provenance: "payouts.mysql.sql:37"}
      - {name: purpose, type: VARCHAR(255), nullable: false, constraints: "max30 (DTO)", allowed_values: "refund|cashback|vendor_bill|utility bill|salary|rzp_fees|refund (special no-Shield/no-fee purposes)", exactness: EXACT, provenance: "payouts.mysql.sql:38; payouts s4 payout_purpose seed; L04 payoutCreate.go:11-39 purpose required max30; s4/shield_fixtures.json purpose_rzp_fees/refund special-case"}
      - {name: amount, type: BIGINT UNSIGNED, nullable: false, constraints: "min 100 paise; max 10cr default / 50cr IncreasePayoutLimit / 300cr", distribution_matters: true, generation_rule: "see value_distributions.amount_boundaries", exactness: EXACT, provenance: "payouts.mysql.sql:40; L04 payoutCreate.go:11-39"}
      - {name: currency, type: VARCHAR(10), nullable: false, allowed_values: "INR|MYR|USD|EUR|GBP|SGD|AED", generation_rule: "INR for all 9 archetypes (payouts is an India-first product); other currencies ASSUMED unused unless a specific cross-border scenario is added", exactness: EXACT, provenance: "payouts.mysql.sql:41; L04 payoutCreate.go currency oneof"}
      - {name: fees, type: INT UNSIGNED, nullable: true, default: 0, generation_rule: "derive from pricing.plans rule (flat 200 paisa + 36 tax for IMPS/NEFT per s4/pricing_fixtures.json), 0 for purpose=rzp_fees/refund", exactness: EXACT, provenance: "payouts.mysql.sql:43; s4/pricing_fixtures.json special_case_overrides"}
      - {name: tax, type: INT UNSIGNED, nullable: true, default: 0, exactness: EXACT, provenance: "payouts.mysql.sql:44"}
      - {name: status, type: VARCHAR(255), nullable: false, allowed_values: "created|initiated|failed|processed|reversed|pending|scheduled|batch_submitted|queued|cancelled|on_hold|rejected|create_request_submitted|ledger_response_awaited|pending_on_otp(dead)", distribution_matters: true, state_rules: "see state-machines.yaml (FSM already extracted); each scenario family must cover at least one transition", exactness: EXACT, provenance: "payouts.mysql.sql:45; L04 appConstants/states.go:4-18, state_machine.go"}
      - {name: fts_transfer_id, type: BIGINT, nullable: true, note: "widened int->bigint by 20260720000001, irreversible", fk: "fts.transfers.id", exactness: EXACT, provenance: "payouts.mysql.sql:46"}
      - {name: channel, type: VARCHAR(255), nullable: true, allowed_values: "RBL|AXIS|ICICI|YESBANK|IDFC|AMAZON_PAY (twin scope: RBL only, per L06 seed comment)", exactness: EXACT, provenance: "payouts.mysql.sql:48; L06"}
      - {name: utr, type: VARCHAR(255), nullable: true, generation_rule: "populate on processed/reversed only, from mozart_scenarios.json gateway_ref_no/utr", exactness: EXACT, provenance: "payouts.mysql.sql:49"}
      - {name: failure_reason, type: VARCHAR(255), nullable: true, exactness: EXACT, provenance: "payouts.mysql.sql:50"}
      - {name: gateway_ref_no, type: "VARCHAR(255) utf8mb4_bin", nullable: true, constraints: "UNIQUE KEY idx_gateway_ref_no", exactness: EXACT, provenance: "payouts.mysql.sql:67-68 (20260305000000)"}
      - {name: created_at/updated_at, type: INT, nullable: false, generation_rule: "unix epoch, runtime-set", exactness: EXACT, provenance: "payouts.mysql.sql:54-55"}
      - {name: destination_id/destination_type/initiated_at, type: "n/a", note: "Go struct fields with gorm:\"-\" — explicitly NOT persisted; do NOT add these columns", exactness: EXACT, provenance: "payouts.mysql.sql:69-70"}
    invariants:
      - "No DB-level CHECK/ENUM on status (VARCHAR only) — application FSM is the sole guard (L04 state_machine.go)"
      - "UNIQUE(gateway_ref_no) added 20260305000000 — twin must not insert two rows with the same non-null gateway_ref_no"
      - "This table is shared across the payouts-service AND the monolith's payout_service_database connection — seed ONCE, not twice (do not also populate a ps_payouts CI-only table)"
    seed_policy: "runtime-only (per s4/payouts.sql header: 'Not seeded here — populated at runtime by golden-flow traffic')"

  payouts.payout_details:
    source_evidence: ["TWIN_SPEC/schema/payouts.mysql.sql:167-177 (20210902153752_create_payout_details_table.go)"]
    fields:
      - {name: id, type: CHAR(14), constraints: PRIMARY KEY, exactness: EXACT, provenance: "payouts.mysql.sql:168"}
      - {name: payout_id, type: CHAR(14), fk: payouts.payouts.id, exactness: EXACT, provenance: "payouts.mysql.sql:169"}
      - {name: queue_if_low_balance_flag, type: TINYINT, default: 0, exactness: EXACT, provenance: "payouts.mysql.sql:170"}
      - {name: tds_category_id, type: INT UNSIGNED, nullable: true, exactness: EXACT, provenance: "payouts.mysql.sql:171"}
