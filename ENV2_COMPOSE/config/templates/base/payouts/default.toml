[app]
    appEnv                = "default"
    serviceName           = "payouts"
    hostname              = "payouts.razorpay.com"
    port                  = ":9400"
    metricPort            = ":8001"
    shutdownTimeout       = 60
    shutdownDelay         = 10
    gitCommitHash         = "nil"
    debug                 = false

[db]
    [db.master]
        dialect               = "mysql"
        protocol              = "tcp"
        url                   = "127.0.0.1"
        port                  = "3306"
        username              = "payouts"
        password              = "payouts"
        sslMode               = "require"
        name                  = "payouts"
        maxOpenConnections    = 50
        maxIdleConnections    = 50
        connectionMaxLifetime = 0
    [db.replica]
        dialect               = "mysql"
        protocol              = "tcp"
        url                   = "127.0.0.1"
        port                  = "3306"
        username              = "payouts"
        password              = "payouts"
        sslMode               = "require"
        name                  = "payouts"
        maxOpenConnections    = 50
        maxIdleConnections    = 50
        connectionMaxLifetime = 0
    [db.api]
        dialect               = "mysql"
        protocol              = "tcp"
        url                   = "env|PAYOUTS_DB_API_URL"
        port                  = "3306"
        name                  = "env|PAYOUTS_DB_API_NAME"
        username              = "env|PAYOUTS_DB_API_USERNAME"
        password              = "env|PAYOUTS_DB_API_PASSWORD"
        sslMode               = "require"
        maxOpenConnections    = 5
        maxIdleConnections    = 2
        connectionMaxLifetime = 60
        debug                 = true

[tracing]
    ServiceName         = "payouts"
	Enabled             = false
	LogSpans            = false
	Host                = "localhost"
	Port                = "6831"
	MaxTagLengthValue   = "1024"
    [tracing.RequestHeaderExclusions]
        "Authorization"     = true
        "x-passport-jwt-v1" = true
        "x-pay-token"       = true
        "x-xsrf-token"      = true
    [[tracing.RouteURLsToExclude]]
        "/status"       = true
    [[tracing.RouteURLsToExclude]]
        "/commit.txt"   = true

[cache]
    driver                = "redis"
    [cache.redis]
        host            = "localhost"
        port            = 6379
        password        = ""
        database        = 0
        # Connection pool settings
        PoolSize      = 10
        MinIdleConns  = 2
        MaxConnAge    = 300
        IdleTimeout   = 200

[redis]
    host              = "localhost"
    port              = 6379
    password          = ""
    database          = 0
    dialect           = "redis"
    # Connection pool settings
    PoolSize          = 10
    MinIdleConns      = 2
    MaxConnAge        = 300
    IdleTimeout       = 0

