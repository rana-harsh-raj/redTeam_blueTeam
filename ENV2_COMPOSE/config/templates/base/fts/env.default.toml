#We add channel specific gateway error code segregation here.
#This helps us take a decision based on combined gateway_error_codes of transfer as well as status response.
#Cuttoff time indicates the time after which final_status will be updated if gateway_error_code matches.
# If there is already an bank_status_code config defined above and if in the following gateway_error config, a gateway_error_code
#  comes under the bank_status_code umbrella, following config will take preference overriding the bank_status_code config.
[gateway_error_handling]
    [gateway_error_handling.channel.rbl.status.ER021.transfer.500]
        cut_off_time = 12600
        final_status = 'FAILED'

    [gateway_error_handling.channel.rbl.status.ER021.transfer.401]
        cut_off_time = 12600
        final_status = 'FAILED'

    # CBS:188 - If the status check error code is CBS:188 and UTR is null, mark as FAILED
    # after cut_off_time, irrespective of the transfer init error code.
    # UTR-present case is handled in code (isCBS188WithUTR guard)
    [gateway_error_handling.channel.idfc.status."CBS:188"]
        cut_off_time = 8100
        final_status = 'FAILED'

    # CBS:188 Record not found - If UTR is null in init and 3 status checks, mark as FAILED
    # UTR-present case is handled in code (isCBS188WithUTR guard)
    [gateway_error_handling.channel.idfc.status."CBS:188".transfer."CBS:188"]
        cut_off_time = 8100
        final_status = 'FAILED'

    [gateway_error_handling.channel.idfc.status."PROXY_401".transfer."CBS:188"]
        cut_off_time = 8100
        final_status = 'FAILED'

    [gateway_error_handling.channel.idfc.status."CBS:7161".transfer."CBS:188"]
        cut_off_time = 8100
        final_status = 'FAILED'

    # ns:E404 - If the status check error code is ns:E404 and UTR is null, mark as FAILED
    # after cut_off_time, irrespective of the transfer init error code.
    # UTR-present case is handled in code (isNSE404WithoutUTR guard)
    [gateway_error_handling.channel.yesbank.status."ns:E404"]
        cut_off_time = 5400
        final_status = 'FAILED'

#This configuration is used to capture deemed cases for each attempt.
#error_codes: bank status codes which are used to identify deemed cases.
[deemed_cases_handling]
    error_codes = ["TXN_TIMEOUT_PENDING", "DEEMED_SUCCESS"]

[manual_action]
    attempt_count = 11
    use_status_policy = false

[kafka_producers]
    [kafka_producers.fire_transfer_status]
        name    = "fire_transfer_status"
        enabled = true
    [kafka_producers.fire_transfer_status.conf]
        retry_backoff       = 2
        topic               = "beta-fts-status-update-events"
        max_retry           = 10
        max_messages        = 100
        brokers             = ["stage-kafka.razorpay.in:9090"]
        enable_tls          = true
        debug_enabled       = false
        compression_enabled = false
        compression_type    = "snappy"
        user_certificate    = "user_certificate"
        user_key            = "user_key"
        ca_certificate      = "ca_certificate"

# If restricted routing is enabled for a merchant, when all the source account mappings
# are down we would not fall back to default source accounts, instead we would select the account
# with highest priority. Currently used for internal Settlements, Capital and PG merchants
