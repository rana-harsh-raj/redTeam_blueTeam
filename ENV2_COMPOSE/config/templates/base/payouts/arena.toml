    proxy_timeout       = "30s"
    # Timeout on buffered shadow legs (monolith forward / PS re-dispatch).
    shadow_timeout      = "10s"
    # Strict Splitz mode-resolution timeout; expiry falls back to proxy.
    splitz_timeout      = "100ms"
    # Semaphore pool bound for shadow goroutines; exhausted pool skips the
    # shadow leg (honored response is never affected).
    max_shadow_routines = 16

