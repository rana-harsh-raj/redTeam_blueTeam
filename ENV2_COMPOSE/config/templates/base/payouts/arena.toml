[app]
    appEnv                = "default"
    serviceName           = "payouts"
    hostname              = "payouts.razorpay.com"
    port                  = ":9400"
    metricPort            = ":8001"
    shutdownTimeout       = 60
    shutdownDelay         = 10
    gitCommitHash         = "nil"
    debug                 = false

[db]
    [db.master]
        dialect               = "mysql"
        protocol              = "tcp"
        url                   = "{{SVC.mysql_payouts.host}}"

        port                  = "{{SVC.mysql_payouts.port}}"

        username              = "{{SVC.mysql_payouts.user}}"

        password              = "{{SECRET.mysql_payouts_root_password}}"

        sslMode               = "disable"
        name                  = "{{SVC.mysql_payouts.dbname}}"

        maxOpenConnections    = 50
        maxIdleConnections    = 50
        connectionMaxLifetime = 0
    [db.replica]
        dialect               = "mysql"
        protocol              = "tcp"
        url                   = "{{SVC.mysql_payouts.host}}"

        port                  = "{{SVC.mysql_payouts.port}}"

        username              = "{{SVC.mysql_payouts.user}}"

        password              = "{{SECRET.mysql_payouts_root_password}}"

        sslMode               = "disable"
        name                  = "{{SVC.mysql_payouts.dbname}}"

        maxOpenConnections    = 50
        maxIdleConnections    = 50
        connectionMaxLifetime = 0
    [db.api]
        dialect               = "mysql"
        protocol              = "tcp"
        url                   = "{{SVC.mysql_apidb.host}}"

        port                  = "{{SVC.mysql_apidb.port}}"

        name                  = "{{SVC.mysql_apidb.dbname}}"

        username              = "{{SVC.mysql_apidb.user}}"

        password              = "{{SECRET.mysql_apidb_root_password}}"

        sslMode               = "disable"
        maxOpenConnections    = 5
        maxIdleConnections    = 2
        connectionMaxLifetime = 60
        debug                 = true

[tracing]
    ServiceName         = "payouts"
	Enabled             = false
	LogSpans            = false
	Host                = "localhost"
	Port                = "6831"
	MaxTagLengthValue   = "1024"
    [tracing.RequestHeaderExclusions]
        "Authorization"     = true
        "x-passport-jwt-v1" = true
        "x-pay-token"       = true
        "x-xsrf-token"      = true
    [[tracing.RouteURLsToExclude]]
        "/status"       = true
    [[tracing.RouteURLsToExclude]]
        "/commit.txt"   = true

[cache]
    driver                = "redis"
    [cache.redis]
        host            = "{{SVC.redis.host}}"

        port            = {{SVC.redis.port}}

        password        = ""

        database        = 0
        # Connection pool settings
        PoolSize      = 10
        MinIdleConns  = 2
        MaxConnAge    = 300
        IdleTimeout   = 200

[redis]
    host              = "{{SVC.redis.host}}"

    port              = {{SVC.redis.port}}

    password          = ""

    database          = 0
    dialect           = "redis"
    # Connection pool settings
    PoolSize          = 10
    MinIdleConns      = 2
    MaxConnAge        = 300
    IdleTimeout       = 0

