[queue]
    driver = "sqs"   # payouts vendors its own pkg/worker/queue: "sqs" honours [queue.sqs].endpoint (devstack.toml:131-135 uses the same LocalStack pattern)
    [queue.sqs]
        endpoint          = "http://localstack:4566/"   # signed with the synthetic env creds so LocalStack derives region ap-south-1 from SigV4 (anonymous requests fall back to us-east-1 -> NonExistentQueue)
        region            = "ap-south-1"
        prefix            = "{{SVC.localstack.url}}/000000000000/"

        maxRetries        = 5
        visibilityTimeout = 120
        waitTimeout       = 30
        [queue.sqs.httpClient]
            connectTimeoutMs        = 2000
            connKeepAliveMs         = 0
            expectContinueTimeoutMs = 0
            idleConnTimeoutMs       = 60000
            maxAllIdleConns         = 1000
            maxHostIdleConns        = 1000
            responseHeaderTimeoutMs = 25000
            tlsHandshakeTimeoutMs   = 2000

