ps_to_fts_paths:
  ps_monolith_create_fta_fts:
    description: PS fts_async_processing job -> POST /v1/payouts_service/create_fta/{id} (no body) -> monolith reads PS DB row (SELECT * FROM payouts WHERE id=?) -> builds FTS body -> POST fts /v1/transfer (1s sync timeout, async fallback via Initiator)
    selector: "!IsFTSRequestFromPayoutsService(ctx,payout) (Splitz ExperimentForFtsRequestFromPayoutsService + DCS payouts_to_fts_async_processing)"
    source: payouts/internal/app/payouts/core.go:5809-5891; pkg/api/fts_create.go:16,66-77; api/app/Models/Payout/Core.php:8273-8286,8461-8530; Repository.php:5313-5323; Processor/Base.php:235,1024-1132,4654-4740; Services/FTS/FundTransfer.php:313-356,424-551
    prod_default: this is the path the golden run exercises; Splitz value UNKNOWN
    twin: SUBSTITUTE (monolith-stub relay) — REPRESENTATIVE (brute-force merchant lookup, minimal FTS body, no 1s-timeout/async fallback)
  ps_fts_direct:
    description: PS calls FTS directly (pkg/fts) via FundTransferServiceProcessing
    selector: IsFTSRequestFromPayoutsService(ctx,payout) == true
    source: payouts/internal/app/payouts/core.go:5809-5891
    prod_default: UNKNOWN (Splitz ExperimentForFtsRequestFromPayoutsService)
    twin: "code REAL; exercised under ARENA_ROUTE_PROFILE=direct|direct-create-monolith-status|kafka (config/routes.py [configs.fts_request_from_ps] whitelist; retained run route-direct_success.jsonl shows preferred_source_account_id == source_account_id). Default profile monolith leaves it dormant (T05 §3, T07 §3)"

