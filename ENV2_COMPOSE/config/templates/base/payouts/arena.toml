    keepAliveTimeout = "600s"
    maxIdleConnections = 100
    httpClientName = "api"
    httpretryattempts = 3
    httpretrywindow = "60ms"
    httpmaxjitterinterval = "2ms"
    [api.auth]
        username = "rzp_live"
        password = "{{SECRET.auth_monolith_shared}}"   # arena: payouts -> monolith(-stub) identity = monolith-stub inbound (verifier-bridge/monolith)
