# fts build-spike arena config (env2-spike) — migration binary
# Copied from config/env.dev_local-migration.toml, pointed at the arena MySQL.
# cmd/migration only reads config.GetConfig().Database.Master, but we set
# both master fields consistently with env.arena.toml.

TITLE = "FTS Arena Spike Migrations Configuration"

[database]
    [database.master]
        HOST = "{{SVC.mysql_fts.host}}"
        PORT = {{SVC.mysql_fts.port}}
        NAME = "{{SVC.mysql_fts.dbname}}"
        USERNAME = "env|LIVE_MIGRATION_DB_USERNAME"
        PASSWORD = "env|LIVE_MIGRATION_DB_PASSWORD"

[integration.file.jpmc.v1.transfer.s3.push]
    bucket_name = "rzp-test-bucket"
    bucket_region = "ap-south-1"
    file_path = "jpmc/outgoing"
    internal_key = ""
[integration.file.jpmc.v1.transfer.s3.pull]
    bucket_name = "rzp-test-bucket"
    bucket_region = "ap-south-1"
    file_path = "jpmc/incoming"
    internal_key = ""
