[workflow]
    # {{WORKFLOW_HOST}} <- ARENA_WORKFLOW_HOST (.env.arena, loaded by
    # scripts/up.sh; config/generate.py falls back to the frozen dead address
    # http://127.0.0.1:1 if unset). M6 default: http://workflow-engine:8093.
    host = "{{WORKFLOW_HOST}}"
    # M6 note: 100ms is the REAL prod value and is kept. workflow-engine answers
    # Create from local SQLite in single-digit ms, so this is not a problem --
    # but it IS the reason a slow/cold engine surfaces as a payout create
    # failure rather than a hang, which is faithful to prod.
    timeout = "100ms"
    httpClientName = "api"
    httpretryattempts = 3
    httpretrywindow = "60ms"
    httpmaxjitterinterval = "2ms"
    [workflow.auth]
        username = "workflow"
        password = "workflow"
    [workflow.httpclient.resiliency]
        maxconcurrentrequests = 100
        requestvolumethreshold = 20
        circuitbreakersleepwindow = 5000
        errorpercentthreshold = 50
        circuitbreakertimeout = 10000
    [workflow.httpclient.httpclient]
        timeout = "100ms"

