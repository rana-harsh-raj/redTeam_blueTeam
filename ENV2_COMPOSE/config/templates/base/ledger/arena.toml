[app]
    appEnv                = "arena"
    appMode               = "test"
    serviceName           = "ledger"
    hostname              = "ledger.arena.local"
    port                  = "0.0.0.0:8080"   # arena: ledger-api must be reachable from payouts/fts/x-balances inside the arena network (upstream default is loopback)
    shutdownTimeout       = 2
    shutdownDelay         = 2
    gitCommitHash         = "nil"
    errorMappingServices  = ["platform/ledger", "pkg/spine"]
    logLevel              = "info"
    isMirror              = false
    isMakeshift           = false

[db]
    enableTrafficSplit                = false
    [db.rx]
        isEnabled                     = true
        [db.rx.writer]
            debug                     = true
            [db.rx.writer.ConnectionConfig]
                dialect               = "postgres"
                protocol              = "tcp"
                url                   = "{{SVC.postgres_ledger.host}}"
                port                  = "{{SVC.postgres_ledger.port}}"
                username              = "{{SVC.postgres_ledger.user}}"
                password              = "{{SECRET.postgres_ledger_password}}"
                sslMode               = "disable"
                name                  = "{{SVC.postgres_ledger.dbname}}"
            [db.rx.writer.ConnectionPoolConfig]
                maxOpenConnections    = 5
                maxIdleConnections    = 5
                connectionMaxLifetime = 0
                connectionMaxIdleTime = 0
        [db.rx.cache]
            isEnabled         = false
            isMcacheEnabled   = false
            defaultExpiration = 10
            cleanupInterval   = 5
    [db.pg]
        isEnabled                     = true
        [db.pg.writer]
            debug                     = true
            [db.pg.writer.ConnectionConfig]
                dialect               = "postgres"
                protocol              = "tcp"
                url                   = "{{SVC.postgres_ledger.host}}"
                port                  = "{{SVC.postgres_ledger.port}}"
                username              = "{{SVC.postgres_ledger.user}}"
                password              = "{{SECRET.postgres_ledger_password}}"
                sslMode               = "disable"
                name                  = "{{SVC.postgres_ledger.dbname}}"
            [db.pg.writer.ConnectionPoolConfig]
                maxOpenConnections    = 5
                maxIdleConnections    = 5
                connectionMaxLifetime = 0
                connectionMaxIdleTime = 0
        [db.pg.cache]
            isEnabled         = false
            isMcacheEnabled   = false
            defaultExpiration = 10
            cleanupInterval   = 5
    [db.makeshift]
        isEnabled                     = false
        [db.makeshift.writer]
            debug                     = true
            [db.makeshift.writer.ConnectionConfig]
                dialect               = "mysql"
                protocol              = "tcp"
                url                   = "127.0.0.1"
                port                  = "3306"
                username              = "root"
                password              = ""
                sslMode               = "disable"
                name                  = "" # set name of makeshift DB here; not used (isEnabled=false, no local MySQL stood up)
            [db.makeshift.writer.ConnectionPoolConfig]
                maxOpenConnections    = 5
                maxIdleConnections    = 5
                connectionMaxLifetime = 0
                connectionMaxIdleTime = 0
        [db.makeshift.cache]
            isEnabled                 = false
            isMcacheEnabled           = false
            defaultExpiration         = 10
            cleanupInterval           = 5


[apiDb]
    # Unused: Makeshift disabled (db.makeshift.isEnabled=false, app.isMakeshift=false) so
    # boot.go never calls InitApiTiDb()/dials this. Left pointing at localhost regardless.
    [apiDb.ConnectionConfig]
        dialect               = "mysql"
        protocol              = "tcp"
        url                   = "{{SVC.mysql_apidb.host}}"
        port                  = "{{SVC.mysql_apidb.port}}"
        username              = "{{SVC.mysql_apidb.user}}"
        password              = "{{SECRET.mysql_apidb_root_password}}"
        sslMode               = "disable"
        name                  = "{{SVC.mysql_apidb.dbname}}"
    [apiDb.ConnectionPoolConfig]
        maxOpenConnections    = 5
        maxIdleConnections    = 5
        connectionMaxLifetime = 0
        connectionMaxIdleTime = 0

[apiTiDb]
    # Unused, same as apiDb above.
    [apiTiDb.ConnectionConfig]
        dialect               = "mysql"
        protocol              = "tcp"
        url                   = "{{SVC.mysql_apidb.host}}"
        port                  = "{{SVC.mysql_apidb.port}}"
        username              = "{{SVC.mysql_apidb.user}}"
        password              = "{{SECRET.mysql_apidb_root_password}}"
        sslMode               = "disable"
        name                  = "{{SVC.mysql_apidb.dbname}}"
    [apiTiDb.ConnectionPoolConfig]
        maxOpenConnections    = 5
        maxIdleConnections    = 5
        connectionMaxLifetime = 0
        connectionMaxIdleTime = 0

[tracing]
    serviceName             = "ledger"
    enabled                 = false
    logSpans                = true
    host                    = "127.0.0.1"
    port                    = 6831

[telemetry]
    serviceName           = "ledger"
    serviceNamespace      = "platform/ledger"
    exporterHost          = "env|LEDGER_TELEMETRY_EXPORTER_HOST|127.0.0.1"
    exporterPort          = "env|LEDGER_TELEMETRY_EXPORTER_PORT|4318"
    samplingRatio         = 1.0
    enableHTTPClientSpans = true
    httpSkipPaths         = ["/health", "/healthz", "/ready", "/readiness", "/live", "/liveness", "/metrics", "/twirp/rzp.common.health.v1.HealthCheckAPI/Check", "/commit.txt"]
    enableCanonicalLogs   = false
    enableTraceCorrelation = false

    [telemetry.spanLimits]
        attributeValueLengthLimit = 4096
        attributeCountLimit       = 1000

