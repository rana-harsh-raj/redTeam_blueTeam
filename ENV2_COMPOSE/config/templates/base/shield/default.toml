    hardDeleteAfterDays = 180

# Card WAF block (stage 3) — detects a single card hammered across merchants/IPs, mirroring the IP
# subject on the shared penaltybox core. card_number is sourced from the Stage-2 enrich store
# (AES-256, recovered in-process) and stored as its deterministic AES-256-GCM ciphertext — the same
# value the enrich store persists, the raw PAN is never stored. Disabled by default; windows/weights
# are placeholders pending analytics (no card-spray term). The card_number cipher key/IV are the
# [paymentEnrich] encryptionKey/encryptionIV (Kubestash/credstash), shared so both sides agree.
[cardWafBlock]
    enabled = true
    redisKeyTTLSeconds = 1200

    [cardWafBlock.repeatOffender]
        enabled = false
        shadowMode = true
        lookbackDays = 7
        minPriorBlocks = 1
        durationMultiplier = 2.0
        maxBlockDurationSeconds = 86400

    [cardWafBlock.observers.slack]
        enabled = true
        mock = false
        # Bot token from credstash per env (never the raw token in config).
        botToken = "env|CARDWAFBLOCK_OBSERVERS_SLACK_BOTTOKEN"
        channel = "C0BUEC51ZD4"
        timeoutMs = 2000
        notifyNewBlocks = true
        notifyEscalations = true
        escalationCooldownSeconds = 3600
        userTags = []
        groupTags = []

    [cardWafBlock.observers.kafka]
        enabled = false

    [cardWafBlock.windows.w1]
        name = "w1_300s"
        durationSeconds = 300
        blockThresholdScore = 0.12
        minAttemptsRequired = 3
        minDeclineRateRequired = 0.0
        blockDurationSeconds = 300
        microTxnAmountThreshold = 10
        [cardWafBlock.windows.w1.weights]
            declineRate = 0.35
            microTxnRatio = 0.25
            merchantSpray = 0.40

    [cardWafBlock.windows.w2]
        name = "w2_600s"
        durationSeconds = 600
        blockThresholdScore = 0.25
        minAttemptsRequired = 4
        minDeclineRateRequired = 0.0
        blockDurationSeconds = 900
        microTxnAmountThreshold = 20
        [cardWafBlock.windows.w2.weights]
            declineRate = 0.30
            microTxnRatio = 0.25
            merchantSpray = 0.45

[paymentEnrich]
    enabled = true
    ttlSeconds = 3600
    encryptionKey = "0123456789abcdef0123456789abcdef"
    encryptionIV = "abcdef0123456789"

[telemetry]
    enabled               = true
    serviceName           = "shield"
    serviceNamespace      = "rzp/payments"
    environment           = "development"
    exporterHost          = "localhost"
    exporterPort          = "4318"
    samplingRatio         = 1.0
    # /v1/status is the kubelet probe: it sends the pod IP:port as its Host header and the
    # inbound span name embeds Host, so tracing it mints one span name per pod. Skipped in
    # every env — keep this array's element order identical in every conf/<env>.toml, viper
    # merges slices element-wise (see app/config/config_test.go).
    httpSkipPaths         = ["/commit.txt", "/metrics", "/v1/status"]
    disableClientSpans    = false   # CLIENT spans ON; pin vs goutils default drift

# clients: per-downstream egress control surface (app/clients). See app/clients/README.md
# for config examples (resilience opt-in, transport tuning). Whole-call timeouts are
# driven here via requestTimeoutMs.
[clients]
    [clients.global]
        requestTimeoutMs = 30000
        circuit_breaker = "off"
        bulkhead        = "off"
        retry_max       = 0
        # parity floor: internal downstreams use http.DefaultTransport; a bespoke
        # [.transport] block opts back out via shared_transport=false. See README.
        shared_transport = true

    # ⚠️ INERT when shared_transport = true (the global default above).
    # baseTransport returns lazyDefaultTransport (http.DefaultTransport) for every
    # shared downstream, so none of the values below reach the wire — the effective
    # MaxIdleConnsPerHost is http.DefaultTransport's 2, NOT the 10 set here.
    # This block only takes effect for a downstream that sets shared_transport = false
    # and does NOT carry its own [clients.downstreams.<slug>.transport] block (in which
    # case the downstream's own block wins). Today every non-shared downstream carries
    # its own block, so this is a fallback that nothing exercises.
    # Pinned by TestGlobalTransport_InertWhenSharedTransportTrue in factory_test.go.
    [clients.global.transport]
        max_conns_per_host      = 0
        max_idle_conns          = 100
        max_idle_conns_per_host = 10
        idle_conn_timeout       = "90s"
        dial_timeout            = "5s"
        keep_alive              = "30s"
        tls_handshake_timeout   = "10s"
        expect_continue_timeout = "1s"
        force_attempt_http2     = true

    # external = true marks a third-party vendor: egress emits our CLIENT span but
    # strips every trace-context/correlation header on the wire (nothing leaks).
    # Classification is NOT config-only: clients.mustBeExternal is the in-code default, so a
    # vendor slug with no block here still resolves external (fail-closed). What config adds is
    # the loud path — app/clients.Factory.validateDownstreams REJECTS a configured vendor block
    # that omits the flag or sets external=false. It does NOT panic: clients.Init RETURNS that
    # error, app.Setup aborts boot on it, and main.go logs "boot failed" + exit 1.
    # This file is the merge base in every env
    # served by dockerconf/entrypoint.sh (it runs `cp conf/default.toml conf/dev.toml`,
    # and pkg/config loads conf/dev.toml then merges conf/$APP_MODE.toml), so the flag
    # set here covers those envs. It is NOT loaded where a build overwrites the base:
    # build/docker/slit/Dockerfile copies conf/stage.toml and dockerconf/ci-codegen.sh
    # copies conf/testing.toml, so those two files carry their own [clients] block.
    [clients.downstreams.abuseipdb]
        requestTimeoutMs = 2000
        external         = true

    [clients.downstreams.riskalert]
        requestTimeoutMs = 2000

    [clients.downstreams.slack]
        requestTimeoutMs = 2000
        external         = true

    [clients.downstreams.watchtower]
        requestTimeoutMs = 30000
        shared_transport = false   # keep the bespoke HTTP/1.1 transport below (overrides global)
        [clients.downstreams.watchtower.transport]
            dial_timeout            = "10s"
            keep_alive              = "30s"
            tls_handshake_timeout   = "10s"
            response_header_timeout = "20s"
            expect_continue_timeout = "1s"
            max_idle_conns          = 100
            max_idle_conns_per_host = 10
            idle_conn_timeout       = "90s"
            force_attempt_http2     = false

    # internal downstreams (full trace propagation). The values below are the dev ones;
    # each conf/<env>.toml merges over this file and overrides requestTimeoutMs to match
    # its own [pinot]/[wda].timeoutMs (see conf/prod.toml, conf/stage.toml).
    [clients.downstreams.pinot]
        requestTimeoutMs = 3000

    [clients.downstreams.wda]
        requestTimeoutMs = 10000

    [clients.downstreams.cbprealtime]
        requestTimeoutMs = 2000

    [clients.downstreams.itrm]
        requestTimeoutMs = 500     # [itrm].timeoutMs

    # itrmv2's legacy budget (50s) is LARGER than [clients.global].requestTimeoutMs (30s), so
    # this block is not optional: drop it and ITRM v2 silently loses 20s of budget. Every conf
    # file that is a merge base must repeat it (conf/stage.toml, conf/testing.toml).
    [clients.downstreams.itrmv2]
        requestTimeoutMs = 50000   # [itrmV2].timeoutMs

    # cybersource (api.in.cybersource.com) is a third-party vendor: external = true strips
    # every trace/correlation header on the wire while still emitting our own CLIENT span.
    # The HMAC signature is unaffected — it covers host/date/(request-target)/digest/
    # v-c-merchant-id, none of which the strip transport touches.
    # This file's [cybersource] block has no timeoutMs, so the legacy client here was
    # UNBOUNDED (http.Client{Timeout: 0}). The factory cannot express unbounded, so the value
    # below is the 3000 that every real env (prod/stage/automation/bvt/e2e/slit) already sets.
    [clients.downstreams.cybersource]
        requestTimeoutMs = 3000    # [cybersource].timeoutMs in every env that sets one
        external         = true

    [clients.downstreams.acs]
        requestTimeoutMs = 2000    # [acs].timeoutMs (2000 in every env)

    # cms diverges per env (2000 on prod/rzpx*, 10000 on dev/stage), so those files carry
    # their own override — see conf/prod.toml, conf/rzpxprod.toml, conf/rzpx_sbic_prod.toml.
    [clients.downstreams.cms]
        requestTimeoutMs = 10000   # [cms].timeoutMs

    # elasticsearch has no legacy timeout anywhere: olivere/elastic defaulted to
    # http.DefaultClient, i.e. unbounded. The factory has no way to express unbounded (it
    # floors at clients.defaultRequestTimeout), so this pins the same 30s as
    # [clients.global].requestTimeoutMs and makes the new bound explicit rather than inherited.
    [clients.downstreams.elasticsearch]
        requestTimeoutMs = 30000

    # ---- wave 3: the two remaining held clients ------------------------------------------
    # Both were on a bare &http.Client{} (i.e. http.DefaultTransport), so neither had a
    # bespoke connection pool to preserve: they stay on [clients.global].shared_transport =
    # true and get NO [.transport] block. Adding one here would be a pooling change, not a
    # migration.

    # cybersafe.gov.in:8443 — Government of India CyberSafe portal, a third party.
    # external = true strips traceparent/tracestate/baggage/X-Razorpay-Request-Id on the
    # wire; the postback's `Authorization: Bearer` header is not on that list and survives.
    [clients.downstreams.cybersafe]
        requestTimeoutMs = 5000    # the 5s http.Client.Timeout the postback client hard-coded
        external         = true

    # hooks.slack.com — Slack Incoming WebHooks, a third party. Distinct from the `slack`
    # slug above, which is the bot-token Web API on slack.com (see downstreams.go).
    # The legacy client was slackhook.New()'s http.DefaultClient, i.e. Timeout 0 =
    # UNBOUNDED, so this is a deliberate new bound rather than a preserved one: an
    # unbounded webhook POST on the alerting path is its own hazard. 3000 gives more
    # headroom than the Web API's 2000 because this path has no retry and drops the alert
    # on timeout, while still bounding it (Slack's webhook p99 is well under 1s).
    [clients.downstreams.alertingslack]
        requestTimeoutMs = 3000
        external         = true

    # ---- wave 4: the last held client ----------------------------------------------------
    # api.sift.com — third-party fraud-scoring vendor. external = true strips
    # traceparent/tracestate/baggage/X-Razorpay-Request-Id/X-Devstack-Label on the wire.
    # Sift's credentials are not on that list: the $create_order/$transaction/$chargeback
    # events carry the key inside the JSON body ($api_key) and the apply_decision call uses
    # HTTP Basic auth, i.e. an `Authorization` header — so auth survives on both paths.
    # This file's [sift] block has no timeoutMs, so the legacy client here was UNBOUNDED
    # (http.Client{Timeout: 0}). The factory cannot express unbounded, so the value below is
    # the 2000 that every env setting one already uses (prod/stage/automation/bvt/e2e/slit/
    # testing) — the same call already made for cybersource/elasticsearch above.
    # The legacy client was a bare &http.Client{} (i.e. http.DefaultTransport), so it stays on
    # [clients.global].shared_transport = true and gets NO [.transport] block; adding one
    # would be a pooling change, not a migration. Sift has no hystrix and keeps its own
    # in-process retry loop, so no resilience policy is opted in here either.
    [clients.downstreams.sift]
        requestTimeoutMs = 2000    # [sift].timeoutMs in every env that sets one
        external         = true

    # harvester — Razorpay's internal analytics/PQL service (analytics/pokedex). Migrated off
    # heimdall.NewHystrixHTTPClient(time.Second*5, ...) in app/providers/harvester.go.
    #
    # 5000 preserves the EFFECTIVE whole-call budget verbatim: the legacy client set BOTH the
    # heimdall client timeout (time.Second*5) AND the hystrix command Timeout (5000ms) to five
    # seconds, so 5s was the bound either way.
    #
    # NO external flag: harvester is a Razorpay-internal host, so it keeps full trace propagation.
    #
    # RESILIENCE DELTA — deliberate, and larger than "the circuit breaker". Only two hystrix
    # fields were set explicitly (ErrorPercentThreshold 20, Timeout 5000); hystrix DEFAULTS filled
    # the rest, so the real effective baseline was: ErrorPercentThreshold 20, command Timeout
    # 5000ms, MaxConcurrentRequests 10 (i.e. it was also a BULKHEAD), RequestVolumeThreshold 20,
    # SleepWindow 5000ms, retries 0, failure predicate = transport error OR status >= 500. The
    # breaker, the bulkhead, the volume threshold and the sleep window are all gone. Heimdall also
    # set request.Close = true, so the baseline used NO keep-alive; the factory client pools on
    # http.DefaultTransport — a change, and an improvement.
    #
    # Not re-expressed via config because it CANNOT be: policy.PolicyConfig exposes only the
    # breaker owner string, so circuit_breaker = "sdk" would give SDK defaults (50%, not 20%) — a
    # different breaker, not a restoration (goutils gap F4). Note also that
    # [clients.global].circuit_breaker = "off" is PRE-EXISTING (8465dd997 conf/default.toml:589),
    # not a weakening introduced with this migration.
    #
    # Acceptable ONLY because harvesterClient.Query is UNREACHABLE: its sole caller
    # app/services/params/harvester.go was deleted 2023-07-21 in 588728a45 "Removed Harvester
    # Params", and today only Setup() is called (app/app.go:203 + three test harnesses), which
    # builds a client and reads config but issues no request. If Query ever becomes reachable the
    # delta is real — unbounded concurrency instead of shedding at 10, and +5s tail latency on a
    # slow-but-alive harvester instead of fast-fail once the circuit opened. Revisit this line
    # first. The cleaner fix is deleting the dead client (app/clients/README.md T6).
    [clients.downstreams.harvester]
        requestTimeoutMs = 5000    # the 5s heimdall/hystrix budget the legacy client hard-coded

    # ---- cross-border egress (wave 2) ---------------------------------------------------
    # These four came off app/crossBorder/app/integrations/httpClient (sardine, accertify,
    # shieldus) and .../stripe_radar (striperadar). READ THIS BEFORE CHANGING A NUMBER:
    # that wrapper set http.Client.Timeout to *connectTimeoutMs*, so the connect budget was
    # also the whole-call budget. requestTimeoutMs below therefore mirrors each service's
    # legacy [<svc>.httpClient].connectTimeoutMs — NOT [sardine.httpClient].requestTimeoutMs,
    # which the wrapper never read (striperadar is the exception: its vendored client did read
    # RequestTimeoutMs, so 2500 is [stripe.httpClient].requestTimeoutMs).
    # The [<svc>.httpClient] blocks above are now dead for these four; they are left in place
    # because config_mapping.go still exports their keys.

    # api.sardine.ai — third-party risk vendor.
    [clients.downstreams.sardine]
        requestTimeoutMs = 1000    # [sardine.httpClient].connectTimeoutMs
        external         = true
        shared_transport = false   # own pool, restoring [sardine.httpClient]'s tuning
    [clients.downstreams.sardine.transport]
        max_idle_conns         = 1000
        max_idle_conns_per_host = 1000
        idle_conn_timeout      = "90s"
        dial_timeout           = "1s"
        keep_alive             = "30s"
        response_header_timeout = "2s"
        tls_handshake_timeout  = "1s"
        expect_continue_timeout = "500ms"

    # icnow01.accertify.net — third-party risk vendor.
    [clients.downstreams.accertify]
        requestTimeoutMs = 7000    # [accertify.httpClient].connectTimeoutMs
        external         = true
        shared_transport = false   # own pool, restoring [accertify.httpClient]'s tuning
    [clients.downstreams.accertify.transport]
        max_idle_conns         = 1000
        max_idle_conns_per_host = 1000
        idle_conn_timeout      = "90s"
        dial_timeout           = "7s"
        keep_alive             = "30s"
        response_header_timeout = "3s"
        tls_handshake_timeout  = "7s"
        expect_continue_timeout = "1s"

    # api.stripe.com — third-party risk vendor, reached only from the Shield US deployment.
    [clients.downstreams.striperadar]
        requestTimeoutMs = 2500    # [stripe.httpClient].requestTimeoutMs (this client did read it)
        external         = true
        shared_transport = false   # own pool, restoring [stripe.httpClient]'s tuning
    [clients.downstreams.striperadar.transport]
        max_idle_conns         = 1000
        max_idle_conns_per_host = 1000
        idle_conn_timeout      = "90s"
        dial_timeout           = "1s"
        keep_alive             = "30s"
        response_header_timeout = "2s"
        tls_handshake_timeout  = "1s"
        expect_continue_timeout = "500ms"

    # Shield's own US-region deployment (/v1/stripe-radar/proxy) — INTERNAL. Deliberately no
    # `external` flag: setting it would strip traceparent and split the India<->US trace in
    # two while the CLIENT span kept emitting, so no dashboard would show the loss.
    # app/clients.mustBeExternal omits shieldus for the same reason.
    [clients.downstreams.shieldus]
        requestTimeoutMs = 7000    # [shieldUs.httpClient].connectTimeoutMs

        shared_transport = false   # own pool, restoring [shieldUs.httpClient]'s tuning
    [clients.downstreams.shieldus.transport]
        max_idle_conns         = 1000
        max_idle_conns_per_host = 1000
        idle_conn_timeout      = "90s"
        dial_timeout           = "7s"
        keep_alive             = "30s"
        response_header_timeout = "3s"
        tls_handshake_timeout  = "7s"
        expect_continue_timeout = "1s"
[preAuth]
    enabled = false
