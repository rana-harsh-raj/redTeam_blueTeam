[downtime_v2_notification_config]
    enabled = true
    retry_count = 3
    retry_backoff = 1

[update_transaction_amount_for_fav]
    [update_transaction_amount_for_fav.fund_account_validation_details.SLICE.PAISA_DROP]
        AMOUNT = 1
[xas]
    #All XAS timeouts and intervals are in milliseconds
    enabled = true
    host = "https://x-account-statements.dev.razorpay.in"
    timeout = 30000
    http_client_name = "xas-client"
    http_retry_attempts = 3
    http_retry_window = 10000
    http_max_jitter_interval = 1000
    [xas.auth]
        key = "env|XAS_AUTH_KEY"
        secret = "env|XAS_AUTH_SECRET"
    [xas.http_client]
        timeout = 30000
        keep_alive_timeout = 30000
        max_idle_connections = 100
    [xas.hystrix_resiliency]
        max_concurrent_requests = 100
        request_volume_threshold = 20
        circuit_breaker_sleep_window = 5000
        error_percent_threshold = 50
        circuit_breaker_timeout = 30000

[retry_transfer_preprocessor]
    max_retry_count = 3
    retry_delay_in_secs = 0
    max_counter_skips = 3

[retry_transfer_preprocessor.error_groups]
    re_enqueue_eligible = [
        "DEBIT_ENTRY_EXIST_IN_STATEMENT",
        "RETRY_TRANSFER_ENQUEUE_FAILED",
        "DOWNTIME_EXISTS_FOR_TRANSFER_RETRY",
        "FAILED_TO_CHECK_DOWNTIME_FOR_TRANSFER_RETRY",
        "XAS_FETCH_ACCOUNT_STATEMENT_BY_MULTIPLE_REFERENCES_IS_EMPTY",
        "XAS_FETCH_ACCOUNT_STATEMENT_BY_MULTIPLE_REFERENCES_SERVICE_FAILURE",
        "MISSING_DEBIT_AND_CREDIT_ENTRY_IN_STATEMENT"
    ]
    terminal_state = [
        "UNABLE_TO_FETCH_SOURCE_ACCOUNT"
    ]
    skip_counter_inc = [
        "RETRY_TRANSFER_ENQUEUE_FAILED",
        "DOWNTIME_EXISTS_FOR_TRANSFER_RETRY",
        "FAILED_TO_CHECK_DOWNTIME_FOR_TRANSFER_RETRY",
        "XAS_FETCH_ACCOUNT_STATEMENT_BY_MULTIPLE_REFERENCES_SERVICE_FAILURE"
    ]
    re_enqueue_exhausted_retryable = [
        "MISSING_DEBIT_AND_CREDIT_ENTRY_IN_STATEMENT",
        "XAS_FETCH_ACCOUNT_STATEMENT_BY_MULTIPLE_REFERENCES_IS_EMPTY"
    ]

[retry_transfer_preprocessor.status_update]
    INTERVAL=0
    COUNT=3

[retry_transfer_preprocessor.enabled_merchants]
    MERCHANT_LIST = ["JIOwGGFeklX55j"]

[retry_transfer_preprocessor.source_update]
    INTERVAL=0
    COUNT=3

[telemetry]
    serviceName = "fts"
    serviceNamespace = "payouts"
    environment = "development"
    exporterHost = "env|TELEMETRY_EXPORTERHOST"
    exporterPort = "4318"
    samplingRatio = 1.0
