    # pass: `go build` of a real ../mozart clone fails on the private module
    # `github.com/razorpay/integrations-utils` (404 for the build identity
    # used), independent of anything in this scaffold -- see
    # substitutes/mozart-sim/CONTRACT.md's header for the full note.
    # mozart-sim (below) is the PRIMARY Mozart substitute; this service is
    # kept, defined but inert by default, in case a working
    # integrations-utils credential becomes available later -- explicitly
    # enable with `--profile mozart-real` (and a real MOZART_BUILD_CONTEXT)
    # if you have one. See build/mozart.Dockerfile and
    # substitutes/mozart-mock/CONTRACT.md for the rest of the (still
    # unconfirmed, since it's never successfully built) `-mock` boot story.
    build:
      # PLACEHOLDER: must be set to an ABSOLUTE path to a real `mozart` repo
      # clone before building this service -- e.g. export
      # MOZART_BUILD_CONTEXT=/path/to/mozart/clone (build.sh does this for
      # you by reading it from .env.arena). `docker compose config` still
      # validates the YAML shape without that path existing (build.context
      # is not existence-checked by `config`, only by an actual build/up).
      context: ${MOZART_BUILD_CONTEXT:-./build/_mozart_context_not_configured}
      # ABSOLUTE path to this scaffold's build/mozart.Dockerfile -- kept
      # outside `context` (the mozart repo) since we don't modify repo
      # clones. build.sh exports MOZART_DOCKERFILE_ABS=$(pwd)/build/mozart.Dockerfile.
      dockerfile: ${MOZART_DOCKERFILE_ABS:-./build/mozart.Dockerfile}
